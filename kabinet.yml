overwrite: true
schema:
  "http://jhnnsrs-lab/kabinet/schema":
    handleAsSDL: true
documents: "graphql/kabinet/**/*.graphql"
generates:
  src/renderer/src/kabinet/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  src/renderer/src/kabinet/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/kabinet/api/hooks"
      # Reference fragment types by name instead of inlining them: the deep port
      # fragments otherwise blow graphql.ts up to tens of MB and stall tsc.
      inlineFragmentTypes: combine
  src/renderer/src/kabinet/graphql.schema.json:
    plugins:
      - "introspection"

  graphql/schemas/kabinet.graphql:
    plugins:
      - schema-ast
