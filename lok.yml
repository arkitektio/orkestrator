overwrite: true
schema:
  "https://go.arkitekt.live/lok/schema":
     handleAsSDL: true

documents: "graphql/lok-next/**/*.graphql"
generates:
  src/renderer/src/lok/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  src/renderer/src/lok/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/lok/api/hooks"
      # Reference fragment types by name instead of inlining them: deep fragments
      # otherwise blow graphql.ts up to many MB and stall tsc.
      inlineFragmentTypes: combine
  src/renderer/src/lok/graphql.schema.json:
    plugins:
      - "introspection"
  graphql/schemas/lok-next.graphql:
    plugins:
      - schema-ast
