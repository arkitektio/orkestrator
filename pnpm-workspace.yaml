# pnpm 11 no longer reads the "pnpm" field in package.json — every setting that
# used to live there belongs here instead. See https://pnpm.io/settings

# Was `resolutions: { vite }` under yarn. It exists because yarn classic used to
# throw "could not find a copy of vite to link" when the tree carried more than
# one vite major. Keep it until pnpm has proven stable for a release cycle, then
# try dropping it — vite is already a direct devDependency, and `pnpm why vite`
# should still show a single 7.x without the pin.
overrides:
  vite: ^7.2.6

  # react-router MUST be a single instance or every <Routes> throws
  # "useRoutes() may be used only in the context of a <Router> component":
  # <HashRouter> comes from react-router-dom, and a second copy of react-router
  # means a second React context.
  #
  # Two things pull it in besides react-router-dom (which pins it exactly):
  # nuqs declares react-router as an OPTIONAL PEER (^5 || ^6 || ^7), and
  # auto-install-peers=true in .npmrc happily satisfies that with whatever the
  # newest 6.x is — which is how 6.30.3 and 6.30.4 ended up side by side.
  #
  # Keep this pinned to exactly the version react-router-dom depends on, and
  # bump both together. Verify with: pnpm why react-router  ->  1 version.
  react-router: 6.30.4

# pnpm 10+ blocks dependency lifecycle scripts unless they are listed here.
# Written by `pnpm approve-builds`; keep it that way rather than hand-editing.
#   esbuild             - postinstall resolves the platform binary; vite needs it
#   @parcel/watcher     - install script; falls back to the prebuilt platform pkg
#   electron-winstaller - install script picks the 7-Zip arch (local, no download)
#   msw                 - postinstall is `.catch(() => void 0)`; nothing to run
# NOTE: electron@43 is deliberately absent — it has no scripts field at all, so
# there is nothing here to block. Its 295M binary is NOT fetched at install time
# either: upstream dropped the postinstall and replaced it with a lazy download
# inside electron/index.js, which only fires on `require('electron')` from node.
# electron-vite never does that — it reads node_modules/electron/path.txt itself
# and throws "Electron uninstall" — so the root postinstall in package.json runs
# electron/install.js explicitly. It is a no-op once dist/ is present.
allowBuilds:
  '@parcel/watcher': true
  electron-winstaller: true
  esbuild: true
  msw: false

patchedDependencies:
  three: patches/three.patch

minimumReleaseAgeExclude:
  - hyparquet-writer@0.16.9
  - '@arkitektio/bsx'
