overwrite: true
schema:
  "http://jhnnsrs-lab/rekuest/schema":
    handleAsSDL: true

documents: "graphql/rekuest-next/**/*.graphql"
generates:
  src/renderer/src/rekuest/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  src/renderer/src/rekuest/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      arrayInputCoercion: false
      apolloReactHooksImportFrom: "@/rekuest/api/hooks"
      # Reference fragment types by name instead of inlining them: the deep port
      # fragments otherwise blow graphql.ts up to tens of MB and stall tsc.
      inlineFragmentTypes: combine
      # One type on both sides: the port engine in @arkitektio/bsx owns these, and an enum
      # declared twice is two types.
      enumValues:
        AssignWidgetKind: "@arkitektio/bsx/ports/rekuest#AssignWidgetKind"
        DescriptorOperator: "@arkitektio/bsx/ports/rekuest#DescriptorOperator"
        EffectKind: "@arkitektio/bsx/ports/rekuest#EffectKind"
        OptionKey: "@arkitektio/bsx/ports/rekuest#OptionKey"
        PortKind: "@arkitektio/bsx/ports/rekuest#PortKind"
        ReturnWidgetKind: "@arkitektio/bsx/ports/rekuest#ReturnWidgetKind"
      scalars:
        # 64-bit byte counts (store sizes, upload limits): a JSON number.
        ByteCount: "number"
  src/main/schemas/rekuest.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-graphql-request"
  graphql/schemas/rekuest.graphql:
    plugins:
      - schema-ast

