overwrite: true
schema:
  "http://jhnnsrs-lab/lovekit/schema":
    handleAsSDL: true
documents: "graphql/lovekit/**/*.graphql"
generates:
  src/renderer/src/lovekit/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  src/renderer/src/lovekit/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/lovekit/api/funcs"
      # Reference fragment types by name instead of inlining them: deep fragments
      # otherwise blow graphql.ts up to many MB and stall tsc.
      inlineFragmentTypes: combine
  src/renderer/src/lovekit/graphql.schema.json:
    plugins:
      - "introspection"
  graphql/schemas/lovekit.graphql:
    plugins:
      - schema-ast
