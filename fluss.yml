overwrite: true
schema:
  "http://jhnnsrs-lab/fluss/schema":
    handleAsSDL: true
documents: "graphql/fluss-next/**/*.graphql"
generates:
  src/renderer/src/fluss/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  src/renderer/src/fluss/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/fluss/api/hooks"
      # Reference fragment types by name instead of inlining them: the deep port
      # fragments otherwise blow graphql.ts up to tens of MB and stall tsc.
      inlineFragmentTypes: combine
  src/renderer/src/fluss/graphql.schema.json:
    plugins:
      - "introspection"

  graphql/schemas/fluss.graphql:
    plugins:
      - schema-ast
