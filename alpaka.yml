overwrite: true
schema:
  "http://jhnnsrs-lab/alpaka/schema":
    handleAsSDL: true
documents: "graphql/alpaka/**/*.graphql"
generates:
  src/renderer/src/alpaka/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  src/renderer/src/alpaka/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/alpaka/api/funcs"
      # Reference fragment types by name instead of inlining them: deep fragments
      # otherwise blow graphql.ts up to many MB and stall tsc.
      inlineFragmentTypes: combine

  src/renderer/src/alpaka/graphql.schema.json:
    plugins:
      - "introspection"

  graphql/schemas/alpaka.graphql:
    plugins:
      - schema-ast
