overwrite: true
schema: "http://jhnnsrs-lab/omeroark/graphql"
documents: "graphql/omero-ark/**/*.graphql"
generates:
  src/renderer/src/omero-ark/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  src/renderer/src/omero-ark/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/lib/omero-ark/funcs"
      # Reference fragment types by name instead of inlining them: deep fragments
      # otherwise blow graphql.ts up to many MB and stall tsc.
      inlineFragmentTypes: combine

  src/renderer/src/omero-ark/graphql.schema.json:
    plugins:
      - "introspection"

  graphql/schemas/omero_ark.graphql:
    plugins:
      - schema-ast
