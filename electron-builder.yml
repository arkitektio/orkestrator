appId: live.arkitekt.orkestrator
productName: Orkestrator
electronVersion: 43.1.0  # Use your specific version here
electronLanguages: ["en", "en-US"]
publish:
  provider: github
  owner: arkitektio
  repo: orkestrator
  releaseType: release # must be published (not draft) to update
# Emit latest.yml + beta.yml (+ alpha.yml) on every build so the "Next"
# channel (which rides beta.yml) rolls forward to stable once a stable ships.
generateUpdatesFilesForAllChannels: true

directories:
  buildResources: build
files:
  - "out/**/*"
  - "!**/locales/*"
  - "**/locales/en-US.pak"
  - "**/locales/de.pak"
  - "public/**/*"
  - "package.json"
  - "resources/**/*"
  # The mesh sidecar is an executable: it cannot run from inside the asar, so
  # it ships via extraResources below instead of the bundle.
  - "!resources/meshd/**"
asar: true
# The mesh sidecar (tools/meshd, Go; built by scripts/build-meshd.mjs into
# resources/meshd/<os>-<arch>/). Lands in <resourcesPath>/meshd/, which is
# where src/main/mesh/meshdLocate.ts looks in a packaged build. On macOS it
# is a Mach-O under Contents/Resources and is signed with the app.
extraResources:
  - from: "resources/meshd/${os}-${arch}"
    to: "meshd"
    filter: ["**/*"]
# The voice engine's native addon and its shared libraries cannot be loaded
# from inside the asar archive; they stay unpacked next to it.
asarUnpack:
  - "node_modules/sherpa-onnx-node/**"
  - "node_modules/sherpa-onnx-*/**"
win:
  executableName: orkestrator
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: # IMPORTANT: both dmg + zip for auto-update
    - dmg
    - zip
  entitlements: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    - NSAllowsArbitraryLoads: Application requests access to make insecure http requests.
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
  sign: true
linux:
  target:
    - AppImage
    - deb
  maintainer: arkitekt.live
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
afterPack: "scripts/remove-locales.cjs"
