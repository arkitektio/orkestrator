# Read credentials for a message's attachment bytes, signed client-side
# (presignS3Url). Asked for only when an attachment is shown or saved.
query MessageAttachmentAccess($message: ID!) {
  message(id: $message) {
    id
    attachments {
      id
      contentId
      filename
      store {
        id
        accessGrant {
          ...BigFileAccessGrant
        }
      }
    }
  }
}
