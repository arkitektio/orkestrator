mutation PushMailChanges($account: ID!) {
  pushMailChanges(account: $account) {
    pushed
    failed
    pending
    account {
      ...ListMailAccount
    }
  }
}

# Queue failed changes again: these `changes`, and every failed change of `account`.
mutation RetryMailChanges($changes: [ID!], $account: ID) {
  retryMailChanges(changes: $changes, account: $account) {
    ...MailChange
  }
}

# Push the due changes of several mailboxes in one call: these `accounts`, or
# (null) every visible mailbox with pending changes.
mutation PushAllMailChanges($accounts: [ID!]) {
  pushAllMailChanges(accounts: $accounts) {
    pushed
    failed
    pending
    account {
      ...ListMailAccount
    }
  }
}

mutation UndoMailChanges($input: UndoMailChangesInput!) {
  undoMailChanges(input: $input) {
    ...MessageState
  }
}

mutation RevertMessagesToServer($messages: [ID!]!) {
  revertMessagesToServer(messages: $messages) {
    ...MessageState
  }
}
