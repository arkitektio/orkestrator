fragment Address on Address {
  name
  address
}

fragment ListMessage on Message {
  id
  subject
  senderName
  senderAddress
  date
  snippet
  isRead
  isFlagged
  isAnswered
  hasAttachments
  syncState
  categories {
    ...CategoryChip
  }
  account {
    id
    name
    emailAddress
    canSend
  }
  folder {
    id
    name
    role
  }
  thread {
    id
    messageCount
  }
}

# A mail without its body: what a card's header, a folded card and a reply need.
fragment MessageHeader on Message {
  ...ListMessage
  messageId
  receivedAt
  hasRemoteImages
  size
  flags
  serverFlags
  changes {
    ...MailChange
  }
  truncated
  sender {
    ...Address
  }
  replyTo {
    ...Address
  }
  to {
    ...Address
  }
  cc {
    ...Address
  }
  bcc {
    ...Address
  }
  attachments {
    ...Attachment
  }
}

# The body, asked for only when a card is open.
fragment MessageBody on Message {
  id
  textBody
  html(allowRemote: $allowRemote)
}

fragment Message on Message {
  ...MessageHeader
  ...MessageBody
}
