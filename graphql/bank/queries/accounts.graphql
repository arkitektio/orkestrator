query ListBankAccounts(
  $filters: BankAccountFilter
  $ordering: [BankAccountOrder!]! = [{ kind: ASC }, { name: ASC }]
  $pagination: OffsetPaginationInput
) {
  bankAccounts(filters: $filters, ordering: $ordering, pagination: $pagination) {
    ...ListBankAccount
  }
}

query GetBankAccount($id: ID!) {
  bankAccount(id: $id) {
    ...BankAccount
  }
}

# An account where another module shows one (a chip, a card): the row only.
query GetListBankAccount($id: ID!) {
  bankAccount(id: $id) {
    ...ListBankAccount
  }
}

query BalanceHistory($account: ID!, $dateFrom: Date!, $dateTo: Date) {
  balanceHistory(account: $account, dateFrom: $dateFrom, dateTo: $dateTo) {
    date
    amount
    currency
    reported
  }
}

query Forecast($account: ID!, $horizonDays: Int!, $includeDetected: Boolean!, $includeBudgets: Boolean!) {
  forecast(
    account: $account
    horizonDays: $horizonDays
    includeDetected: $includeDetected
    includeBudgets: $includeBudgets
  ) {
    date
    amount
    currency
  }
}

# Each account's newest balance, summed per account kind and currency by the
# server, over every account (no page cap).
query BalanceTotals($filters: BankAccountFilter) {
  balanceTotals(filters: $filters) {
    kind
    currency
    amount
    accounts
  }
}
