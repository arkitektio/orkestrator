query Holdings($account: ID!, $date: Date) {
  holdings(account: $account, date: $date) {
    ...Holding
  }
}

query Portfolio {
  bankAccounts(filters: { kind: DEPOT }, ordering: [{ name: ASC }], pagination: { limit: 100 }) {
    id
    name
    kind
    currency
    latestBalance {
      ...Balance
    }
    currentHoldings {
      ...Holding
    }
  }
}

# Every depot's positions summed by ISIN and currency on the server, exactly
# (decimals), largest first.
query MergedPositions {
  portfolioInsights {
    mergedPositions {
      isin
      name
      securityType
      currency
      depots
      quantity
      price
      fifoPrice
      costBasis
      valuation
      unrealizedGain
      weight
    }
  }
}
