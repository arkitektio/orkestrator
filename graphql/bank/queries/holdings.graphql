query Portfolio {
  bankAccounts(filters: { kind: DEPOT }, ordering: [{ name: ASC }], pagination: { limit: 100 }) {
    id
    name
    kind
    currency
    latestBalance {
      ...Balance
    }
    currentHoldings {
      ...Holding
    }
  }
}

# Positions summed by ISIN and currency on the server, exactly (decimals),
# largest first: every depot's, or these accounts'; today's, or as of a day
# (each depot's latest synced day on or before it).
query MergedPositions($accounts: [ID!], $asOf: Date) {
  portfolioInsights(accounts: $accounts, asOf: $asOf) {
    mergedPositions {
      isin
      name
      securityType
      currency
      depots
      quantity
      price
      fifoPrice
      costBasis
      valuation
      unrealizedGain
      weight
    }
  }
}
