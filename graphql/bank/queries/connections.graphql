query ListBankConnections($filters: BankConnectionFilter, $pagination: OffsetPaginationInput) {
  bankConnections(filters: $filters, pagination: $pagination) {
    ...ListBankConnection
  }
}

query GetBankConnection($id: ID!) {
  bankConnection(id: $id) {
    ...BankConnection
  }
}

# The unfinished logins of several connections, in one ask (only the starter is told a state).
query PendingAuthStates($ids: [ID!]!) {
  bankConnections(filters: { ids: $ids }, pagination: { limit: 100 }) {
    id
    pendingAuth {
      state
    }
  }
}

query BankInstitutions($provider: ID!, $country: String!) {
  bankInstitutions(provider: $provider, country: $country) {
    name
    country
    logo
    bic
    maximumConsentDays
  }
}

query AuthSession($state: String!) {
  authSession(state: $state) {
    ...AuthSession
  }
}

# The connections whose login ran out, decided by the server: a home chip counts them.
query ReauthConnections {
  bankConnections(filters: { needsReauth: true }) {
    id
  }
}
