fragment CashflowBucket on CashflowBucket {
  periodStart
  currency
  income
  expense
  net
  count
}

fragment CategoryTotal on CategoryTotal {
  currency
  income
  expense
  net
  count
  category {
    ...TransactionCategory
  }
}

fragment SyncResult on SyncResult {
  created
  updated
  pendingReplaced
  balances
  categorized
  holdings
  account {
    ...ListBankAccount
    # A sync spends the budget the account page shows.
    ...AccountSyncState
  }
}
