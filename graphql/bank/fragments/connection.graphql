fragment ListBankConnection on BankConnection {
  id
  aspspName
  aspspCountry
  provider
  bankProvider {
    id
    name
    enabled
  }
  status
  linkStep
  validUntil
  needsReauth
  lastError
  lastErrorCode
  pendingExpiresAt
  isAbandoned
  nextSyncAllowedAt
  syncsRemainingToday
}

fragment BankConnection on BankConnection {
  ...ListBankConnection
  createdAt
  linkedAt
  pendingAuth {
    state
  }
  creator {
    id
    sub
    preferredUsername
  }
  accounts {
    ...ListBankAccount
  }
}
