fragment Balance on BalanceSnapshot {
  id
  date
  balanceType
  amount
  currency
}

fragment ListBankAccount on BankAccount {
  id
  iban
  name
  kind
  currency
  product
  lastError
  isSyncing
  latestBalance {
    ...Balance
  }
  connection {
    id
    aspspName
    aspspCountry
    provider
    bankProvider {
      id
    }
    status
    needsReauth
  }
}

# What the account page reads besides the row: its sync budget (each field
# walks the account's syncers, so lists leave them out).
fragment AccountSyncState on BankAccount {
  lastSyncedAt
  lastErrorCode
  nextSyncAllowedAt
  syncsRemainingToday
}

fragment BankAccount on BankAccount {
  ...ListBankAccount
  ...AccountSyncState
  createdAt
}
