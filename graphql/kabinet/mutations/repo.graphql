mutation CreateGithubRepo($identifier: String!) {
  createGithubRepo(input: { identifier: $identifier }) {
    id
  }
}

mutation RescanRepos {
  rescanRepos {
    id
  }
}

# One repo, not all of them: selects the full Repo so the open page updates in
# place from the cache instead of refetching.
mutation ScanRepo($id: String!) {
  scanRepo(input: { id: $id }) {
    ...Repo
  }
}

# An OCI repository (e.g. ghcr.io/org/app) whose tags carry release descriptors.
# Importing one again reads the registry again.
mutation ImportRepo($reference: String!, $channels: [String!]) {
  importRepo(input: { reference: $reference, channels: $channels }) {
    id
    name
    registry
    repository
    scannedAt
    flavours {
      id
      name
      release {
        id
        version
        app {
          id
          identifier
        }
      }
    }
  }
}
