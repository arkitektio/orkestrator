fragment ListRepo on GithubRepo {
  id
  name
  branch
  user
  repo
}

fragment Repo on GithubRepo {
  id
  name
  branch
  user
  repo
  url
  issueUrl
  addedAt
  updatedAt
  organization {
    slug
  }
  # The same selection the flavour cards take, plus what the repo's Info rail
  # says about each flavour: which image it is and what it needs to run.
  flavours {
    ...ListFlavour
    image {
      imageString
      buildAt
    }
    requirements {
      key
      service
      optional
      description
    }
  }
}
