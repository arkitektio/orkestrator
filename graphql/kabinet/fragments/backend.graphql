fragment ListBackend on Backend {
  id
  user {
    sub
  }
  client {
    clientId
  }

  name
  kind
  # The card's health bar and counts: scalars only, never the pods themselves.
  pods {
    id
    status
  }
  resources {
    id
  }
}

fragment Backend on Backend {
  id
  user {
    sub
  }
  client {
    clientId
  }
  clientId
  name
  kind
  pods {
    ...ListPod
  }
  resources {
    ...ListResource
  }
}
