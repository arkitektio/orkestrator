# An app is what a scientist installs; releases are its versions and flavours
# are their builds. `App.releases` is what makes an app page possible without
# fetching every release in the deployment and grouping client-side.

# The app page: the store's facts (its newest release in full, the counts the
# server works out over all releases), and every version as a line of the
# Versions tab (version and build names only).
fragment App on App {
  ...StoreApp
  # There is no implicit ordering, so ask for it: newest first.
  releases(ordering: [{ releasedAt: DESC }]) {
    id
    version
    flavours {
      id
      name
    }
  }
}

# Enough to draw a shelf tile: the icon, the newest version and how many
# actions it brings (ids only).
fragment ShelfApp on App {
  id
  identifier
  embedding
  latestRelease {
    id
    version
    logo
    originalLogo
    logoBlok {
      ...KabinetLogoBlok
    }
    flavours {
      id
      logo
      originalLogo
      definitions {
        id
      }
    }
  }
}

# One app as the store lists it: its newest release to draw from, and what the
# server works out over all of its releases (deployments, hardware, services),
# so a list of apps is filtered, sorted and paged on the server.
fragment StoreApp on App {
  id
  identifier
  embedding
  deploymentCount
  runningCount
  hardware
  accelerators
  services
  releaseCount
  latestRelease {
    ...StoreRelease
  }
}
