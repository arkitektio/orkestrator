fragment Definition on Definition {
  id
  name
  hash
  description
  # The action logo blok (kind action, context LOGO) that draws it (that of the newest flavour naming one).
  logo {
    ...KabinetLogoBlok
  }
  args {
    ...ArgPort
  }
  returns {
    ...ReturnPort
  }
  flavours {
    ...ListFlavour
  }
}

fragment ListDefinition on Definition {
  id
  name
  hash
  description
  # The card's one-line signature (takes → returns): names and types only.
  args {
    key
    label
    kind
    identifier
    nullable
  }
  returns {
    key
    label
    kind
    identifier
    nullable
  }
  logo {
    ...KabinetLogoBlok
  }
  # What kind of action it is — every list that shows a definition badges it.
  kind
  flavours {
    id
    name
    logo
    originalLogo
    release {
      id
      version
      logo
      originalLogo
      logoBlok {
        ...KabinetLogoBlok
      }
      app {
        id
        identifier
        embedding
      }
    }
  }
}

# What the smart menu lists: a row's name and line. The release it installs
# from is asked for when the row is chosen (DefinitionRelease).
fragment SmartDefinition on Definition {
  id
  name
  description
  logo {
    ...KabinetLogoBlok
  }
}
