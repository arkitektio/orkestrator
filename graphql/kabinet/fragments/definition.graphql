fragment Definition on Definition {
  id
  name
  hash
  description
  args {
    ...ArgPort
  }
  returns {
    ...ReturnPort
  }
  flavours {
    ...ListFlavour
  }
}

fragment ListDefinition on Definition {
  id
  name
  hash
  description
  # What kind of action it is — every list that shows a definition badges it.
  kind
  flavours {
    id
    name
    logo
    originalLogo
    release {
      id
      version
      logo
      originalLogo
      app {
        id
        identifier
        embedding
      }
    }
  }
}
