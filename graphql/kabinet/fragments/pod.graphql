fragment ListPod on Pod {
  id
  podId
  # When the pod last reported its logs: the card says how fresh it is, never what.
  latestLogDump {
    createdAt
  }
  backend {
    user {
      sub
    }
    client {
      clientId
    }
    name
  }
  deployment {
    id
    flavour {
      id
      name
      release {
        id
        version
        logoBlok {
          ...KabinetLogoBlok
        }
        app {
          identifier
        }
      }
    }
  }
  clientId
  resource {
    id
    name
  }
  status
}

# The pod page: its backend by name (not the backend's every pod and resource).
fragment Pod on Pod {
  id
  podId
  backend {
    id
    name
    kind
    clientId
    user {
      sub
    }
  }
  status
  latestLogDump {
    logs
    createdAt
  }
  clientId
  resource {
    ...ListResource
  }
  deployment {
    id
    name
    # Who this pod acts as: the release approval it was installed under.
    approval {
      ...ListReleaseApproval
    }
    flavour {
      id
      name
      release {
        id
        version
        logoBlok {
          ...KabinetLogoBlok
        }
        app {
          identifier
        }
      }
    }
  }
}
