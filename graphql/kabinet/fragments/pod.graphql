fragment ListPod on Pod {
  id
  podId
  # When the pod last reported its logs: the card says how fresh it is, never what.
  latestLogDump {
    createdAt
  }
  backend {
    user {
      sub
    }
    client {
      clientId
    }
    name
  }
  deployment {
    id
    flavour {
      id
      name
      release {
        id
        version
        logoBlok {
          ...KabinetLogoBlok
        }
        app {
          identifier
        }
      }
    }
  }
  clientId
  resource {
    id
    name
  }
  status
}

fragment Pod on Pod {
  id
  podId
  backend {
    ...Backend
  }
  status
  latestLogDump {
    logs
    createdAt
  }
  clientId
  resource {
    ...ListResource
  }
  deployment {
    id
    name
    # Who this pod acts as: the release approval it was installed under.
    approval {
      ...ListReleaseApproval
    }
    flavour {
      id
      name
      release {
        id
        version
        logoBlok {
          ...KabinetLogoBlok
        }
        app {
          identifier
        }
      }
    }
  }
}
