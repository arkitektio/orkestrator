fragment ListFlavour on Flavour {
  id
  name
  logo
  originalLogo
  release {
    id
    version
    logo
    originalLogo
    logoBlok {
      ...KabinetLogoBlok
    }
    app {
      id
      identifier
      embedding
    }
  }
  selectors {
    ...CudaSelector
    ...RocmSelector
  }
  # Where it runs: the card's footer.
  deployments {
    id
    status
  }
}


# The detail fragment adds what the flavour PROVIDES: the actions its manifest
# declares. Without them the flavour page can only show selectors, which says
# where it runs but never what it does.
# The detail fragment adds what the flavour PROVIDES (the actions its manifest
# declares) and what it NEEDS (its image, its requirements, where it was built
# from). The selectors on `ListFlavour` only say where it can run.
#
# The actions are the store's selection (`StoreDefinition`): the Actions tab
# reads name, description, kind and logo, never the ports or flavours.
fragment Flavour on Flavour {
  ...ListFlavour
  # The full selector shape (`kind` / `required`), not just the CUDA and ROCm
  # specifics ListFlavour carries — the badges label and rank by those.
  selectors {
    ...StoreSelector
  }
  image {
    imageString
    buildAt
  }
  requirements {
    key
    service
    optional
    description
  }
  repo {
    id
    name
    user
    repo
    url
  }
  deployments {
    ...ListDeployment
  }
  definitions {
    ...StoreDefinition
  }
  # Whether its app brings bloks or files at all: the Bloks tab is shown only
  # then, and fetches what it draws itself (FlavourBloks).
  blokKeys: blokImplementations {
    id
    context
  }
  assets
  # Its siblings: the other builds of the same version.
  release {
    scopes
    flavours {
      id
      name
      selectors {
        ...CudaSelector
        ...RocmSelector
      }
    }
  }
}
