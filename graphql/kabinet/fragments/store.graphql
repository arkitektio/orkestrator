fragment StoreSelector on Selector {
  __typename
  kind
  required
  ... on CudaSelector {
    computeCapability
    memory
    count
    cudaVersion
  }
  ... on RocmSelector {
    apiVersion
  }
  ... on CPUSelector {
    arch
    minCount
  }
}

# A blok the store offers: what a tile shows, and the hash its preview is kept under.
fragment StoreBlok on FlavourBlok {
  id
  flavourId
  key
  context
  default
  description
  hash
  parseError
}

fragment StoreFlavour on Flavour {
  id
  name
  logo
  originalLogo
  image {
    imageString
    buildAt
  }
  requirements {
    key
    service
    optional
    description
  }
  selectors {
    ...StoreSelector
  }
  repo {
    id
    name
    user
    repo
    url
  }
  definitions {
    id
    name
    description
    kind
    logo {
      ...KabinetLogoBlok
    }
  }
  deployments {
    id
    status
  }
  # Panels and scenes are offered in the store as bloks of their own; logos
  # are filtered out client-side. No trees here: a tile draws from
  # KabinetLogoTree only when no preview of its hash is kept.
  blokImplementations {
    ...StoreBlok
  }
  # What `@self.assets.<name>` answers while a blok is previewed.
  assets
}

fragment StoreRelease on Release {
  id
  name
  version
  logo
  originalLogo
  logoBlok {
    ...KabinetLogoBlok
  }
  scopes
  entrypoint
  app {
    id
    identifier
    # Drives the generated mark an app without a logo falls back to: the
    # nearest symbol word gives its shape, the nearest topic its colour.
    embedding
  }
  flavours {
    ...StoreFlavour
  }
}
