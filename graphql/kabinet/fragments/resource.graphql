fragment Resource on Resource {
  id
  name
  resourceId
  qualifiers
  backend {
    id
    name
    kind
  }
  pods {
    ...ListPod
  }
}

fragment ListResource on Resource {
  id
  name
  qualifiers
  backend {
    id
    name
    kind
  }
  # The card's health bar and count.
  pods {
    id
    status
  }
}
