query GetApp($id: ID!) {
  app(id: $id) {
    ...App
  }
}

query ListApps($filters: AppFilter, $pagination: OffsetPaginationInput) {
  apps(filters: $filters, pagination: $pagination) {
    ...ShelfApp
  }
}

# The apps page: one row per app, newest release first; what a card counts
# (deployments, running) is worked out by the server over all of its releases.
query AppCatalog($filters: AppFilter, $pagination: OffsetPaginationInput) {
  apps(filters: $filters, pagination: $pagination, ordering: [{ releasedAt: DESC }]) {
    ...StoreApp
  }
}
