query GetDefinition($id: ID!) {
  definition(id: $id) {
    ...Definition
  }
}

query ListDefinitions($filters: DefinitionFilter, $pagination: OffsetPaginationInput) {
  definitions(filters: $filters, pagination: $pagination) {
    ...ListDefinition
  }
}

# A menu's rows (alpaka's installable replyers): name and line, a page of them.
query AllPrimaryDefinitions(
  $pagination: OffsetPaginationInput
  $filters: DefinitionFilter
  $ordering: [DefinitionOrder!]
) {
  definitions(ordering: $ordering, pagination: $pagination, filters: $filters) {
    ...SmartDefinition
  }
}

query SmartDefinitions(
  $pagination: OffsetPaginationInput
  $filters: DefinitionFilter
  $ordering: [DefinitionOrder!]
) {
  definitions(ordering: $ordering, pagination: $pagination, filters: $filters) {
    ...SmartDefinition
  }
}

# The releases that bring a definition, for the install dialog.
query DefinitionRelease($id: ID!) {
  definition(id: $id) {
    id
    flavours {
      id
      release {
        id
        version
      }
    }
  }
}
