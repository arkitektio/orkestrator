query ListPod($filters: PodFilter, $pagination: OffsetPaginationInput) {
  pods(filters: $filters, pagination: $pagination) {
    ...ListPod
  }
}

query GetPod($id: ID!) {
  pod(id: $id) {
    ...Pod
  }
}

query GetPodForAgent($clientId: ID!) {
  podForAgent(clientId: $clientId) {
    ...Pod
  }
}
