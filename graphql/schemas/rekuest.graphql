  """
  dependencyAgents: [TaskDependencyAgent!]!

  """The method of the dependency that caused this task, if applicable."""
  dependencyMethod: String

  """The events"""
  events(filters: TaskEventFilter, ordering: [TaskEventOrder!]! = [], pagination: OffsetPaginationInput): [TaskEvent!]!

  """Timestamp when the task was finished."""
  finishedAt: DateTime

  """The locks this task holds right now."""
  heldLocks: [Lock!]!

  """Unique ID of the task."""
  id: ID!

  """
  Implementation assigned to execute. Null until the task is mapped to one.
