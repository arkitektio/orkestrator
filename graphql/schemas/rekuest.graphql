  """
  All structure packages referenced by the org's action ports (derived, not registered).
  """
  structurePackages(search: String = null): [StructurePackage!]!

  """
  All structures: those the org's action ports reference, and those a service of this hub hosts.
  """
  structures(search: String = null): [Structure!]!

  """Fetch task by ID."""
  task(id: ID!): Task!

  """Get task boundaries."""
  taskBoundaries(correlationId: String!, stateId: ID = null): TaskBoundary

  """Statistics about tasks and their states."""
  taskStats(filters: TaskFilter = null): TaskStats!

  """All tasks."""
  tasks(filters: TaskFilter, ordering: [TaskOrder!]! = [], pagination: OffsetPaginationInput): [Task!]!

  """Retrieve test case by ID."""
  testCase(id: ID!): TestCase!

  """All test cases."""
