  """Get toolbox by ID."""
  toolbox(id: ID!): Toolbox!

  """List of toolboxes containing shortcuts."""
  toolboxes(filters: ToolboxFilter, ordering: [ToolboxOrder!]! = [], pagination: OffsetPaginationInput): [Toolbox!]!

  """Fetch a trigger by ID."""
  trigger(id: ID!): Trigger!

  """All triggers in the organization."""
  triggers(filters: TriggerFilter, ordering: [TriggerOrder!]! = [], pagination: OffsetPaginationInput): [Trigger!]!

  """Fetch a wiregram by ID."""
  wiregram(id: ID!): Wiregram!

  """The automation documents the organization imported."""
  wiregrams(pagination: OffsetPaginationInput): [Wiregram!]!
}

