  """
  createAsset(input: CreateAssetInput!): Asset!

  """Create a user interface panel."""
  createBlok(input: CreateBlokInput!): Blok!

  """Create a dashboard layout."""
  createDashboard(input: CreateDashboardInput!): Dashboard!

  """
  Deploy a higher-order implementation: a wrapper onto the agent of the implementation it wraps, linked to it.
  """
  createHigherOrderImplementation(input: CreateHigherOrderImplementationInput!): Implementation!

  """Create a new placement for an agent in a space."""
  createPlacement(input: CreatePlacementInput!): Placement!

  """
  Create a recurring assignment of an action. Its next run is planned immediately.
  """
  createSchedule(input: CreateScheduleInput!): Schedule!

  """Create a shortcut to an action."""
  createShortcut(input: CreateShortcutInput!): Shortcut!

  """Create a new space."""
  createSpace(input: CreateSpaceInput!): Space!

  """
  Place a 3D blok (a Model or Robot over a kulisse asset) in a space at an affine transform.
  """
  createSpacePlacement(input: CreateSpacePlacementInput!): SpacePlacement!

  """Create a new test case."""
  createTestCase(input: CreateTestCaseInput!): TestCase!

  """Create a test result record."""
  createTestResult(input: CreateTestResultInput!): TestResult!

  """
  Create a trigger: run an action when a service signals a matching object.
  """
  createTrigger(input: CreateTriggerInput!): Trigger!

  """
  Answer a held task. A child an agent asked for runs once approved, or ends DENIED without running; a task that holds itself carries on with the decision. Only the user the task runs for may decide, and never from the client of the agent that asked.
  """
  decide(input: DecideInput!): Task!

  """Delete an agent record."""
  deleteAgent(input: DeleteAgentInput!): ID!

  """Delete a blok by ID."""
  deleteBlok(input: DeleteBlokInput!): Boolean!

  """Delete a dashboard by ID."""
  deleteDashboard(input: DeleteDashboardInput!): Boolean!

  """Delete a registered implementation."""
  deleteImplementation(input: DeleteImplementationInput!): String!

  """Delete a materialized blok by ID."""
  deleteMaterializedBlok(input: DeleteMaterializedBlokInput!): Boolean!

  """Delete a placement."""
  deletePlacement(input: DeletePlacementInput!): ID!

  """Delete a schedule. Its waiting run is cancelled; history is kept."""
  deleteSchedule(input: ScheduleIdInput!): ID!

  """Delete a shortcut."""
  deleteShortcut(input: DeleteShortcutInput!): ID!

  """Delete a space."""
  deleteSpace(input: DeleteSpaceInput!): ID!

  """Remove a placed 3D blok from its space."""
  deleteSpacePlacement(input: DeleteSpacePlacementInput!): ID!

  """Delete a trigger; its runs are kept."""
  deleteTrigger(input: TriggerIdInput!): ID!

  """Delete a wiregram and the rules it owns."""
  deleteWiregram(input: WiregramIdInput!): ID!

  """
  Edit a blok as one new revision on top of the head the editor read: on the blok itself (an editor of the blok), or through a materialization, with its bindings there (an assistant at a dashboard). A provided blok is forked first. With dryRun, every check runs and nothing is kept.
  """
  editBlok(input: EditBlokInput!): BlokEdit!

  """Ensure agent record exists or is up to date."""
  ensureAgent(input: AgentInput!): Agent!

  """
  Write existing schedules and triggers down as a wiregram document, to import elsewhere. Changes nothing.
  """
  exportWiregram(input: ExportWiregramInput!): AnyDefault!

  """Finalize a media upload after the client has written the object"""
  finishMediaUpload(input: FinishMediaUploadInput!): MediaStore!

  """
  Fire a trigger on a stored signal by hand (a replay). The run is created whether or not the signal satisfies the trigger, and logged as a firing of its own.
  """
  fireTrigger(input: FireTriggerInput!): Firing!

  """
  Copy a blok an app provides into a custom blok, to edit it or bind other agents to it. The copy lives on whatever the providing agents do.
  """
  forkBlok(input: ForkBlokInput!): Blok!

  """
  Implement an agent with given states and implementations. This is used to set up an agent with its initial configuration and capabilities.
  """
  implementAgent(input: ImplementAgentInput!): Agent!

  """
  Import a wiregram: one document of schedules and triggers. All or nothing; importing the same key again updates what it created and removes what it no longer lists.
  """
  importWiregram(input: WiregramInput!): Wiregram!

  """Interrupt the execution of a task."""
  interrupt(input: InterruptInput!): Task!

  """Kick an agent to force disconnect. It will fail and not reconnect."""
  kick(input: KickInput!): Agent!

  """Materialize a UI blok into a concrete instance on a dashboard."""
  materializeBlok(input: MaterializeBlokInput!): MaterializedBlok!

  """Pause an ongoing task."""
  pause(input: PauseInput!): Task!

  """
  Pause a probe. Idempotent on finished probes; the agent's Paused report settles the state.
  """
  pauseProbe(input: PauseProbeInput!): Probe!

  """Pin an agent to the user."""
  pinAgent(input: PinInput!): Agent!

  """
  Keep a materialization at one revision of its blok, or let it follow the head again.
  """
  pinMaterializedBlok(input: PinMaterializedBlokInput!): MaterializedBlok!

  """
  Fire a probe at an agent — zero persistence, redis-held state under a TTL, never appears in task history. For high-frequency interactive work (previews, live parameter tweaks).
  """
  probe(input: ProbeInput!): Probe!

  """
  Reissue upload credentials for a media upload still in flight, to the same key, so a write that outlives its credentials carries on. Only the uploader may, never for a finished store, and never past the upload's time limit
  """
  refreshMediaUpload(input: RefreshUploadInput!): MediaUploadGrant!

  """
  Register a module: the components and operations a UI app can render and evaluate beyond the spec's catalogs, and the catalogs it implements whole (upsert by name in the caller's organization). Bloks (`module`) and definitions (`catalogs`) that name it are validated against it.
  """
  registerModule(input: RegisterModuleInput!): Module!

  """
  A media upload grant for one asset. Issued for a file the caller's own agent declares (it registered with it), or, to an admin, for a file an agent of the organization names a source for; and only if its size passes the policy.
  """
  requestAssetUpload(input: RequestAssetUploadInput!): AssetUploadGrant!

  """Request temporary S3 read credentials for a media file"""
  requestMediaAccess(input: RequestMediaAccessInput!): MediaAccessGrant!

  """Upload media and return a URL for access"""
  requestMediaUpload(input: RequestMediaUploadInput!): MediaUploadGrant!

  """Resume a paused task."""
  resume(input: ResumeInput!): Task!

  """
  Resume a paused probe. Idempotent on finished probes; the agent's Resumed report settles the state.
  """
  resumeProbe(input: ResumeProbeInput!): Probe!

  """
  Make an earlier revision's content a custom blok's head again, as a new revision.
  """
  revertBlok(input: RevertBlokInput!): BlokRevision!

  """Shelve data into a memory drawer."""
  shelveInMemoryDrawer(input: ShelveInMemoryDrawerInput!): MemoryDrawer!

  """
  Run a schedule now: its waiting run is moved to now. Refused while a run is executing.
  """
  triggerSchedule(input: ScheduleIdInput!): Task!

  """Remove a shortcut's binding to a user."""
  unbindShortcut(input: UnbindShortcutInput!): ID!

  """Unblock a previously blocked agent."""
  unblock(input: UnblockInput!): Agent!

  """Unshelve data from a memory drawer."""
  unshelveMemoryDrawer(input: UnshelveMemoryDrawerInput!): ID!

  """Update properties of an agent such as its name."""
  updateAgent(input: UpdateAgentInput!): Agent!

  """
  Update properties of a blok such as its name, description, components, module, or dependencies.
  """
  updateBlok(input: UpdateBlokInput!): Blok!

  """
  Update properties of a dashboard such as its name, associated bloks, or organization.
  """
  updateDashboard(input: UpdateDashboardInput!): Dashboard!

  """Update properties of a materialized blok such as its agent mappings."""
  updateMaterializedBlok(input: UpdateMaterializedBlokInput!): MaterializedBlok!

  """Update an existing placement."""
  updatePlacement(input: UpdatePlacementInput!): Placement!

  """Change a schedule; a waiting run is re-planned."""
  updateSchedule(input: UpdateScheduleInput!): Schedule!

  """Update an existing space."""
  updateSpace(input: UpdateSpaceInput!): Space!

  """Move or rename a placed 3D blok."""
  updateSpacePlacement(input: UpdateSpacePlacementInput!): SpacePlacement!

  """Change a trigger."""
  updateTrigger(input: UpdateTriggerInput!): Trigger!
}

