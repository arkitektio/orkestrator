directive @auth(allow_scoped: Boolean, any_org_role_of: [String!], any_role_of: [String!], any_scope_of: [String!], required_org_roles: [String!], required_roles: [String!], required_scopes: [String!]) on FIELD_DEFINITION

directive @unionElementOf(discriminator: String!, key: String!, union: String!) repeatable on INPUT_OBJECT

"""Represents an executable action in the system."""
type Action {
  """
  Whether the action may be invoked as a probe (zero persistence, no history/replay/recovery). Declared by the action author.
  """
  allowProbe: Boolean!

  """The app this action belongs to."""
  app: App!

  """Input arguments (ports) for the action."""
  args: [ArgPort!]!

  """
  Whether an agent that can take this action is connected (or is a webhook agent) right now: `liveImplementations > 0`.
  """
  assignable: Boolean!

  """
  The action's own bloks, at most one per context (HTML for a task panel, OVERLAY drawn into the space that hosts a run): declared with the action, the latest registration's. Not part of its hash.
  """
  bloks: [ActionBlok!]!

  """Collections to which this action belongs."""
  collections: [Collection!]!

  """Timestamp when the action was defined."""
  definedAt: DateTime!

  """Optional description of the action."""
  description: String

  """
  This action's stored vector, as `<model id>:<floats>`. Null until it has been indexed.
  """
  embedding: Embedding

  """Unique hash identifying the action definition."""
  hash: ActionHash!

  """Unique ID of the action."""
  id: ID!

  """
  Whether the action is idempotent: safe to re-run with the same args — re-dispatchable on ambiguous executor loss.
  """
  idempotent: Boolean!

  """List of implementations for this action."""
  implementations(filters: ImplementationFilter, ordering: [ImplementationOrder!]! = [], pagination: OffsetPaginationInput): [Implementation!]!

  """Marks whether the action is in development."""
  isDev: Boolean!

  """Actions for which this is a test."""
  isTestFor(filters: ActionFilter, ordering: [ActionOrder!]! = [], pagination: OffsetPaginationInput): [Action!]!

  """Key of the action, used for grouping and identification."""
  key: String!

  """The kind or category of the action."""
  kind: ActionKind!

  """Get the latest completed task for this action."""
  latestTask: Task

  """
  How many of its implementations sit on an agent that can take work now (connected, or a webhook agent) — one per agent. Kept by the database as agents connect and leave, a moment behind (takt recomputes it on commit); a crashed agent counts until takt's stale sweep notices (seconds).
  """
  liveImplementations: Int!

  """
  The action logo that draws this action: that of the implementation most recently registered with one (`Action.latest_logo`, kept by takt). Each implementation has its own (`Implementation.logo`); an action without one is drawn by its agent's default logo.
  """
  logo: Blok

  """Name of the action."""
  name: String!

  """The organization that owns this action."""
  organization: Organization!

  """Port groups used in the action for organizing ports."""
  portGroups: [PortGroup!]!

  """Protocols associated with the action."""
  protocols(filters: ProtocolFilter, ordering: [ProtocolOrder!]! = [], pagination: OffsetPaginationInput): [Protocol!]!

  """
  Whether the action is pure: same args always produce the same result, no side effects — replayable.
  """
  pure: Boolean!

  """Output values (ports) returned by the action."""
  returns: [ReturnPort!]!

  """Retrieve tasks where this action has run."""
  runs: [Task!]

  """The schedules that run this action."""
  schedules(filters: ScheduleFilter, ordering: [ScheduleOrder!]! = [], pagination: OffsetPaginationInput): [Schedule!]!

  """Scope of the action, e.g., user or system."""
  scope: ActionScope!

  """
  Actions whose name and description mean roughly what this one's do, nearest first (cosine distance between embeddings, this action excluded). `filters` narrows the candidates like `actions` does; `maxDistance` (0 identical, 1 unrelated) cuts the tail, otherwise the nearest `limit` come back. Empty while this action has no vector yet or embeddings are off.
  """
  similarActions(filters: ActionFilter = null, limit: Int! = 10, maxDistance: Float = null): [Action!]!

  """Indicates whether the action maintains state."""
  stateful: Boolean!

  """Tasks created for this action."""
  tasks(filters: TaskFilter, ordering: [TaskOrder!]! = [], pagination: OffsetPaginationInput): [Task!]!

  """Test cases for this action."""
  testCases(filters: TestCaseFilter, pagination: OffsetPaginationInput): [TestCase!]

  """List of tests associated with the action."""
  tests(filters: ActionFilter, ordering: [ActionOrder!]! = [], pagination: OffsetPaginationInput): [Action!]!

  """The triggers that run this action."""
  triggers(filters: TriggerFilter, ordering: [TriggerOrder!]! = [], pagination: OffsetPaginationInput): [Trigger!]!

  """Version string of the action."""
  version: String!
}

"""A JSON-serializable argument entry for a multi-agent action trigger."""
type ActionArgument {
  agentCall: AgentCall
  key: String
  utilCall: UtilCall
  valueDict: [ActionArgument!]
  valueList: [ActionArgument!]
  valueLiteral: JSONSerializable
  valuePath: String
}

"""
An argument of a call: a literal, a path, a nested call, a list or an object; null when it sets none.
"""
input ActionArgumentInput {
  """
  Defines a nested agent call if this argument should trigger an agent interaction.
  """
  agentCall: AgentProbeInput = null

  """The argument property name."""
  key: String = null

  """A nested function call."""
  utilCall: UtilCallInput = null

  """
  Defines a list of key-value pairs if this argument should be a dictionary.
  """
  valueDict: [ActionArgumentInput!] = null

  """Defines a list of values if this argument should be an array."""
  valueList: [ActionArgumentInput!] = null

  """A JSON literal."""
  valueLiteral: JSONSerializable = null

  """A path the argument reads, as a prop's dynamic_value does."""
  valuePath: String = null
}

"""
An action's own blok for one context: how a client shows a run of the action there. It names devices only by the action's dependency keys: a run binds them through `Task.dependencyAgents`, a preview through the `dependencyTree` dry run.
"""
type ActionBlok {
  """The action whose runs it shows."""
  action: Action!

  """
  What it draws: a blok held by its actions only (`heldByAction`), shared by every action of the app declaring the same.
  """
  blok: Blok!

  """
  Where a client shows a run with it: HTML in a task panel, SCENE as a 3D view of its own, OVERLAY drawn into the space that hosts the run, over the agents placed there.
  """
  context: ComponentContext!
  id: ID!
}

"""
An action's own blok (blok language v2): how a client shows a run of it in one context, naming devices by the action's dependency keys.
"""
input ActionBlokInput {
  """The catalogs it needs, as name@version."""
  catalogs: [String!]! = []

  """The UI component tree, unless the blok is sent as its `source`."""
  components: [ComponentNodeInput!] = null

  """
  Where a client shows the run with it: HTML in a task panel, SCENE as a 3D view of its own, OVERLAY drawn into the space that hosts the run (its root an `Overlay`).
  """
  context: ComponentContext! = HTML

  """What a preview renders it with."""
  demo: BlokDemoInput = null

  """What the blok shows of a run."""
  description: String = null

  """Its locals: form state that feeds a call, written only through bind."""
  locals: [BlokLocalInput!]! = []

  """
  The module the blok renders against besides its catalogs; the Orkestrator's when absent.
  """
  module: String = null

  """Its declared reads."""
  queries: [BlokQueryInput!]! = []

  """
  The blok as v2 BSX, parsed by the server into its component tree. Exactly one of `components` and `source` is sent.
  """
  source: String = null

  """Its declared streams."""
  subscriptions: [BlokSubscriptionInput!]! = []

  """The blok language version the blok speaks; 2 is the only one."""
  vocab: Int!
}

"""
Pure matching criteria for an action (app/key preferred; matches loosen).
"""
type ActionDemand {
  """The identifier of the app providing the action, e.g. 'imagej'."""
  app: String

  """The matches the action's arg ports must satisfy."""
  argMatches: [PortMatch!]

  """Require that the action has exactly this number of root args."""
  forceArgLength: Int

  """Require that the action has exactly this number of root returns."""
  forceReturnLength: Int

  """
  The exact hash of the action. When set, matching short-circuits on the hash.
  """
  hash: ActionHash

  """Require the action to be (or not be) idempotent."""
  idempotent: Boolean

  """The action's key within its app, e.g. 'open_image'."""
  key: String

  """The display name of the action to match."""
  name: String

  """Protocols (by name) the action must implement."""
  protocols: [String!]

  """Require the action to be (or not be) pure."""
  pure: Boolean

  """The matches the action's return ports must satisfy."""
  returnMatches: [PortMatch!]

  """Require the action to be (or not be) stateful."""
  stateful: Boolean

  """The exact version of the action."""
  version: String
}

"""
Pure matching criteria for an action: hash or name short-circuits, arg/return
    port matches, protocols and forced port counts. Used directly by query filters and, wrapped
    in an ActionDependencyInput, by dependency declarations.
"""
input ActionDemandInput {
  """
  The identifier of the app providing the action, e.g. 'imagej'. Omit (or drop when loosening) to allow equivalent actions from any app.
  """
  app: String = null

  """The matches the action's arg ports must satisfy."""
  argMatches: [PortMatchInput!] = null

  """Require that the action has exactly this number of root args."""
  forceArgLength: Int = null

  """Require that the action has exactly this number of root returns."""
  forceReturnLength: Int = null

  """
  The exact hash of the action. When set, matching short-circuits on the hash and everything else is ignored.
  """
  hash: String = null

  """Require the action to be (or not be) idempotent. Omit to match either."""
  idempotent: Boolean = null

  """
  The action's key within its app, e.g. 'open_image'. Together with `app` this is the preferred identification of the demanded action.
  """
  key: String = null

  """The display name of the action to match."""
  name: String = null

  """Protocols (by name) the action must implement, e.g. 'predicate'."""
  protocols: [String!] = null

  """Require the action to be (or not be) pure. Omit to match either."""
  pure: Boolean = null

  """The matches the action's return ports must satisfy."""
  returnMatches: [PortMatchInput!] = null

  """Require the action to be (or not be) stateful. Omit to match either."""
  stateful: Boolean = null

  """The exact version of the action."""
  version: String = null
}

"""
A named action requirement of a dependency: a local slot key mapped to the demand the resolved action must satisfy.
"""
type ActionDependency {
  """The matching criteria the resolved action must satisfy."""
  demand: ActionDemand

  """A description of the dependency."""
  description: String

  """The local slot key of this action requirement."""
  key: String!

  """Whether the dependency is optional."""
  optional: Boolean!
}

"""
A named action requirement of a dependency: a slot key plus the demand the
    resolved action must satisfy, and resolution-lifecycle filters.
"""
input ActionDependencyInput {
  """Allow inactive nodes, defaults to true"""
  allowInactive: Boolean = true

  """
  The matching criteria the resolved action must satisfy (app/key preferred; matches loosen).
  """
  demand: ActionDemandInput = null

  """
  The description of the dependency, why it is needed and what it is used for.
  """
  description: String = null

  """
  The local slot key of this action requirement — callers reference it when assigning.
  """
  key: String!

  """
  Whether the dependency is optional or not. If the dependency is optional, the agent doesn't have to provide it to be potentially callable
  """
  optional: Boolean! = false
}

"""Numeric/aggregatable fields of Action"""
enum ActionField {
  CREATED_AT
}

input ActionFilter {
  AND: ActionFilter
  DISTINCT: Boolean
  NOT: ActionFilter
  OR: ActionFilter

  """
  Any of these demand sets: the rows that satisfy every demand of at least one set (each set as `demands`). One statement, so prefer it to `OR`-ing `demands`, which tests every row of the organization. An empty list is ignored; an empty set is an error.
  """
  anyDemands: [[PortDemandInput!]!]

  """Filter using app identifier"""
  appIdentifier: String

  """
  Whether an agent that can take the action is connected now (`Action.assignable`).
  """
  assignable: Boolean
  demands: [PortDemandInput!]
  ids: [ID!]
  inCollection: String
  kind: ActionKind
  name: StrFilterLookup
  objectDemands: [PortDemandInput!]
  protocols: [String!]

  """
  Search by name: a case-insensitive substring, or semantic similarity of the query to the action's name and description. Substring matches rank first, then by similarity; an explicit `ordering` replaces that ranking.
  """
  search: String
  stateful: Boolean
  usedAfter: DateTime
  usedBefore: DateTime
}

"""
The `ActionHash` scalar is the sha256 identity hash of an action definition (key, version, ports, ...)
"""
scalar ActionHash

"""The kind of action."""
enum ActionKind {
  FUNCTION
  GENERATOR
}

input ActionOrder @oneOf {
  """
  Runnable first (DESC) or last (ASC) by `Action.assignable`. The order the filters set (a `search`'s ranking) is kept as the tie-break, so `search` with this ordering lists runnable matches first, each group still ranked by relevance.
  """
  assignable: Ordering
  definedAt: Ordering
  usedAt: Ordering
}

enum ActionScope {
  BRIDGE_GLOBAL_TO_LOCAL
  BRIDGE_LOCAL_TO_GLOBAL
  GLOBAL
  LOCAL
}

type ActionStats {
  """Average"""
  avg(field: ActionField!): Float

  """Total number of items in the selection"""
  count: Int!

  """Number of distinct values for the field"""
  distinctCount(field: ActionField!): Int!

  """Maximum"""
  max(field: ActionField!): Float

  """Minimum"""
  min(field: ActionField!): Float

  """Time-bucketed stats over a datetime field."""
  series(by: Granularity!, field: ActionField!, timestampField: ActionTimestampField!): [TimeBucket!]!

  """Sum"""
  sum(field: ActionField!): Float
}

"""Datetime fields of Action for bucketing"""
enum ActionTimestampField {
  CREATED_AT
}

"""Represents a compute agent that can execute implementations."""
type Agent {
  """
  Determine if the agent is currently active based on last seen timestamp.
  """
  active: Boolean!

  """Blok mappings associated with this agent."""
  agentMappings: [BlokAgentMapping!]!

  """The app this agent belongs to."""
  app: App!

  """The files the agent brings, by the name its bloks call them."""
  assets: [AgentAsset!]!

  """Get the count of implementations available on this agent."""
  blocked: Boolean!

  """The client (app instance) this agent runs as."""
  client: Client!

  """Is the agent currently connected."""
  connected: Boolean!

  """The name the agent declares for itself, whatever a user calls it."""
  declaredName: String!

  """
  The blok this agent declared as its default for a context, if any: its panel, its scene or its logo.
  """
  defaultBlok(context: ComponentContext!): MaterializedBlok

  """
  What this agent is, in a sentence. Client-declared at registration; null for an agent that never declared one.
  """
  description: String

  """Device associated with the agent, via its client (if any)."""
  device: Device

  """Hash representing the agent's definition for change detection."""
  hash: String!

  """Webhook URL for this Agent (only if webhook)"""
  hookUrl: String

  """Webhook URL secret for this Agent (only if webhook)"""
  hookUrlSecret: String

  """Unique ID of the agent."""
  id: ID!

  """Fetch a specific implementation by interface."""
  implementation(interface: String!): Implementation

  """Implementations the agent can run."""
  implementations(filters: ImplementationFilter, ordering: [ImplementationOrder!]! = [], pagination: OffsetPaginationInput): [Implementation!]!

  """When this agent first registered."""
  installedAt: DateTime!

  """Kind of the agent."""
  kind: AgentKind!

  """Last timestamp this agent was seen."""
  lastSeen: DateTime

  """The agent's locks, and which task holds each."""
  locks: [Lock!]!

  """Agent's associated memory shelve."""
  memoryShelve: MemoryShelve

  """
  Agent name: the one a user gave it (updateAgent), else the one it declares.
  """
  name: String!

  """The organization this agent belongs to."""
  organization: Organization!

  """Check if this agent is pinned by the current user."""
  pinned: Boolean!

  """Placements associated with this agent."""
  placements(filters: PlacementFilter, ordering: [PlacementOrder!]! = [], pagination: OffsetPaginationInput): [Placement!]!

  """The release this agent belongs to."""
  release: Release!

  """The schedules whose runs are pinned to this agent."""
  schedules(filters: ScheduleFilter, ordering: [ScheduleOrder!]! = [], pagination: OffsetPaginationInput): [Schedule!]!

  """Sessions associated with this agent."""
  sessions(filters: SessionFilter, ordering: [SessionOrder!]! = [], pagination: OffsetPaginationInput): [Session!]!

  """Current and historical states associated with the agent."""
  states: [State!]!

  """
  The app this agent says controls its lifecycle (e.g. 'plugin_engine'), as stated on its last registration. Self-declared: a hint for pickers (descriptor @rekuest/supervisor), never authority.
  """
  supervisor: String

  """Tasks executed by this agent."""
  tasks(filters: TaskFilter, ordering: [TaskOrder!]! = [], pagination: OffsetPaginationInput): [Task!]!

  """The triggers whose runs are pinned to this agent."""
  triggers(filters: TriggerFilter, ordering: [TriggerOrder!]! = [], pagination: OffsetPaginationInput): [Trigger!]!

  """The user this agent belongs to."""
  user: User!
}

"""
A file an agent brings, under the name its bloks call it by (`@<dependency>.assets.<name>`).
"""
type AgentAsset {
  """The stored file, once it was uploaded; null until then."""
  asset: Asset
  id: ID!

  """What the agent says the file is."""
  kind: AssetKind!

  """The name bloks refer to the asset by."""
  name: String!

  """
  'sha256:' and the hex SHA-256 of the file's exact bytes, as the agent declares it.
  """
  ref: String!

  """
  The size of the file in bytes, as the agent declares it; null for a file it does not hold.
  """
  size: Int

  """
  The https URL the file can be fetched from, for a file the agent does not hold: an admin's client fetches and uploads it.
  """
  source: String
}

"""
Defines a callback that routes user interactions directly to an Arkitekt Agent via Rekuest.
"""
type AgentCall {
  arguments: [ActionArgument!]
  dependency: String!
  operation: String!
}

"""Slim, non-traversable snapshot of an agent for change feeds."""
type AgentChange {
  app: ID!
  blocked: Boolean!
  client: ID!
  connected: Boolean!
  id: ID!
  kind: AgentKind!
  lastSeen: DateTime
  name: String!
  organization: ID!
  release: ID!
  user: ID!
}

type AgentChangeEvent {
  create: AgentChange
  delete: ID
  update: AgentChange
}

"""
A dependency for a implementation. By defining dependencies, you can
    create a dependency graph for your implementations and actions
"""
input AgentDependencyInput {
  """
  The named action requirements of the agent — each a slot key plus the demand the resolved action must satisfy.
  """
  actionDependencies: [ActionDependencyInput!] = null

  """
  Which app this dependency corresponds to (i.e. do you want to use a stardist agent for that or imagej agents needs to be a world unique classsifier (reverse domain notation) that identifies the type of agent you want to use, and then we can have multiple agents of the same type running in the system, e.g. startdist could be the app for all agents that correpsond to a startdist instance)
  """
  app: String = null

  """
  Whether this dependency is auto resolvable or not. If so we will try to automatically resolve it based on the demands specified in the dependency and the capabilities of the available agents in the system. This is used to identify the demand in the system. Attention if any of the dependencies of this agent dependency is not auto resolvable, this dependency will also not be auto resolvable
  """
  autoResolvable: Boolean! = false

  """
  A description of the dependency, why it is needed and what it is used for. This can be used to provide more context to users when assigning dependencies.
  """
  description: String = null

  """
  The key of this dependency, when assigning you can reference this key to specify which agent_dependency you are assigning to.
  """
  key: String!

  """
  The maximum amount of viable instances for the agent. This is used to identify the demand in the system.
  """
  maxViableInstances: Int = null

  """
  The minimum amount of viable instances for the agent. This is used to identify the demand in the system.
  """
  minViableInstances: Int = null

  """
  A list of keys of other agent dependencies that are mutually exclusive with this one. This means two agent dependencies with mutually exclusive keys cannot be assigned to the same implementing agent. This is used to identify the demand in the system.
  """
  mutuallyExclusiveKeys: [String!] = null

  """
  The name of the agent. This is used to identify the agent in the system.
  """
  name: String = null

  """
  Whether the dependency is optional or not. If the dependency is optional, users can choose to not provide it
  """
  optional: Boolean! = false

  """
  The prefered amount of instances for the agent. This is used to identify the demand in the system.
  """
  preferedInstances: Int = null

  """
  The named state requirements of the agent — each a slot key plus the demand the agent's state must satisfy.
  """
  stateDependencies: [StateDependencyInput!] = null

  """The version of the app this dependency corresponds to."""
  version: String = null
}

"""A way to filter agents"""
input AgentFilter {
  AND: AgentFilter
  DISTINCT: Boolean
  NOT: AgentFilter
  OR: AgentFilter
  actionDemands: [ActionDemandInput!]

  """Filter using app identifier"""
  appIdentifier: ID

  """
  Agents that can receive work now: a webhook agent, or a connected one with a fresh heartbeat (takt's rule).
  """
  available: Boolean
  blokDependency: ID

  """
  The agents that called this task, nearest first: its ancestors' agents, then the agent of the app its run was started from. Never the task's own agent. How an app finds what its caller offers (with actionDemands) and calls it.
  """
  callerOf: ID

  """Filter by client ID of the app the agent is registered to"""
  clientId: String
  dependency: ID

  """Filter based on device"""
  deviceId: ID
  distinct: Boolean

  """Filter by implementations of the agents"""
  hasImplementations: [String!]

  """Filter by states of the agents"""
  hasStates: [String!]

  """Filter by IDs of the agents"""
  ids: [ID!]

  """
  The agents with at least one implementation listed under any of these protocols, declared as a hint (`on_scene_annotation`) or inferred. Each agent once, however many of its actions match.
  """
  implementsProtocols: [String!]

  """Filter by pinned agents"""
  pinned: Boolean

  """
  Agents meeting a port's descriptor constraints (a picker hands them in as $requires). The only descriptor of @rekuest/agent is @rekuest/supervisor; any other key is refused.
  """
  requires: [RequiresInput!]

  """Filter by name of the agents"""
  search: String
  stateDemands: [StateDemandInput!]

  """
  Agents whose self-declared supervisor is this app (e.g. 'plugin_engine').
  """
  supervisor: String

  """Filter by user ID"""
  user: ID

  """Filter based on version string"""
  versionNumber: String
}

input AgentInput {
  """
  What this agent is, in a sentence. Omitting it leaves whatever the agent already has: a name is what identifies it, a description is what tells two of them apart.
  """
  description: String = null

  """
  For a WEBHOOK agent: the URL the backend POSTs messages (Assign, Cancel, Caller* events) to.
  """
  hookUrl: String = null

  """
  For a WEBHOOK agent: the shared secret used to HMAC-sign messages in both directions (outbound delivery and POST intake).
  """
  hookUrlSecret: String = null

  """
  The transport kind of the agent: WEBSOCKET (default) or WEBHOOK (a HookAgent the backend POSTs to).
  """
  kind: AgentKind = null

  """
  The name of the agent. This is used to identify the agent in the system.
  """
  name: String = null
}

enum AgentKind {
  WEBHOOK
  WEBSOCKET
}

type AgentMapping {
  """Get the agent's name from the mapping."""
  agent: Agent!

  """Get the agent's ID from the mapping."""
  agentId: String!

  """Get a specific argument by key."""
