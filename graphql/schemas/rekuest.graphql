  """
  bindShortcut(input: BindShortcutInput!): Shortcut!

  """Block an agent from connecting."""
  block(input: BlockInput!): Agent!

  """Bounce an agent so it reconnects."""
  bounce(input: BounceInput!): Agent!

  """Cancel an active task."""
  cancel(input: CancelInput!): Task!

  """
  Cancel a probe. Idempotent: cancelling a finished probe is a no-op returning its terminal state.
  """
  cancelProbe(input: CancelProbeInput!): Probe!

  """Delete unreferenced actions from the system."""
  cleanupActions(actionIds: [ID!] = null): Int!

  """Collect results from a task."""
  collect(input: CollectInput!): [String!]!

  """
