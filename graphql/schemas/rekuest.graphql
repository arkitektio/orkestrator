  The full list of agent dependencies. When provided it replaces the existing set: keys not listed are deleted and their agent mappings on materialized bloks lose their dependency reference.
  """
  dependencies: [AgentDependencyInput!] = null @deprecated(reason: "Use editBlok: it checks the write is made on the head you read, keeps a message with the revision, and has a dry run. updateBlok keeps name and description.")

  """The description of the blok and its purpose."""
  description: String = null

  """The ID of the blok to update."""
  id: ID!

  """
  Name of the module (in the caller's organization) this blok renders against. Created if missing.
  """
  module: String = null @deprecated(reason: "Use editBlok: it checks the write is made on the head you read, keeps a message with the revision, and has a dry run. updateBlok keeps name and description.")

  """The name of the blok, used for identification in the system."""
  name: String = null

  """
  The blok as BSX, which the server parses into the tree it replaces the existing one with: send it or `components`, not both.
  """
  source: String = null @deprecated(reason: "Use editBlok: it checks the write is made on the head you read, keeps a message with the revision, and has a dry run. updateBlok keeps name and description.")
}

