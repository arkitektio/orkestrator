"""
An agent a task got for one of its action's dependencies, as it was resolved when the task was assigned.
"""
type TaskDependencyAgent {
  """
  The agent bound to it for this run. A key bound to several agents comes once per agent.
  """
  agent: Agent!

  """
  The dependency key, as the action's implementation declares it and the action's bloks name it.
  """
  key: String!
}

"""An event that occurred during a task."""
type TaskEvent {
  """
  The session position (pos) of the report that wrote this event; null for server-written events and agents without numbering.
  """
  agentPos: Int

  """
  When the agent recorded the report; null for server-written events and agents without numbering.
  """
  agentTs: DateTime

  """Time when event was created."""
  createdAt: DateTime!

  """If this event was delegated, the task it was delegated to."""
  delegatedTo: Task

  """EFFECT events: NOW, RANDOM, SLEEP or RECORD."""
  effect: String

  """Unique ID of the event."""
  id: ID!

  """
  EFFECT events: what the task calls this value; a replay matches values by key.
  """
  key: String

  """Kind of task event."""
  kind: TaskEventKind!

  """Log level of the event (LOG events; INFO when unset)."""
  level: LogLevel!

  """Optional message associated with the event."""
  message: String

  """Progress percentage."""
  progress: Int

  """Reference string for the event."""
  reference: String

  """Optional return values."""
  returns: AnyDefault

  """
  The report's step within its task; a task's history in step order. Null for server-written events.
  """
  step: Int

  """Associated task."""
  task: Task!

  """
  EFFECT events: the value the task took (NOW: epoch seconds, RANDOM: hex, SLEEP: deadline). HELD: what waits for a decision ({kind: "assign", prompt, action, agent, args, caller_task, caller_agent} for a child an agent asked for, with held: the child's id on its parent and root; {kind: "self", prompt, details} for a task's own hold). DECIDED: the decision ({approved, answer, auto, user}). DENIED: {answer, user}. FAILED: {code} when the failure has one the protocol names (STATE_PRECONDITION: the agent's state did not match the task's stateRequires, and nothing of it ran). LOST: what is known about the lost run.
  """
  value: AnyDefault
}

"""Slim, non-traversable task event for change feeds."""
type TaskEventChange {
  createdAt: DateTime!
  id: ID!
  kind: TaskEventKind!
  message: String
  progress: Int
  returns: AnyDefault
  task: ID!

  """
  EFFECT: the value taken. LOST: what is known (started, last_progress, effects, reason).
  """
  value: AnyDefault
}

