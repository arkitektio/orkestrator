"""
The effect class of an implementation — declared by the implementation, never the caller. NONE work is freely retryable/reclaimable; PHYSICAL work touches the real world (no UPSERT), so an ambiguous failure is terminal and must not be retried.
"""
enum EffectClass {
  NONE
  PHYSICAL
}

"\n    An effect is a way to modify a port based on a condition. For example,\n    you could have an effect that hides the port if another port meets a condition,\n    e.g. when the user selects a certain option in a dropdown, another port is hidden.\n\n    The condition is a pure blok UtilCall (`call`) evaluated client-side against the\n    catalog; it must return a boolean deciding whether the effect applies. `dependencies`\n    is the authoritative list of other ports the call may reference (plus `value` for the\n    port's own value).\n    "
input EffectInput {
  """
  The pure blok UtilCall, evaluated client-side against the catalog, that decides whether the effect applies. It must return a boolean. Argument value_paths may only reference names listed in `dependencies`, plus `value` for the port's own value.
  """
  call: UtilCallInput!

  """
  The form-field subscription list of the effect: the keys of the other ports whose values the call may reference. This list is authoritative: a value_path in the call may only reference these names (plus `value` for the port's own value). Use the .. syntax to traverse the tree of ports, e.g. 'foo..bar' for the child 'bar' of port 'foo'.
  """
  dependencies: [String!] = []

  """
  Whether to fade out the port when the effect is applied (if it is a hide effect)
  """
  fade: Boolean = true

  """The kind of the effect. Can be either message, hide or custom"""
  kind: EffectKind!

  """
  The message to display when the effect is applied (if it is a message effect)
  """
  message: String = null

  """
  The authoring expression the call was compiled from (informational; never parsed or validated by the server).
  """
  source: String = null
}

"""The kind of effect."""
enum EffectKind {
  CUSTOM
  HIDE
  MESSAGE
}

