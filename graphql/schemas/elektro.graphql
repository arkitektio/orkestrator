  exportedFrom(filters: FileLinkFilter): [FileLink!]!

  """The folder this file is filed in"""
  folder: Folder
  id: ID!
  name: String!

  """The organization this file belongs to"""
  organization: Organization!

  """Provenance entries for this file"""
