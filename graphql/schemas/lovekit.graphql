  """Only what the workflow (its root task id) created"""
  createdUnder: ID
  ids: [ID!]

  """
  Only what is in this collaboration (its key): put in, or part of what was
  """
  inCollaboration: ID
  search: String

  """Agents running for this user (the `sub` their token carries)."""
  userSub: String
}

type App {
  id: ID!
  identifier: String!
}

"""One axis of a data stream's frames"""
type Axis {
  name: String!
  type: AxisType!
}

"""
One axis of a data stream's frames: its name and its semantic kind. Units belong to a calibration
"""
input AxisInput {
  """The name of the axis, e.g. 'wavelength'"""
  name: String!

  """The semantic kind of the axis"""
  type: AxisType!
}

"""The semantic kind of an axis, as mikro's coordinate systems name them"""
enum AxisType {
  CATEGORY
  CHANNEL
  COORDINATE
  DISPLACEMENT
  INDEX
  MICROTIME
  SPACE
  SPECTRUM
  TIME
  VALUE
}

"""
What a step along one axis measures: position = offset + scale * index, in unit
"""
type Calibration {
  axis: String!
  offset: Float!
  scale: Float!
  unit: String!
}

"""
What a step along one axis measures: position = offset + scale * index, in unit
"""
input CalibrationInput {
  """The name of the axis this calibrates"""
  axis: String!

  """The position of the first value"""
  offset: Float! = 0

  """The step between two neighbouring values"""
  scale: Float! = 1

  """The unit of the calibrated position, e.g. 'nm'"""
  unit: String!
}

type Call {
  """
  The structures this call is about, oldest first: the last one is what it turned to most recently.
  """
  about: [Structure!]!
  createdAt: DateTime!
  creator: User

  """
  When the call's room last closed, everyone gone; null while it is live (or was never seen to end)
  """
  endedAt: DateTime
  id: ID!

  """How many are in the call right now."""
  participantCount: Int!

  """
  Who is in the call right now. Empty when nobody is: a call is live while LiveKit holds its room.
  """
  participants: [CallParticipant!]!

  """The LiveKit room this call's participants join."""
  roomName: String!
  title: String!
}

"""
A call starting in your organization, changing what it is about, ending, or coming back
"""
type CallEvent {
  """A call someone else just started, which you can join"""
  create: Call

  """A call whose room closed: everyone left. `endedAt` says when"""
  ended: Call

  """A call that had ended and is live again: someone joined it"""
  resumed: Call

  """
  A call that turned to something else; what it was about before is still in `about`
  """
  update: Call
}

"""Filter for calls"""
input CallFilter {
  AND: CallFilter
  DISTINCT: Boolean
  NOT: CallFilter
  OR: CallFilter

  """Calls about this structure."""
  about: StructureInput
  ids: [ID!]

  """Only calls whose LiveKit room is up (true) or down (false)."""
  live: Boolean
  search: String
}

"""Someone asking someone else into a call"""
type CallInvite {
