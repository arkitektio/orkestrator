  """The LiveKit room the agent's streams are tracks in."""
  roomName: String!

  """Every stream the agent offers, as it declared them last"""
  streams(filters: StreamFilter, order: StreamOrder, pagination: OffsetPaginationInput): [Stream!]!
  user: User!
}

"""Filter for agents"""
input AgentFilter {
  AND: AgentFilter
