  attestMetric(input: AttestMetricInput!): AssertedMetric!

  """Claim that a natural event exists"""
  attestNaturalEvent(input: AttestNaturalEventInput!): AssertedNaturalEvent!

  """Claim that a protocol event exists"""
  attestProtocolEvent(input: AttestProtocolEventInput!): AssertedProtocolEvent!

  """
  Claim that a structure still stands, after somebody retracted it. New evidence, not an undo — both positions stay on the record
  """
  attestStructure(input: AttestStructureInput!): AssertedStructure!

  """
