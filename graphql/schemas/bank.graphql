}

"""
A single booked or pending transaction on an account.

Bank fields are overwritten by every sync; ``category``, ``note`` and ``is_transfer``
belong to the users and survive re-syncs of booked rows (see :mod:`finance.sync`).
"""
input TransactionFilter {
  AND: TransactionFilter
  DISTINCT: Boolean
  NOT: TransactionFilter
  OR: TransactionFilter
  accounts: [ID!]
  amountMax: Decimal
  amountMin: Decimal
  categories: [ID!]
  dateFrom: Date
  dateTo: Date
  direction: Direction
  ids: [ID!]
  includeChildCategories: Boolean
  isTransfer: Boolean
  kind: TransactionKind
  kinds: [TransactionKind!]
  search: String
  status: TransactionStatus
  uncategorized: Boolean
}

"""
A provider's transaction type (Scalable's broker and savings types). OTHER is a type this service does not know yet.
"""
enum TransactionKind {
  BUY
  CASH_TRANSFER_IN
  CASH_TRANSFER_OUT
  CORPORATE_ACTION
  CURRENCY_SWITCH_BUY
  CURRENCY_SWITCH_SELL
  DEPOSIT
  DISTRIBUTION
  FEE
  INTEREST
  OTHER
  POCKET_MONEY
  REINVESTMENT
  REINVESTMENT_DISTRIBUTION
  REINVESTMENT_POCKET_MONEY
  SAVINGS_PLAN
  SELL
  SWAP_IN
  SWAP_OUT
  TAX
  TAX_RETURN
  TRANSFER_IN
  TRANSFER_OUT
  WITHDRAWAL
}

input TransactionOrder @oneOf {
  amount: Ordering
  bookingDate: Ordering
  createdAt: Ordering
}

"""Booking status as reported by the bank."""
enum TransactionStatus {
  BOOKED
  OTHER
  PENDING
}

"""Changes to a budget; omitted fields stay as they are."""
input UpdateBudgetInput {
  amount: Decimal
  currency: String
  endMonth: Date
  id: ID!
  startMonth: Date
}

"""Changes to a category; omitted fields stay as they are."""
input UpdateCategoryInput {
  color: String
  id: ID!
  kind: CategoryKind
  name: String

  """The new parent, or null to make it top-level."""
  parent: ID
}

"""Changes to a rule; omitted fields stay as they are."""
input UpdateCategoryRuleInput {
  active: Boolean
  amountMax: Decimal
  amountMin: Decimal
  apply: Boolean! = true
  category: ID
  direction: RuleDirection
  field: RuleField
  id: ID!
  match: RuleMatch
  pattern: String
  priority: Int
}

"""
A user account; sub is the stable subject identifier from the identity provider.
"""
type User {
  id: ID!
  preferredUsername: String!
  sub: String!
}

scalar _Any

union _Entity = BalanceSnapshot | BankAccount | BankConnection | Budget | Category | CategoryRule | HoldingSnapshot | Organization | RecurringPayment | Transaction | User

type _Service {
  sdl: String!
}