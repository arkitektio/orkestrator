type Mutation {
  """Teach a merchant another spelling."""
  addMerchantAlias(merchant: ID!, text: String!): MerchantAlias!

  """Write a previewed import into the accounts (idempotent)."""
  applyStatementImport(input: ApplyStatementImportInput!): StatementImport!

  """
  Link many transactions to a merchant (by id or key) and place (by id or store number), by hand; null hands them back to matching.
  """
  assignMerchant(input: AssignMerchantInput!): [Transaction!]!

  """Delete a pending link you started."""
  cancelLink(connection: ID!): ID!

  """Set or clear a transaction's category."""
  categorizeTransaction(input: CategorizeTransactionInput!): Transaction!

  """Set or clear the category of many transactions at once."""
  categorizeTransactions(category: ID = null, ids: [ID!]!): [Transaction!]!

  """Finish linking a bank with the redirect's code and state."""
  completeBankLink(input: CompleteBankLinkInput!): BankConnection!

  """Advance a Scalable Capital link; call until the connection is ACTIVE."""
  completeScalableLink(state: String!): BankConnection!

  """Create a monthly budget."""
  createBudget(input: CreateBudgetInput!): Budget!

  """Create a category."""
  createCategory(input: CreateCategoryInput!): Category!

  """Create a categorization rule."""
  createCategoryRule(input: CreateCategoryRuleInput!): CategoryRule!

  """
  Preview an uploaded Finanzguru export (nothing is written into the accounts yet).
  """
  createFinanzguruImport(input: CreateFinanzguruImportInput!): StatementImport!

  """
  Create a merchant (aliases from `fromTransactions` by default) and match it everywhere.
  """
  createMerchant(input: CreateMerchantInput!): Merchant!

  """Add a place to a merchant."""
  createMerchantLocation(input: MerchantLocationInput!): MerchantLocation!

  """Create a rule mapping matching transactions to a merchant."""
  createMerchantRule(input: CreateMerchantRuleInput!): MerchantRule!

  """Delete a budget."""
  deleteBudget(id: ID!): ID!

  """
  Delete a category (reassigning its transactions, or handing them back to rules and suggestions); `dryRun` reports what would happen.
  """
  deleteCategory(dryRun: Boolean! = false, id: ID!, reassignTo: ID = null): CategoryDeletion!

  """Delete a categorization rule."""
  deleteCategoryRule(apply: Boolean! = true, id: ID!): ID!

  """Delete a merchant; its transactions are categorized again."""
  deleteMerchant(id: ID!): ID!

  """Delete a merchant place."""
  deleteMerchantLocation(id: ID!): ID!

  """Delete a merchant rule."""
  deleteMerchantRule(apply: Boolean! = true, id: ID!): ID!

  """Detect recurring payments."""
  detectRecurring(accounts: [ID!] = null): [RecurringPayment!]!

  """Finalize a file upload after the client has written the object."""
  finishBigfileUpload(input: FinishBigFileUploadInput!): BigFileStore!

  """
  Look a place up (OpenStreetMap) and fill in its address and coordinates.
  """
  geocodeMerchantLocation(id: ID!, query: String = null): MerchantLocation!

  """Pin or un-pin a transaction as a transfer between own accounts."""
  markTransfer(input: MarkTransferInput!): Transaction!

  """Pin or un-pin many transactions as transfers at once."""
  markTransfers(ids: [ID!]!, isTransfer: Boolean = null): [Transaction!]!

  """Fold one merchant into another."""
  mergeMerchants(into: ID!, merchant: ID!): Merchant!

  """Run the rules over existing transactions."""
  reapplyRules(accounts: [ID!] = null, semanticAssign: Boolean! = true): Int!

  """Forget a merchant spelling."""
  removeMerchantAlias(id: ID!): ID!

  """Request temporary S3 read credentials for an uploaded file."""
  requestBigfileAccess(input: RequestBigFileAccessInput!): BigFileAccessGrant!

  """
  Request temporary S3 credentials to upload one file (e.g. a statement export to import).
  """
  requestBigfileUpload(input: RequestBigFileUploadInput!): BigFileUploadGrant!

  """Bring back a deleted base category."""
  restoreBaseCategory(key: String!): [Category!]!

  """
  Get the auth session of a pending link you started again (to continue a login).
  """
  resumeLink(connection: ID!): AuthSession!

  """Withdraw a bank consent; data is kept."""
  revokeBankConnection(id: ID!): BankConnection!

  """
  Add the base categories this organization lacks; returns all categories.
  """
  seedDefaultCategories: [Category!]!

  """Set which category imported category pairs mean."""
  setImportCategoryMappings(input: [ImportCategoryMappingInput!]!): [ImportCategoryMapping!]!

  """Confirm or ignore a recurring payment."""
  setRecurringStatus(input: SetRecurringStatusInput!): RecurringPayment!

  """Confirm or ignore many recurring payments at once."""
  setRecurringStatuses(ids: [ID!]!, status: RecurringStatus!): [RecurringPayment!]!

  """Set or clear a transaction's note."""
  setTransactionNote(input: SetTransactionNoteInput!): Transaction!

  """Start linking a bank; returns the auth session (finish: REDIRECT)."""
  startBankLink(input: StartBankLinkInput!): AuthSession!

  """
  Start linking Scalable Capital; returns the auth session (finish: POLL).
  """
  startScalableLink: AuthSession!

  """Pull an account from the bank now."""
  syncAccount(id: ID!): SyncResult!

  """
  Add base categories this organization does not have yet; returns the created ones.
  """
  syncBaseCategories: [Category!]!

  """Pull every account of a connection now."""
  syncConnection(id: ID!): [SyncResult!]!

  """Change a budget."""
  updateBudget(input: UpdateBudgetInput!): Budget!

  """Change a category."""
  updateCategory(input: UpdateCategoryInput!): Category!

  """Change a categorization rule."""
  updateCategoryRule(input: UpdateCategoryRuleInput!): CategoryRule!

  """
  Change a merchant; a new default category re-categorizes its transactions.
  """
  updateMerchant(input: UpdateMerchantInput!): Merchant!

  """Correct a merchant place."""
  updateMerchantLocation(input: UpdateMerchantLocationInput!): MerchantLocation!

  """Change a merchant rule."""
  updateMerchantRule(input: UpdateMerchantRuleInput!): MerchantRule!

  """
  Create a merchant, or update the one with this key (aliases are added).
  """
  upsertMerchant(input: UpsertMerchantInput!): Merchant!
}

