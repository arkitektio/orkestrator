  """The unique identifier of the snapshot."""
  id: ID!

  """The run this snapshot belongs to."""
  run: Run!

  """An optional status label describing the run state at this snapshot."""
  status: String

  """The logical time of the run at which this snapshot was taken."""
  t: Int!
}

