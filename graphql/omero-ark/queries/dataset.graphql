query ListDatasets($filters: DatasetFilter, $pagination: OffsetPaginationInput, $ordering: [ContainerOrder!]) {
  datasets(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListDataset
  }
}

query GetDataset($id: ID!) {
  dataset(id: $id) {
    ...Dataset
  }
}

# A dataset named elsewhere (a task's result, a firing's input): its name and
# how many images it holds — counted by OMERO, not by listing them.
query GetDatasetLine($id: ID!) {
  dataset(id: $id) {
    ...ListDataset
    imageCount
  }
}
