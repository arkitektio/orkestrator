# The device list page: its filter row narrows server-side (search; a group's
# members as ids), and its sort is the server's.
query BrowseDevices(
  $pagination: OffsetPaginationInput
  $filters: DeviceFilter
  $ordering: [DeviceOrdering!]
) {
  devices(pagination: $pagination, filters: $filters, ordering: $ordering) {
    ...BrowseDevice
  }
}

# What the device list's filter row offers: the groups, with their members.
# The device list's group picker: the groups by name. A picked group narrows on
# the server (`DeviceFilter.deviceGroup`).
query DeviceFilterOptions {
  deviceGroups {
    id
    name
  }
}

query ListDevices(
  $pagination: OffsetPaginationInput
  $filters: DeviceFilter
) {
  devices(pagination: $pagination, filters: $filters) {
    ...ListDevice
  }
}

query GetDevice($id: ID!) {
  device(id: $id) {
    ...DetailDevice
  }
}


query GetDeviceByDeviceId($id: ID!) {
  deviceByDeviceId(id: $id) {
    ...DetailDevice
  }
}

# One device's chip by its device id: what the batcher writes each answer as.
query DeviceChip($id: ID!) {
  deviceByDeviceId(id: $id) {
    ...DeviceChip
  }
}

# Many devices' chips by their device ids, in one request.
query DeviceChips($deviceIds: [ID!]!, $limit: Int!) {
  devices(filters: { deviceIds: $deviceIds }, pagination: { limit: $limit }) {
    ...DeviceChip
  }
}
