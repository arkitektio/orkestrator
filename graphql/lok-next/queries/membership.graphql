# One group of the Team page's people: the members a filter picks (a role, and
# none of the roles above it), a page at a time, with how many there are.
# "Show more" asks for the next page by `$offset` (lok caps a page at 100).
query TeamMembers($organization: ID!, $filters: MembershipFilter, $offset: Int! = 0, $limit: Int!) {
  organization(id: $organization) {
    id
    memberships(filters: $filters, pagination: { offset: $offset, limit: $limit }, ordering: [{ username: ASC }]) {
      ...TeamMember
    }
  }
  membershipStats(filters: $filters) {
    count
  }
}

# The Team page's "N members · M admins", counted by the server.
query TeamCounts($admins: MembershipFilter) {
  members: membershipStats {
    count
  }
  admins: membershipStats(filters: $admins) {
    count
  }
}

# The Team page's "New this month": the newest members since `since`. A
# membership made before lok recorded the date has none, and never matches.
query NewMembers($organization: ID!, $since: DateTime!, $limit: Int!) {
  organization(id: $organization) {
    id
    newMembers: memberships(
      filters: { createdAfter: $since }
      ordering: [{ createdAt: DESC }]
      pagination: { limit: $limit }
    ) {
      ...TeamMember
      createdAt
    }
  }
}
