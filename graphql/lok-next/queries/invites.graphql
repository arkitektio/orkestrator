# The links that grant one collaboration of a service instance, picked by the
# server. Without a collaboration: every link the caller may see.
query CollaborationLinks($collaboration: CollaborationRefInput) {
  invites(filters: { collaboration: $collaboration }) {
    ...CollaborationLink
  }
}

# Invites to become a member of the active organization (never collaboration
# links), newest first: `valid: true` for the open ones.
query TeamInvites($filters: InviteFilter, $pagination: OffsetPaginationInput) {
  invites(filters: $filters, pagination: $pagination, ordering: [{ createdAt: DESC }]) {
    ...TeamInvite
  }
}
