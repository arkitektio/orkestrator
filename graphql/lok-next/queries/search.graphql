# The palette's slice of lok: a row names a person or a group, nothing more.
query GlobalSearch(
  $search: String
  $noUsers: Boolean!
  $noGroups: Boolean!
  $pagination: OffsetPaginationInput
) {
  users: users(filters: { search: $search }, pagination: $pagination)
    @skip(if: $noUsers) {
    id
    username
    firstName
    lastName
  }

  groups: groups(filters: { search: $search }, pagination: $pagination)
    @skip(if: $noGroups) {
    id
    name
  }
}
