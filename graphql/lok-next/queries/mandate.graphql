# The mandates page: newest first, a page at a time; `filters: { live: true }`
# leaves out the revoked and expired ones.
query Mandates($filters: MandateFilter, $pagination: OffsetPaginationInput) {
  mandates(filters: $filters, pagination: $pagination, ordering: [{ createdAt: DESC }]) {
    ...ListMandate
  }
}

query GetMandate($id: ID!) {
  mandate(id: $id) {
    ...DetailMandate
  }
}

# Whether these mandates still work (`lok.mandateStatus`), in one request.
query MandateStatuses($ids: [ID!]!, $limit: Int!) {
  mandates(filters: { ids: $ids }, pagination: { limit: $limit }) {
    id
    isLive
    expiresAt
    revokedAt
  }
}

# The standing mandate an agent app issues device keys under, picked by the
# server: live, top-level, this agent, this subject app, this mesh permission.
query StandingMandate($agent: AppIdentifier!, $subject: AppIdentifier!, $allowMesh: Boolean!) {
  mandates(
    filters: {
      live: true
      claimant: AGENT
      hasParent: false
      agentIdentifier: $agent
      subjectIdentifier: $subject
      allowMesh: $allowMesh
    }
    pagination: { limit: 1 }
  ) {
    id
  }
}
