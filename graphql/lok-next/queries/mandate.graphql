query Mandates($pagination: OffsetPaginationInput) {
  mandates(pagination: $pagination) {
    ...ListMandate
  }
}

query GetMandate($id: ID!) {
  mandate(id: $id) {
    ...DetailMandate
  }
}

# The live mandates, to find the standing one an agent app issues device keys
# under (matched by agent, subject app, mesh permission and having no parent).
query StandingMandates {
  mandates(filters: { live: true }) {
    id
    agentIdentifier
    claimant
    allowMesh
    subject {
      identifier
      version
    }
    parent {
      id
    }
  }
}
