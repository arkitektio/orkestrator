query Me {
  me {
    ...DetailUser
  }
}

query User($id: ID!) {
  user(id: $id) {
    ...DetailUser
  }
}

# Every user a page's rows mention, in one request (`lok/lib/userChips.ts`).
# The limit is the batch's size: `users` is paginated, and a default page
# smaller than the batch would leave the rest unanswered.
query UserChips($ids: [ID!]!, $limit: Int!) {
  users(filters: { ids: $ids }, pagination: { limit: $limit }) {
    ...UserChip
  }
}

# One user as rows show them: what a chip is written to the cache as, so it
# hangs off `user(id)` and survives `cache.gc()`.
query UserChip($id: ID!) {
  user(id: $id) {
    ...UserChip
  }
}

query DetailUser($id: ID!) {
  user(id: $id) {
    ...DetailUser
  }
}

query Users($filters: UserFilter, $pagination: OffsetPaginationInput) {
  users(filters: $filters, pagination: $pagination) {
    ...ListUser
  }
}

query UserOptions($search: String, $values: [ID!]) {
  options: users(filters: { search: $search, ids: $values }) {
    value: id
    label: username
  }
}

query Profile {
  me {
    ...MeUser
  }
}
