query Clients($filters: ClientFilter, $pagination: OffsetPaginationInput) {
  clients(filters: $filters, pagination: $pagination) {
    ...ListClient
  }
}

query DetailClient($id: ID!) {
  client(id: $id) {
    ...DetailClient
  }
}

query MyManagedClients($kind: ClientKind!) {
  myManagedClients(kind: $kind) {
    ...ListClient
  }
}

query Client($clientId: ID!) {
  client(clientId: $clientId) {
    ...DetailClient
  }
}

# One client's chip by a client id: what the batcher writes each answer as.
query ClientChip($clientId: ID!) {
  client(clientId: $clientId) {
    ...ClientChip
  }
}

# Many clients' chips by the client ids other services know them by, in one
# request. A client keeps one id per release it ran: `requestedId` says which
# id each answer is for.
query ClientChips($clientIds: [ID!]!) {
  clientsByClientId(clientIds: $clientIds) {
    requestedId
    client {
      ...ClientChip
    }
  }
}
