fragment ListInvite on Invite {
  id
  token
  createdBy {
    id
    username
  }
  createdFor {
    ...ListOrganization
  }
  status
  createdAt
  expiresAt
}

fragment Invite on Invite {
  id
  token
  createdBy {
    id
    username
    profile {
      id
      avatar {
        presignedUrl
      }
    }
  }
  createdFor {
    ...Organization
  }
  acceptedBy {
    id
    username
    profile {
      id
      avatar {
        presignedUrl
      }
    }
  }
  status
  createdAt
  expiresAt
}

# A link that grants collaborations: what it grants, and how much of it is used.
fragment CollaborationLink on Invite {
  id
  inviteUrl
  expiresAt
  uses
  maxUses
  mesh
  valid
  collaborations {
    instance
    collaboration
    roles
  }
}
