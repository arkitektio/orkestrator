# An invite to become a member, as the Team page lists it: open ones wait on
# an admin, every one is in the history.
fragment TeamInvite on Invite {
  id
  createdAt
  valid
  status
  expiresAt
  token
  inviteUrl
  roles {
    id
    identifier
  }
  acceptedBy {
    id
    username
  }
}

# A link that grants collaborations: what it grants, and how much of it is used.
fragment CollaborationLink on Invite {
  id
  inviteUrl
  expiresAt
  uses
  maxUses
  mesh
  valid
  collaborations {
    instance
    collaboration
    roles
  }
}
