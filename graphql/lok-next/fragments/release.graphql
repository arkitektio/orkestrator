fragment DetailRelease on Release {
  id
  version
  logo {
    presignedUrl
  }
  app {
    ...ListApp
  }
  # How many clients run it, and the first page of them.
  clientCount
  clients(pagination: { limit: 50 }) {
    ...ListClient
  }
}

fragment ListRelease on Release {
  id
  version
  logo {
    presignedUrl
  }
  app {
    ...ListApp
  }
}
