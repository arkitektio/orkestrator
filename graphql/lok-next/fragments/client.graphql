fragment DetailClient on Client {
  id
  clientId
  name
  public
  kind
  role
  user {
    id
    username
  }
  release {
    ...ListRelease
  }
  logo {
    presignedUrl
  }
  node {
    id
    name
  }
  issueUrl
  publicSources {
    kind
    url
  }
}

fragment ListClient on Client {
  id
  user {
    id
    username
  }
  logo {
    presignedUrl
  }
  node {
    id
    name
  }
  name
  kind
  release {
    version
    logo {
      presignedUrl
    }
    app {
      id
      identifier
      logo {
        presignedUrl
      }
    }
  }
}

# A client as a row names it (its app, version and logo): looked up by the
# OAuth client id other services know it by, batched (`lok/lib/keyedChips.ts`).
fragment ClientChip on Client {
  id
  clientId
  name
  logo {
    presignedUrl
  }
  release {
    id
    version
    app {
      id
      identifier
    }
  }
}
