fragment Organization on Organization {
  id
  name
  slug
  description
  brandHue
  brandChroma
  # The Team page groups its members by these, admin roles first.
  roles {
    id
    identifier
    description
    isAdminRole
    isDefaultRole
  }
  # Deprecated: mirrors `profile.avatar`, read only as a fallback.
  avatar {
    presignedUrl
  }
  profile {
    id
    bio
    avatar {
      presignedUrl
    }
  }
}

fragment ListOrganization on Organization {
  id
  name
  slug
  brandHue
  brandChroma
  avatar {
    presignedUrl
  }
}
