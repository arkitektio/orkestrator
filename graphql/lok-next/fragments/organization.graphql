fragment Organization on Organization {
  id
  name
  slug
  description
  brandHue
  brandChroma
  # The Team page groups its members by these, admin roles first.
  roles {
    id
    identifier
    description
    isAdminRole
    isDefaultRole
  }
  # Deprecated: mirrors `profile.avatar`, read only as a fallback.
  avatar {
    presignedUrl
  }
  profile {
    id
    bio
    avatar {
      presignedUrl
    }
  }
  memberships {
    id
    roles {
      id
      identifier
    }
    user {
      id
      username
      firstName
      lastName
      profile {
        id
        avatar {
          presignedUrl
        }
      }
    }
  }
  invites {
    id
    createdAt
    valid
    roles {
      id
      identifier
    }
    acceptedBy {
      id
      username
      profile {
        id
        avatar {
          presignedUrl
        }
      }
    }
    status
    expiresAt
    token
    inviteUrl
  }
}

fragment ListOrganization on Organization {
  id
  name
  slug
  brandHue
  brandChroma
  avatar {
    presignedUrl
  }
}
