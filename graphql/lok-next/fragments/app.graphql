fragment DetailApp on App {
  id
  identifier
  logo {
    presignedUrl
  }
  # How many releases it has, and the newest ones.
  releaseCount
  releases(pagination: { limit: 50 }, ordering: [{ id: DESC }]) {
    ...ListRelease
  }
}

fragment ListApp on App {
  id
  identifier
  logo {
    presignedUrl
  }
}
