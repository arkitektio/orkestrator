fragment ListUser on User {
  username
  firstName
  lastName
  email
  avatar
  id
  profile {
    ...Profile
  }
}

fragment DetailUser on User {
  id
  username
  email
  firstName
  lastName
  avatar
  groups {
    id
    name
  }
  profile {
    ...Profile
  }
  memberships {
    ...Membership
  }
}

fragment MeUser on User {
  id
  username
  email
  firstName
  lastName
  avatar
}

# What a person looks like wherever they are mentioned (avatar, name chip):
# the `@lok/user` displays read this, batched over many rows (`useUserChip`),
# never the full `DetailUser` with its groups and memberships.
fragment UserChip on User {
  id
  username
  profile {
    id
    avatar {
      presignedUrl
    }
  }
}
