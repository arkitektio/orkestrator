fragment InstanceHealth on InstanceHealth {
  healthy
  reason
  instance {
    id
    instanceId
    name
    aliases {
      id
    }
  }
}

fragment HubHealth on Hub {
  id
  name
  identifier
  version
  online
  lastSeenAt
  # When it stops counting as online unless it reports again: a watcher sets a
  # timer for it instead of polling.
  offlineAt
  lastHealthy
  meshConnected
  meshHost
  latestHealth {
    id
    healthy
    createdAt
    instances {
      ...InstanceHealth
    }
  }
}
