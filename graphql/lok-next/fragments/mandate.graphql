# A standing authorization to act as the grantor, up to a pinned app: either
# an agent app (a deployer) issues keys under it, or whoever holds its key
# signs the app in (a provisioned device, CI).
fragment ListMandate on Mandate {
  id
  label
  keyPrefix
  claimant
  origin
  agentIdentifier
  subject {
    identifier
    version
    deviceId
    scopes
  }
  attestation
  maxClients
  createdAt
  expiresAt
  revokedAt
  isLive
  grantor {
    id
    username
  }
  agentDevice {
    id
    deviceId
    name
  }
  agentUser {
    id
    username
  }
  clients {
    id
    clientId
    name
    node {
      id
      name
    }
  }
}

fragment DetailMandate on Mandate {
  ...ListMandate
  hub {
    id
    name
    identifier
  }
}
