fragment Context on Context {
  organization {
    id
    name
    slug
    brandHue
    brandChroma
  }
  user {
    id
    username
    memberships {
      id
      brandHue
      brandChroma
      organization {
        id
      }
    }
  }
  hub {
    id
    name
    identifier
  }
  roles
  scope
}
