fragment Context on Context {
  organization {
    id
    name
    slug
    brandHue
    brandChroma
  }
  user {
    id
    username
  }
  # The caller's membership in THIS organization (its brand override), asked
  # directly rather than found among every organization's.
  membership {
    id
    brandHue
    brandChroma
  }
  hub {
    id
    name
    identifier
  }
  roles
  scope
}
