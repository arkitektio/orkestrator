fragment RunEvent on RunEvent {
  id
  source
  handle
  kind
  createdAt
  exception
  value
  t
  causedBy
}

# A run as its tracker draws it. The snapshots give the range slider its
# marks (`t` only); the latest one's `t` is where the live tracker starts,
# and `eventsBetween(min: t)` already returns that snapshot's events.
fragment DetailRun on Run {
  id
  taskId
  snapshots {
    id
    t
  }
  createdAt
  latestSnapshot {
    id
    t
  }
  status
  flow {
    ...Flow
  }
}

fragment ListRun on Run {
  id
  taskId
  createdAt
  status
  flow {
    id
    title
    workspace {
      id
      title
    }
  }
}

# A carousel slide: the run's flow as a still preview, not a live tracker.
fragment CarouselRun on Run {
  id
  taskId
  createdAt
  status
  flow {
    ...Flow
  }
}
