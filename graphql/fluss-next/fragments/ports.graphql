  __typename
  kind
  min
  max
  step
}

fragment FlussStateChoiceAssignWidget on StateChoiceAssignWidget {
  __typename
  kind
  followValue
  statePath
  stateCall {
    ...FlussPortCall
  }
  stateAccessors {
    optionKey
    path
    call {
      ...FlussPortCall
    }
  }
  dependency
  dependencies
}

fragment FlussProxyWidget on ProxyWidget {
  __typename
  kind
  targetPort
  targetAction
  targetDependency
}

fragment FlussFilterPort on ArgPort {
  __typename
  kind
  key
  identifier
  widget {
    ... on SearchAssignWidget {
      query
    }
  }
  description
  nullable
}

fragment FlussSearchAssignWidget on SearchAssignWidget {
  __typename
  kind
  query
  ward
  filters {
    ...FlussFilterPort
  }
  dependencies
}

# Custom widgets name a component from the UI catalog (`component`) and bind
# its props like a blok node. `fallback` is the widget to use when the catalog
# does not know the component; it cannot recurse into another custom widget,
# so it is selected as the non-custom variants only.
fragment FlussCustomAssignWidget on CustomAssignWidget {
  __typename
  kind
  followValue
  component
  props {
    ...FlussBlokComponentProp
  }
  dependencies
  fallback {
    __typename
    kind
    ...FlussStringAssignWidget
    ...FlussSearchAssignWidget
    ...FlussSliderAssignWidget
    ...FlussChoiceAssignWidget
    ...FlussProxyWidget
    ...FlussStateChoiceAssignWidget
  }
}

# Choices live on the port (`ArgPort.choices` / `ReturnPort.choices`); the
# widget only says how to present them.
fragment FlussChoiceAssignWidget on ChoiceAssignWidget {
  __typename
  kind
  followValue
  placeholder
}

# Child ports (list items, dict values, union variants, model fields) carry
# the same effects, validators and defaults as top-level ports; the client
# renders and validates them at every depth. Fragments cannot recurse, so the
# tree is selected three levels deep; the deepest level keeps enough to render
# a leaf widget.
fragment FlussArgChildPortDeep on ArgPort {
  __typename
  kind
  key
  label
  identifier
  referenceUnit
  proposedUnits
  dimension
  choices {
    value
    label
    description
  }
  widget {
    ...FlussAssignWidget
  }
  description
  nullable
  default
  children {
    __typename
    kind
    key
    identifier
    nullable
    widget {
      ...FlussAssignWidget
    }
  }
}

fragment FlussArgChildPortNested on ArgPort {
  __typename
  kind
  key
  label
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    ...FlussArgChildPortDeep
  }
  choices {
    value
    label
    description
  }
  widget {
    ...FlussAssignWidget
  }
  effects {
    ...FlussPortEffect
  }
  validators {
    ...Validator
  }
  description
  nullable
  default
}

fragment FlussArgChildPort on ArgPort {
  __typename
  kind
  key
  label
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    ...FlussArgChildPortNested
  }
  widget {
    ...FlussAssignWidget
  }
  effects {
    ...FlussPortEffect
  }
  validators {
    ...Validator
  }
  choices {
    value
    label
    description
  }
  nullable
  description
  default
}

