fragment FlussBaseEffect on Effect {
  __typename
  kind
  dependencies
  source
  call {
    ...FlussPortCall
  }
}

fragment FlussCustomEffect on CustomEffect {
  ...FlussBaseEffect
  __typename
  kind
}

fragment FlussMessageEffect on MessageEffect {
  ...FlussBaseEffect
  __typename
  kind
  message
}

fragment FlussHideEffect on HideEffect {
