# `ensureStructure` is gone — `assertStructureExists` always took the same
# (identifier, object) pair and is idempotent on it, so there was never a second
# call to make.
mutation AssertStructureExists($input: AssertStructureExistsInput!) {
  assertStructureExists(input: $input) {
    pending
    assertion {
      ...Assertion
    }
    structure {
      ...Structure
    }
  }
}

mutation RetractStructure($id: ID!) {
  retractStructure(input: { id: $id }) {
    pending
    assertion {
      ...Assertion
    }
    structure {
      ...Structure
    }
  }
}

# Was `updateStructure`. A structure's identity is immutable; what a later act
# adds is measurements against it, which is all this ever did.
mutation RecordMetrics($input: RecordMetricsInput!) {
  recordMetrics(input: $input) {
    pending
    assertion {
      ...Assertion
    }
    structure {
      ...Structure
    }
  }
}

# Was `linkStructureToEntity`. Records an INFORMS claim — the datum is evidence
# for the entity — so what it answers with is the link, not the structure it
# started from.
mutation AssertInforms($input: AssertInformsInput!) {
  assertInforms(input: $input) {
    pending
    assertion {
      ...Assertion
    }
    link {
      ...Link
    }
  }
}
