mutation CreateTodoList($input: CreateTodoListInput!) {
  createTodoList(input: $input) {
    ...ListTodoList
  }
}

mutation UpdateTodoList($input: UpdateTodoListInput!) {
  updateTodoList(input: $input) {
    ...ListTodoList
  }
}

mutation DeleteTodoList($id: ID!) {
  deleteTodoList(input: { id: $id })
}

mutation CreateTodoItem($input: CreateTodoItemInput!) {
  createTodoItem(input: $input) {
    ...TodoItemWithList
  }
}

mutation UpdateTodoItem($input: UpdateTodoItemInput!) {
  updateTodoItem(input: $input) {
    ...ListTodoItem
  }
}

mutation DeleteTodoItem($id: ID!) {
  deleteTodoItem(input: { id: $id })
}

mutation MoveTodoItem($input: MoveTodoItemInput!) {
  moveTodoItem(input: $input) {
    id
    status
    position
  }
}

mutation AttachToTodoItem($input: AttachToTodoItemInput!) {
  attachToTodoItem(input: $input) {
    ...ListTodoItem
  }
}

mutation DetachFromTodoItem($id: ID!) {
  detachFromTodoItem(input: { id: $id }) {
    ...ListTodoItem
  }
}

# One object's status. The answer is the item's column and progress plus that
# one object, never the item's other objects (an item may carry hundreds); the
# cache merges it into every view of the item. `useSetTodoStatus` answers it
# optimistically, so this exact shape is also what the client builds.
mutation SetTodoStructureStatus($id: ID!, $status: TodoStatus!) {
  setTodoStructureStatus(input: { id: $id, status: $status }) {
    id
    status
    position
    updatedAt
    progress {
      ...TodoProgress
    }
    structures(filters: { ids: [$id] }) {
      ...TodoItemStructure
    }
  }
}

mutation SetTodoStructuresStatus($ids: [ID!]!, $status: TodoStatus!) {
  setTodoStructuresStatus(input: { ids: $ids, status: $status }) {
    ...ListTodoItem
  }
}

mutation AssignTodoItem($id: ID!, $assignee: ID) {
  assignTodoItem(input: { id: $id, assignee: $assignee }) {
    ...ListTodoItem
  }
}

mutation AssignTodoList($id: ID!, $assignee: ID) {
  assignTodoList(input: { id: $id, assignee: $assignee }) {
    ...ListTodoList
  }
}

mutation ScheduleTodoItem($id: ID!, $dueAt: DateTime) {
  scheduleTodoItem(input: { id: $id, dueAt: $dueAt }) {
    ...ListTodoItem
  }
}

mutation ScheduleTodoList($id: ID!, $dueAt: DateTime) {
  scheduleTodoList(input: { id: $id, dueAt: $dueAt }) {
    ...ListTodoList
  }
}
