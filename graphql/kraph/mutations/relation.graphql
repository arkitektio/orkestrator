mutation AssertRelationExists($input: AssertRelationExistsInput!) {
  assertRelationExists(input: $input) {
    pending
    assertion {
      ...Assertion
    }
    link {
      ...Link
    }
    drawings {
      ...EdgeDrawing
    }
  }
}

# `updateRelation` is gone. A relation is not edited in place: superseding it
# records a second assertion that retracts the old one, so both positions stay
# on the record. The payload reports the one that now stands.
mutation SupersedeRelation($input: SupersedeRelationInput!) {
  supersedeRelation(input: $input) {
    pending
    assertion {
      ...Assertion
    }
    link {
      ...Link
    }
    drawings {
      ...EdgeDrawing
    }
  }
}

mutation RetractRelation($id: ID!) {
  retractRelation(input: { id: $id }) {
    pending
    assertion {
      ...Assertion
    }
    link {
      ...Link
    }
  }
}
