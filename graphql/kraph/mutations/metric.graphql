# Many measurements, about any number of data, as one act: each names its datum
# by identifier/object, and the backend creates the structures they describe.
mutation AssertMetricValues($input: AssertMetricValuesInput!) {
  assertMetricValues(input: $input) {
    pending
    recorded
    assertion {
      ...Assertion
    }
    metrics {
      ...Metric
    }
  }
}

mutation RetractMetric($id: String!) {
  retractMetric(input: { id: $id }) {
    assertion {
      ...Assertion
    }
    metric {
      ...Metric
    }
  }
}

# Correcting a value does not erase the old one: the superseded claim stays in
# the log, and this records the claim that replaces it.
mutation SupersedeMetricValue($input: SupersedeMetricValueInput!) {
  supersedeMetricValue(input: $input) {
    assertion {
      ...Assertion
    }
    metric {
      ...Metric
    }
  }
}

# A hand-entered value is still evidence, just the simplest kind: an
# "itoldyouso" structure carries no measurement behind it, only the assertion.
# The backend creates the structure and its measurement edge on demand.
mutation AssertMetricValue($input: AssertMetricValueInput!) {
  assertMetricValue(input: $input) {
    assertion {
      ...Assertion
    }
    metric {
      ...Metric
    }
  }
}
