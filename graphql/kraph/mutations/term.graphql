mutation CreateTerm($input: CreateTermInput!) {
  createTerm(input: $input) {
    ...Term
  }
}

mutation UpdateTerm($input: UpdateTermInput!) {
  updateTerm(input: $input) {
    ...Term
  }
}

# A word is never deleted — every claim recorded under it names it. Hiding puts
# it away: pickers stop offering it, and showing it again is the same call.
mutation SetTermHidden($id: String!, $hidden: Boolean!) {
  updateTerm(input: { id: $id, hidden: $hidden }) {
    ...Term
  }
}

# Typing a word the organization has not used before claims it. The key is the
# value the picker stores, so these return it rather than the id.
mutation CreateEntityTermInline($input: String!) {
  result: createTerm(input: { kind: ENTITY, key: $input }) {
    value: key
    label: key
  }
}

mutation CreateProtocolEventTermInline($input: String!) {
