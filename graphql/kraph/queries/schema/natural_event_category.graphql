query GetNaturalEventCategory($id: ID!) {
  naturalEventCategory(id: $id) {
    ...NaturalEventCategory
  }
}

query ListNaturalEventCategories(
  $filters: NaturalEventCategoryFilter
  $pagination: OffsetPaginationInput
) {
  naturalEventCategories(filters: $filters, pagination: $pagination) {
    ...ListNaturalEventCategory
  }
}

# What a display shows of it: its name, its word, its picture and how many roles it has.
query GetNaturalEventCategorySummary($id: ID!) {
  naturalEventCategory(id: $id) {
    id
    label
    description
    term {
      ...ListTerm
    }
    image {
      ...MediaStore
    }
    inputs {
      key
    }
    outputs {
      key
    }
  }
}
