query GetRelationCategory($id: ID!) {
  relationCategory(id: $id) {
    ...RelationCategory
  }
}

query ListRelationCategory(
  $filters: RelationCategoryFilter
  $pagination: OffsetPaginationInput
) {
  relationCategories(filters: $filters, pagination: $pagination) {
    ...ListRelationCategory
  }
}

# What a display shows of it: its name, its word and a line of description.
query GetRelationCategorySummary($id: ID!) {
  relationCategory(id: $id) {
    id
    label
    description
    term {
      ...ListTerm
    }
  }
}
