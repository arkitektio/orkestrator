query GetProtocolEventCategory($id: ID!) {
  protocolEventCategory(id: $id) {
    ...ProtocolEventCategory
  }
}

query ListProtocolEventCategories(
  $filters: ProtocolEventCategoryFilter
  $pagination: OffsetPaginationInput
) {
  protocolEventCategories(filters: $filters, pagination: $pagination) {
    ...ListProtocolEventCategory
  }
}

# What a display shows of it: its name, its word, its picture and how many roles it has.
query GetProtocolEventCategorySummary($id: ID!) {
  protocolEventCategory(id: $id) {
    id
    label
    description
    term {
      ...ListTerm
    }
    image {
      ...MediaStore
    }
    inputs {
      key
    }
    outputs {
      key
    }
  }
}
