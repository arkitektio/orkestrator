query GetGraph($id: ID!) {
  graph(id: $id) {
    ...Graph
  }
}

query SearchGraphs($search: String, $values: [ID!]) {
  options: graphs(
    filters: { search: $search, ids: $values }
    pagination: { limit: 10 }
  ) {
    value: id
    label: name
  }
}

query ListGraphs($filters: GraphFilter, $pagination: OffsetPaginationInput, $ordering: [GraphOrder!]) {
  graphs(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListGraph
  }
}

# A graph as another surface shows it (a palette row, a card): its name and how
# many entity categories it declares, not its whole schema.
query GetGraphSummary($id: ID!) {
  graph(id: $id) {
    id
    name
    description
  }
  entityCategoryStats(filters: { graph: { id: $id } }) {
    count
  }
}
