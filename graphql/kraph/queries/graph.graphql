query GetGraph($id: ID!) {
  graph(id: $id) {
    ...Graph
  }
}

query SearchGraphs($search: String, $values: [ID!]) {
  options: graphs(
    filters: { search: $search, ids: $values }
    pagination: { limit: 10 }
  ) {
    value: id
    label: name
  }
}

query ListGraphs($filters: GraphFilter, $pagination: OffsetPaginationInput, $ordering: [GraphOrder!]) {
  graphs(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListGraph
  }
}

# The words a view speaks, for its sidebar. Read when the tab opens: the page
# itself draws the schema and does not need the vocabulary.
query ViewWords($id: ID!) {
  graph(id: $id) {
    id
    nodeCategories {
      ... on Category {
        id
        label
        term {
          ...ListTerm
        }
      }
    }
    edgeCategories {
      ... on Category {
        id
        label
        term {
          ...ListTerm
        }
      }
    }
  }
}
