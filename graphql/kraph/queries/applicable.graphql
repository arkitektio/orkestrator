# Measurements need no probe: `MeasurementCategoryFilter.sourceIdentifier` still
# answers "which measurements accept this structure kind" directly.
query ListApplicableMeasurementCategories(
  $sourceIdentifier: String
  $search: String
  $graph: ID
) {
  measurementCategories(
    filters: {
      sourceIdentifier: $sourceIdentifier
      search: $search
      graph: { id: $graph }
    }
  ) {
    ...ListMeasurementCategoryWithGraph
  }
}

# With no `ids`, answers which entity categories a descriptor admits: what an
# edge category's `targetDescriptor` used to have precomputed as
# `MaterializedEdge.target`.
query EntityCategoriesMatchingDescriptor(
  $ids: [ID!]
  $descriptor: EntityDescriptorInput
) {
  entityCategories(filters: { ids: $ids, matchesDescriptor: $descriptor }) {
    ...ListEntityCategory
    graph {
      id
      name
    }
  }
}
