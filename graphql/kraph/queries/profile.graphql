# A member's profile: the todo lists assigned to them (or holding an item
# assigned to them), newest first, each with its project.
query ProfileTodoLists($assignee: ID!, $pagination: OffsetPaginationInput) {
  todoLists(
    filters: { assignee: $assignee }
    pagination: $pagination
    ordering: [{ createdAt: DESC }]
  ) {
    ...ListTodoList
    project {
      ...ListProject
    }
  }
}

# The projects a member works on: ones they made, or holding a todo list or item
# assigned to them (`ProjectFilter.member`), newest first.
query ProfileProjects($member: ID!, $pagination: OffsetPaginationInput) {
  projects(filters: { member: $member }, pagination: $pagination, ordering: [{ createdAt: DESC }]) {
    ...ListProject
  }
}

# A member's profile feed: the graphs they made, newest first.
query ProfileFeedGraphs($filters: GraphFilter, $pagination: OffsetPaginationInput) {
  graphs(filters: $filters, pagination: $pagination, ordering: [{ createdAt: DESC }]) {
    ...ListGraph
    createdAt
  }
}
