query GetTerm($id: ID!) {
  term(id: $id) {
    ...DetailTerm
  }
}

query ListTerms($filters: TermFilter, $pagination: VocabularyPaginationInput) {
  terms(filters: $filters, pagination: $pagination) {
    ...ExploreTerm
  }
}

# The same word under its other kinds: 'AIS' as an entity and 'AIS' as a
# relation are two terms, and a term page links to its namesakes.
query TermNamesakes($key: String!) {
  terms(filters: { keys: [$key] }, pagination: { limit: 20 }) {
    ...ListTerm
  }
}

# A term's identity is (kind, key): creating one that exists fills it in rather
# than failing, so the create dialog asks first and offers the existing word.
query FindTerm($kind: TermKind!, $key: String!) {
  terms(filters: { kinds: [$kind], keys: [$key] }, pagination: { limit: 1 }) {
    ...ListTerm
  }
}

query SearchTerms($search: String, $values: [ID!], $hidden: Boolean) {
  options: terms(
    filters: { search: $search, ids: $values, hidden: $hidden }
    pagination: { limit: 10 }
  ) {
    value: id
    label: key
  }
}

# One search for every kind — the kind is a variable, so a picker that knows
# which sort of word it wants does not need its own query. Hidden words are
# never offered.
query SearchAssignableTerms($search: String, $kinds: [TermKind!]) {
  terms(
    filters: { search: $search, kinds: $kinds, hidden: false }
    pagination: { limit: 20 }
  ) {
    ...AssignableTerm
  }
}

# Claims name a word, so the pickers search term *keys*, not ids — the key is
# what goes on the wire. A term's identity is (kind, key), so each kind gets its
# own search: `GraphQLCreatableSearchField` has no way to pass a filter through.
#
# `$hidden` is not a literal `false`: the same query resolves an already chosen
# key (`$values`), and a word hidden since must still show its label there.
# `useOfferedTermSearch` (kraph/lib/terms) sets it on the search path only.
query SearchEntityTerms($search: String, $values: [String!], $hidden: Boolean) {
  options: terms(
    filters: { search: $search, keys: $values, kinds: [ENTITY], hidden: $hidden }
    pagination: { limit: 10 }
  ) {
    value: key
    label: key
  }
}

