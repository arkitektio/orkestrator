fragment RelationCategory on RelationCategory {
  ...BaseEdgeCategory
  ...BaseCategory
  sourceDescriptor {
    ...EntityDescriptor
  }
  targetDescriptor {
    ...EntityDescriptor
  }
  propertyDefinitions {
     ...PropertyDefinition
  }
  ageName
  label
  description
  image {
    ...MediaStore
  }
  pinned
}

# A list row, a canvas edge and a picker read the ends and the name. The
# property definitions (with their rules) are the detail page's and the forms'.
fragment ListRelationCategory on RelationCategory {
  ...BaseListCategory
  ...BaseListEdgeCategory
  sourceDescriptor {
    ...EntityDescriptor
  }
  targetDescriptor {
    ...EntityDescriptor
  }
  label
}
