fragment EventRole on EventRole {
  key
  role
  descriptor {
    ...EntityDescriptor
  }
}


fragment EntityDescriptor on EntityDescriptor {
  keys
  ontologyTerms
  defaultCategoryKey
}

# A structure kind has no key, no tags and no ontology references — those
# descriptor fields are gone from the schema entirely now, not just unused.
# `identifiers` is what actually selects one.
fragment StructureDescriptor on StructureDescriptor {
  # The whole descriptor is what gets handed back to the server as
  # `matchesDescriptor` when asking whether a structure kind is admitted.
  defaultCategoryKey
}
