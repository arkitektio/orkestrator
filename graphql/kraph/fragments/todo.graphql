# Todo lists: product state in kraph (`todos/` on the server). People are subs,
# objects are (identifier, object) pairs, the way comments address them.
fragment TodoItemStructure on TodoItemStructure {
  id
  identifier
  object
  status
  startedAt
  startedBy
  done
  doneAt
  doneBy
  position
}

fragment TodoProgress on TodoProgress {
  done
  total
}

fragment ListTodoItem on TodoItem {
  id
  title
  description
  status
  position
  assignee
  effectiveAssignee
  dueAt
  effectiveDueAt
  updatedAt
  progress {
    ...TodoProgress
  }
  # The next few objects still to do, not all of them: an item may carry
  # hundreds. `progress` says how many there are; the item page and the
  # card's "+N" read the rest (`TodoItemObjects`).
  upNext: structures(filters: { status: [TODO, DOING] }, ordering: [{ position: ASC }], pagination: { limit: 3 }) {
    ...TodoItemStructure
  }
}

fragment TodoItemWithList on TodoItem {
  ...ListTodoItem
  list {
    id
    name
    project {
      id
      name
    }
  }
}

fragment ListTodoList on TodoList {
  id
  name
  description
  assignee
  dueAt
  createdAt
  progress {
    ...TodoProgress
  }
}

fragment TodoList on TodoList {
  ...ListTodoList
  project {
    id
    name
  }
  items(ordering: [{ position: ASC }]) {
    ...ListTodoItem
  }
}

# An item without its objects: where something else is the point (an object's
# own track, a dashboard). `progress` says how far its objects are.
fragment SlimTodoItem on TodoItem {
  id
  title
  description
  status
  position
  assignee
  effectiveAssignee
  dueAt
  effectiveDueAt
  updatedAt
  progress {
    ...TodoProgress
  }
  list {
    id
    name
    project {
      id
      name
    }
  }
}

# One object's row on one item: the object's todo track.
fragment TodoTrackRow on TodoItemStructure {
  ...TodoItemStructure
  item {
    ...SlimTodoItem
  }
}

fragment TodoSummary on TodoSummary {
  todo
  doing
  done
  total
  overdue
  objects {
    ...TodoProgress
  }
}
