fragment BroadcastStream on Stream {
  id
  title
  kind
}

fragment SoloBroadcast on SoloBroadcast {
  id
  title
  createdAt
  streamer {
    ...Streamer
  }
  videoStreams {
    ...BroadcastStream
  }
  audioStreams {
    ...BroadcastStream
  }
}

fragment ListSoloBroadcast on SoloBroadcast {
  id
  title
  createdAt
  streamer {
    ...Streamer
  }
  videoStreams {
    ...BroadcastStream
  }
  audioStreams {
    ...BroadcastStream
  }
}


fragment CollaborativeBroadcast on CollaborativeBroadcast {
  id
  title
  streamers {
    ...Streamer
  }
}
