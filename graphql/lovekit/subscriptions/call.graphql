subscription WatchCallInvites {
  callInvites {
    create {
      ...CallInvite
    }
    delete
  }
}

# Calls as they start, change topic, end (LiveKit closed the room) and resume.
subscription WatchCalls {
  calls {
    create {
      ...ListCall
    }
    update {
      ...ListCall
    }
    ended {
      id
    }
    resumed {
      ...ListCall
    }
  }
}

# Who joins and leaves one call, as LiveKit reports it.
subscription WatchCallParticipants($call: ID!) {
  callParticipants(call: $call) {
    joined {
      ...CallParticipant
    }
    left {
      identity
    }
  }
}
