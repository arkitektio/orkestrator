fragment LLMModel on LLMModel {
  id
  modelId
  llmString
  # The provider, and a few of its other models.
  provider {
    ...Provider
    models(pagination: { limit: 5 }) {
      id
      modelId
    }
  }
  features
  embedderFor {
    id
    name
  }
  inputModalities
  outputModalities
}

fragment ListLLMModel on LLMModel {
  id
  modelId
  llmString
  features
  inputModalities
  outputModalities
  provider {
    id
    name
    kind
  }
  embedderFor {
    id
    name
  }
}
