fragment Room on Room {
  id
  title
  description
  messages {
    ...ListMessage
  }
}

fragment ListRoom on Room {
  id
  title
  description
}

fragment RecentRoom on Room {
  id
  title
  description
  createdAt
  latest: messages(ordering: [{ createdAt: DESC }], pagination: { limit: 1 }) {
    id
    text
    createdAt
    attachedStructures {
      identifier
      object
    }
  }
}
