fragment Room on Room {
  id
  title
  description
  createdAt
  creator {
    id
    preferredUsername
  }
  organization {
    id
    identifier
  }
  agents {
    id
    name
    user {
      id
      preferredUsername
    }
  }
  # The newest page of the conversation; "Load earlier" reads older pages
  # (`RoomMessages`). The chat sorts by `createdAt` itself.
  messageCount
  messages(ordering: [{ createdAt: DESC }], pagination: { limit: 50 }) {
    ...ListMessage
  }
  talkingAbout {
    identifier
    object
  }
}

# A room as the Rooms page's card shows it: how much was said, and the latest of it.
fragment RoomCard on Room {
  id
  title
  description
  messageCount
  latest: messages(ordering: [{ createdAt: DESC }], pagination: { limit: 1 }) {
    id
    text
    createdAt
    attachedStructures {
      identifier
      object
    }
  }
}

fragment RecentRoom on Room {
  id
  title
  description
  createdAt
  lastActivity
  latest: messages(ordering: [{ createdAt: DESC }], pagination: { limit: 1 }) {
    id
    text
    createdAt
    attachedStructures {
      identifier
      object
    }
  }
}
