fragment Provider on Provider {
  id
  name
  kind
  # The models themselves page through `llmModels(filters: { provider })`.
  modelCount
}

# A provider as a card shows it: how many models, and the first two by name.
fragment ListProvider on Provider {
  id
  name
  kind
  modelCount
  preview: models(pagination: { limit: 2 }) {
    id
    modelId
  }
}
