query GetRoom($id: ID!) {
  room(id: $id) {
    ...Room
  }
}
query ListRooms($filter: RoomFilter, $pagination: OffsetPaginationInput) {
  rooms(filters: $filter, pagination: $pagination) {
    ...RoomCard
  }
}

# An older page of a room's conversation, newest first: "Load earlier".
query RoomMessages($id: ID!, $offset: Int!, $limit: Int!) {
  room(id: $id) {
    id
    earlier: messages(ordering: [{ createdAt: DESC }], pagination: { offset: $offset, limit: $limit }) {
      ...ListMessage
    }
  }
}

query RecentRooms($filter: RoomFilter, $pagination: OffsetPaginationInput) {
  rooms(filters: $filter, pagination: $pagination, ordering: [{ lastMessageAt: DESC }]) {
    ...RecentRoom
  }
}
