fragment State on State {
  id
  # Whose it is: a state is followed as `state:<agent>/<interface>`.
  agent {
    id
  }
  definition {
    hash
    name
    ports {
      ...ReturnPort
    }
  }
  interface
  updatedAt
}

fragment StateEvent on State {
  id
  updatedAt
}

fragment Patch on Patch {
  id
  ops {
    op
    path
    value
  }
  interface
  timestamp
  globalFutureRevision
}

fragment StatePatchEvent on StatePatchEvent {
  stateId
  agentId
  ops {
    op
    path
    value
  }
  globalRevision
  sessionId
  timestamp
  interface
}

fragment StateSnapshotEvent on StateSnapshotEvent {
  stateId
  agentId
  interface
  value
  globalRevision
  sessionId
  timestamp
}
fragment AgentSnapshotEvent on AgentSnapshotEvent {
  agentId
  values
  globalRevision
  sessionId
  timestamp
}

# A row of the states page: whose it is and what it is, without its ports.
fragment ListState on State {
  id
  interface
  key
  appIdentifier
  updatedAt
  agent {
    id
    name
    connected
  }
  definition {
    name
  }
}
