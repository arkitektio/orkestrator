# The content-addressed model store: a GLB recorded under the SHA-256 of its
# exact bytes. `file` is the media store its bytes are read from.

fragment StoredModel on ThreeDModel {
  id
  name
  ref
  source
  size
  nodes
  stats {
    nodes
    triangles
    textures
    animations
  }
  file {
    ...MediaStore
  }
}

fragment ModelPolicy on ModelPolicy {
  maxSize
  maxJson
  maxNodes
  maxTriangles
  maxTextureSize
  maxTextureMemory
  maxAnimations
  extensions
}

fragment MissingModel on MissingModel {
  ref
  source
  bloks
}

fragment ModelBlok on Blok {
  id
  name
  description
  forNode
  materializedBloks {
    ...ListMaterializedBlok
  }
}
