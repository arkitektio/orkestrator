fragment ListAction on Action {
  id
  name
  description
  hash
  kind
  scope
  stateful
  implementations {
    id
    agent {
      id
      name
      active
      connected
    }
  }
  key
  version
  app {
    identifier
  }
  latestTask {
    id
    args
  }
}

# The actions catalog (ActionsPage): ListAction plus what the facets, grouping
# and card chips need. Kept apart from ListAction, which chat, kabinet, reaktion
# and global search all select.
fragment BrowseAction on Action {
  ...ListAction
  definedAt
  isDev
  pinned
  collections {
    id
    name
  }
  protocols {
    id
    name
  }
}

fragment ProvidingImplementation on Implementation {
  id
  interface
  pinned
  agent {
    id
    name
    active
    connected
    blocked
    lastSeen
  }
}

fragment ActionTestCase on TestCase {
  id
  name
  description
  isBenchmark
  tester {
    id
    name
    hash
  }
  results {
    id
    passed
    createdAt
    implementation {
      id
      interface
      agent {
        id
        name
      }
    }
    tester {
      id
      interface
    }
  }
}

# What the action detail page shows around the assign form. Deliberately not
# part of DetailAction: that fragment is the assign payload every assign dialog
# and shortcut form loads.
fragment ActionOverview on Action {
  id
  name
  hash
  key
  version
  kind
  stateful
  pure
  idempotent
  isDev
  pinned
  scope
  definedAt
  app {
    identifier
  }
  protocols {
    id
    name
  }
  collections {
    id
    name
  }
  implementations {
    ...ProvidingImplementation
  }
  testCases {
    ...ActionTestCase
  }
}

fragment SearchAction on Action {
  id
  name
  description
  hash
  kind
  scope
}

fragment GraphNodeAction on Action {
  name
  description
  kind
  hash
  id
  stateful
  collections {
    id
    name
  }
  ...Ports
  protocols {
    name
  }
  app {
    identifier
  }
}

# The assign payload: every assign dialog and shortcut form loads this, so it
# carries what running the action needs. What the action PAGE shows around the
# form lives in ActionOverview.
fragment DetailAction on Action {
  ...GraphNodeAction
  implementations {
    ...MinimalImplementation
  }
  tests {
    id
    name
    description
    runs {
      implementation_id: arg(key: "implementation")
      latestEventKind
    }
  }
  key
  version
  app {
    identifier
  }
  hash
  allowProbe
}

fragment PrimaryAction on Action {
  id
  stateful
  name
  hash
  implementations {
    id
    interface
  }
  args {
    key
    identifier
    kind
    nullable
    default
  }
  description
}

fragment HoverAction on Action {
  id
  name
  description
  kind
  stateful
  app {
    identifier
  }
  implementations(pagination: { limit: 6 }) {
    id
    interface
    agent {
      id
      name
      active
      connected
    }
  }
  tasks(pagination: { limit: 5 }, ordering: { createdAt: DESC }) {
    id
    latestEventKind
    isDone
    createdAt
  }
}
