fragment DetailImplementation on Implementation {
  id
  name
  interface
  execution
  dynamicAsks
  dynamicCalls
  dynamicInforms
  interactions {
    ...ImplementationInteraction
  }
  effects
  codeHash
  needsToken
  provenanceAudience
  params
  higherOrderConfig
  estimatedRuntime {
    ...EstimatedRuntime
  }
  fits {
    ...ImplementationFit
  }
  action {
    ...DetailAction
  }
  agent {
    id
    name
    hardware {
      ...AgentHardware
    }
    active
    connected
    blocked
    kind
    lastSeen
    hash
    app {
      identifier
    }
    client {
      id
    }
  }

  dependencies {
    ...ListDependency
  }
  manipulates {
    id
    interface
    definition {
      name
    }
  }

  resolutions {
    id
    name
    resolvedAt
  }

  higherOrderFor {
    id
    interface
    name
  }

  lowerOrderImplementations {
    id
    interface
    name
  }

  tests {
    id
    interface
    name
  }

  myLatestTask {
    ...PostmanTask
  }
}

fragment ListImplementation on Implementation {
  id
  interface
  execution
  action {
    id
    logo {
      ...BlokLogo
    }
    description
    name
    stateful
    # Whether it brings its own interface for starting a run (a "custom play").
    assignBloks {
      id
    }
  }
  agent {
    name
    active
  }
}

# An implementation offered to run something on: who would run it, whether
# it can take work now, and what it says fits (the "Run on" picker, a pod's
# actions).
fragment RunOnImplementation on Implementation {
  id
  interface
  fits {
    ...ImplementationFit
  }
  action {
    id
    name
  }
  agent {
    id
    name
    kind
    active
    connected
    hardware {
      ...AgentHardware
    }
  }
}

fragment EstimatedRuntime on EstimatedRuntime {
  callJson
  source
  uiCallJson
  uiSource
}

fragment ImplementationFit on ImplementationFit {
  port
  callJson
  source
  compiledPath
}

fragment AgentHardware on AgentHardware {
  cpuCount
  memoryMib
  gpus {
    name
    memoryMib
  }
}

fragment MinimalImplementation on Implementation {
  id
  interface
  # Whether a run of it asks other actions to do things (a workflow): the keys are enough.
  dependencies {
    key
  }
  estimatedRuntime {
    ...EstimatedRuntime
  }
  fits {
    ...ImplementationFit
  }
  agent {
    id
    name
    # With `active`, whether it can take work now: a webhook agent is never connected.
    kind
    active
    hardware {
      ...AgentHardware
    }
  }
}

query ImplementationStats($id: ID!) {
  taskStats(filters: { implementation: $id }) {
    count
  }
}

fragment HoverImplementation on Implementation {
  id
  interface
  execution
  effects
  action {
    id
    name
    description
    kind
    stateful
    app {
      identifier
    }
    args {
      key
      label
      kind
      nullable
      default
    }
  }
  agent {
    id
    name
    active
    connected
  }
}

# A deployer's installer: what the kabinet install dialog needs to name the
# agent in a lok mandate (its app identifier, device and user).
fragment InstallerImplementation on Implementation {
  id
  interface
  action {
    id
    name
    args {
      key
      nullable
    }
  }
  agent {
    id
    name
    active
    connected
    app {
      identifier
    }
    device {
      id
      deviceId
    }
    user {
      sub
    }
  }
}
