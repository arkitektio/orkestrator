fragment DetailImplementation on Implementation {
  id
  name
  interface
  execution
  effects
  codeHash
  pinned
  needsToken
  provenanceAudience
  params
  higherOrderConfig
  action {
    ...DetailAction
  }
  agent {
    id
    name
    active
    connected
    blocked
    kind
    lastSeen
    hash
    app {
      identifier
    }
    client {
      id
    }
  }

  dependencies {
    ...ListDependency
  }
  tracks {
    dependencyKey
    stateKey
    valueKey
    label
    description
  }
  manipulates {
    id
    interface
    definition {
      name
    }
  }

  resolutions {
    id
    name
    resolvedAt
  }

  higherOrderFor {
    id
    interface
    name
  }

  lowerOrderImplementations {
    id
    interface
    name
  }

  tests {
    id
    interface
    name
  }

  myLatestTask {
    ...PostmanTask
  }
}

fragment ListImplementation on Implementation {
  id
  interface
  execution
  action {
    id
    description
    name
    stateful
  }
  agent {
    name
    active
  }
}

fragment MinimalImplementation on Implementation {
  id
  interface
  agent {
    name
  }
}

query ImplementationStats($id: ID!) {
  taskStats(filters: { implementation: $id }) {
    count
  }
}

fragment HoverImplementation on Implementation {
  id
  interface
  pinned
  execution
  effects
  action {
    id
    name
    description
    kind
    stateful
    app {
      identifier
    }
    args {
      key
      label
      kind
      nullable
      default
    }
  }
  agent {
    id
    name
    active
    connected
  }
}

# A deployer's installer: what the kabinet install dialog needs to name the
# agent in a lok mandate (its app identifier, device and user).
fragment InstallerImplementation on Implementation {
  id
  interface
  action {
    id
    name
    args {
      key
      nullable
    }
  }
  agent {
    id
    name
    active
    connected
    app {
      identifier
    }
    device {
      id
      deviceId
    }
    user {
      sub
    }
  }
}
