# --- Blok component tree -----------------------------------------------------
# A blok's tree is fetched as `componentTree`: the whole tree as one JSON value
# in the runtime's own (snake_case) spelling. A selection set cannot recurse,
# and a scene blok (html > Scene > Model > Popout > html ...) nests past any
# fixed number of levels. The typed fragments below remain for custom widgets
# on ports (ports.graphql), whose props are flat.

fragment BlokAgentCallLeaf on AgentCall {
  dependency
  operation
  arguments {
    ...PortCallLeafArgument
  }
}

fragment BlokArgumentInner on ActionArgument {
  ...PortCallInnerArgument
  agentCall {
    ...BlokAgentCallLeaf
  }
}

fragment BlokArgument on ActionArgument {
  ...PortCallLeafArgument
  utilCall {
    operation
    arguments {
      ...BlokArgumentInner
    }
  }
  agentCall {
    dependency
    operation
    arguments {
      ...BlokArgumentInner
    }
  }
  valueList {
    ...BlokArgumentInner
  }
  valueDict {
    ...BlokArgumentInner
  }
}

fragment BlokComponentProp on ComponentProp {
  key
  staticValue
  declaresValue
  dynamicValue {
    path
    literal
  }
  agentCall {
    dependency
    operation
    arguments {
      ...BlokArgument
    }
  }
  utilCall {
    operation
    arguments {
      ...BlokArgument
    }
  }
}

fragment BlokDiagnostic on Diagnostic {
  level
  code
  message
  path
}

fragment Blok on Blok {
  id
  name
  description
  origin
  originHash
  # An app's agents provide it (it follows their registrations): forked, never edited.
  provided
  app {
    id
    identifier
  }
  providers {
    id
    name
    connected
  }
  materializedBloks {
    ...ListMaterializedBlok
  }
  dependencies {
    id
    key
    description
  }
  catalog {
    id
    name
    description
    isRegistered
  }
  context
  forModel
  forNode
  componentTree
  demoState
  # What it is opened for (`@args.<key>`): asked for with a port form when missing.
  args {
    ...ArgPort
  }
  diagnostics {
    ...BlokDiagnostic
  }
}

fragment MaterializedBlok on MaterializedBlok {
  id
  name
  isDefault
  createdAt
  # The agent this materialization belongs to, for a blok its app provides.
  declaredBy {
    id
    name
    connected
  }
  blok {
    ...Blok
  }
  agentMappings {
    key
    agent {
      id
      name
      connected
    }
  }
}

# A card draws the blok's preview, kept under its hash (core/blok/preview).
fragment ListBlok on Blok {
  id
  name
  description
  context
  hash
  provided
  # Installed from a repository (kabinet's RepoBlok.origin), and what it drew then.
  origin
  originHash
  app {
    id
    identifier
  }
}

fragment ListMaterializedBlok on MaterializedBlok {
  id
  name
  description
  isDefault
  updatedAt
  declaredBy {
    id
    name
  }
  blok {
    id
    name
    description
    context
    hash
  }
  agentMappings {
    key
    agent {
      id
      name
      connected
    }
  }
}

# A row of "Open in…": a blok an item opens in, with the args the item is bound to.
fragment OpenableBlok on MaterializedBlok {
  id
  name
  description
  declaredBy {
    id
    name
    connected
  }
  blok {
    id
    name
    description
    args {
      key
      identifier
      kind
      nullable
    }
  }
}
