# --- Blok component tree -----------------------------------------------------
# A blok's tree is fetched as `componentTree`: the whole tree as one JSON value
# in the runtime's own (snake_case) spelling. A selection set cannot recurse,
# and a scene blok (html > Scene > Model > Popout > html ...) nests past any
# fixed number of levels. The typed fragments below remain for custom widgets
# on ports (ports.graphql), whose props are flat.

fragment BlokAgentCallLeaf on AgentCall {
  dependency
  operation
  arguments {
    ...PortCallLeafArgument
  }
}

fragment BlokArgumentInner on ActionArgument {
  ...PortCallInnerArgument
  agentCall {
    ...BlokAgentCallLeaf
  }
}

fragment BlokArgument on ActionArgument {
  ...PortCallLeafArgument
  utilCall {
    operation
    arguments {
      ...BlokArgumentInner
    }
  }
  agentCall {
    dependency
    operation
    arguments {
      ...BlokArgumentInner
    }
  }
  valueList {
    ...BlokArgumentInner
  }
  valueDict {
    ...BlokArgumentInner
  }
}

fragment BlokComponentProp on ComponentProp {
  key
  staticValue
  declaresValue
  dynamicValue {
    path
    literal
  }
  agentCall {
    dependency
    operation
    arguments {
      ...BlokArgument
    }
  }
  utilCall {
    operation
    arguments {
      ...BlokArgument
    }
  }
}

fragment BlokDiagnostic on Diagnostic {
  level
  code
  message
  path
}

fragment Blok on Blok {
  id
  name
  description
  origin
  originHash
  # An app's agents provide it (it follows their registrations): forked, never edited.
  provided
  # The revision a custom blok is at; null for a provided one.
  head {
    id
    number
  }
  app {
    id
    identifier
  }
  providers {
    id
    name
    connected
  }
  materializedBloks {
    ...ListMaterializedBlok
  }
  dependencies {
    id
    key
    description
  }
  catalog {
    id
    name
    description
    isRegistered
  }
  context
  forModel
  forNode
  componentTree
  demoState
  # What it is opened for (`@args.<key>`): asked for with a port form when missing.
  args {
    ...ArgPort
  }
  # What a person answers through it when a task asks with it (`blok.return`).
  returns {
    ...ReturnPort
  }
  # The services its `query` components read: guarded around it, named for the person.
  services {
    key
    service
    version
    schemaHash
  }
  diagnostics {
    ...BlokDiagnostic
  }
}

fragment MaterializedBlok on MaterializedBlok {
  id
  name
  isDefault
  createdAt
  # The agent this materialization belongs to, for a blok its app provides.
  declaredBy {
    id
    name
    connected
  }
  blok {
    ...Blok
    # Keys its kept preview (core/blok/preview): an embed off screen shows that.
    hash
  }
  # What it shows: the pinned revision, else its blok's head (null for a provided blok).
  revision {
    id
    number
    componentTree
    demoState
  }
  pinnedRevision {
    id
    number
  }
  # Required dependencies of the revision shown that no agent is bound to here.
  unboundDependencies
  # What it is opened on, when the task that showed it set that (`@args.<key>`).
  args
  # Why a task showed it (ASK / INFORM); null for any other materialization.
  taskRole
  agentMappings {
    key
    agent {
      id
      name
      connected
    }
  }
}

# A card draws the blok's preview, kept under its hash (core/blok/preview).
fragment ListBlok on Blok {
  id
  name
  description
  context
  hash
  provided
  # Installed from a repository (kabinet's RepoBlok.origin), and what it drew then.
  origin
  originHash
  app {
    id
    identifier
  }
}

fragment ListMaterializedBlok on MaterializedBlok {
  id
  name
  description
  isDefault
  updatedAt
  declaredBy {
    id
    name
  }
  blok {
    id
    name
    description
    context
    hash
  }
  agentMappings {
    key
    agent {
      id
      name
      connected
    }
  }
}

# A row of "Open in…": a blok an item opens in, with the args the item is bound to.
fragment OpenableBlok on MaterializedBlok {
  id
  name
  description
  declaredBy {
    id
    name
    connected
  }
  blok {
    id
    name
    description
    args {
      key
      identifier
      kind
      nullable
    }
  }
}

# --- Blok editor ---------------------------------------------------------------
# Everything the BSX editor writes back. `dependencies` replaces a blok's whole
# set on update, so a dependency is read in full: its demands are sent again as
# they came. A port match nests; three levels are read, and the fourth only
# says whether there is one (then the demand cannot be sent back whole).

fragment BlokEditorPortMatchLeaf on PortMatch {
  at
  key
  kind
  identifier
  nullable
  dimension
}

fragment BlokEditorPortMatch on PortMatch {
  ...BlokEditorPortMatchLeaf
  children {
    ...BlokEditorPortMatchLeaf
    children {
      ...BlokEditorPortMatchLeaf
      children {
        key
      }
    }
  }
}

fragment BlokEditorActionDependency on ActionDependency {
  key
  description
  optional
  demand {
    app
    argMatches {
      ...BlokEditorPortMatch
    }
    forceArgLength
    forceReturnLength
    hash
    idempotent
    key
    name
    protocols
    pure
    returnMatches {
      ...BlokEditorPortMatch
    }
    stateful
    version
  }
}

fragment BlokEditorStateDependency on StateDependency {
  key
  description
  optional
  demand {
    app
    hash
    key
    matches {
      ...BlokEditorPortMatch
    }
    protocols
  }
}

fragment BlokEditorDependency on BlokDependency {
  id
  key
  description
  appFilter
  versionFilter
  optional
  autoResolvable
  minViableInstances
  maxViableInstances
  actionDependencies {
    ...BlokEditorActionDependency
  }
  stateDependencies {
    ...BlokEditorStateDependency
  }
}

fragment BlokEditor on Blok {
  id
  name
  description
  context
  provided
  # What a save names as its `base`: refused once someone saved on top of it.
  head {
    id
    number
  }
  componentTree
  demoState
  args {
    ...ArgPort
  }
  dependencies {
    ...BlokEditorDependency
  }
}

# --- Revisions -------------------------------------------------------------------

# A row of a blok's history.
fragment BlokRevisionListItem on BlokRevision {
  id
  number
  message
  createdAt
  hash
  author {
    sub
  }
  task {
    id
  }
  parent {
    id
  }
}

# A blok a task showed a person: an ask (waiting, answered, dismissed, gone) or an inform.
fragment TaskBlok on TaskBlok {
  role
  status
  message
  values
  decidedBy
  createdAt
  materializedBlok {
    ...MaterializedBlok
  }
}
