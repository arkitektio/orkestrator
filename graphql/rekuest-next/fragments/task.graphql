fragment PostmanTask on Task {
  id
  policy
  latestEventKind
  latestProgress
  latestMessage
  latestReturns
  args
  reference
  isDone
  events(ordering: {createdAt: DESC}) {
    ...TaskEvent
  }
  action {
    hash
    id
    name
    ...Ports
  }
  dependencyMethod
  dependency
  dependencies
  implementation {
    id
    interface
    higherOrderFor {
      id
      action {
        id
        key
      }
    }
  }
  createdAt
  finishedAt
}

# Slim shape for the global "my tasks" list and its per-task hydration
# (`query MyTasks`, `query Task`). Every live task is watched by many cards
# (`useLiveTask`) and re-diffed on every event, so this deliberately omits the
# `...Ports` subtree (widgets/effects/validators, ~400 lines) that `PostmanTask`
# carries — `useFilteredTasks` only needs `args { key kind identifier }` for
# identifier/object matching. Detail views keep using `PostmanTask`.
#
# What it shows comes from `latestProgress` / `latestMessage` / `latestReturns`
# (kept by the server as events are recorded, and by `writeTaskEventToCache`
# as they stream in). Only the newest 25 events: this list lives for the whole session and every
# event is prepended to it (`writeTaskEventToCache` caps this variant to the
# same window). The paginated field is a separate cache entry from
# `PostmanTask`'s full history, so detail views keep every event.
fragment LiveTask on Task {
  id
  latestEventKind
  latestProgress
  latestMessage
  latestReturns
  args
  reference
  isDone
  events(ordering: {createdAt: DESC}, pagination: {limit: 25}) {
    ...TaskEvent
  }
  action {
    hash
    id
    name
    args {
      key
      kind
      identifier
    }
  }
  dependencyMethod
  dependency
  dependencies
  implementation {
    id
    interface
    higherOrderFor {
      id
      action {
        id
        key
      }
    }
  }
  createdAt
  finishedAt
}

fragment MinimalTask on Task {
  id
  reference
  latestEventKind
  isDone
  createdAt
  action {
    id
    name
  }
  implementation {
    id
    interface
    agent {
      name
    }
  }
}

fragment NoChildrenDetailTask on Task {
  ...PostmanTask
  parent {
    id
  }
  finishedAt
  implementation {
    agent {
      client {
        clientId
        device {
          deviceId
        }
      }

    name
    }
  }
}

fragment DetailTask on Task {
  ...PostmanTask
  # what started it, when nobody did by hand: a schedule, or a trigger
  schedule {
    id
    name
  }
  trigger {
    id
    name
  }
  signal {
    id
    identifier
    object
    kind
  }
  children {
    ...PostmanTask
    parentStep
    callKey
  }
  parent {
    id
  }
  root {
    id
  }
  # what the info rail shows: who asked for it, where, and how
  caller {
    id
    user {
      sub
    }
    client {
      clientId
    }
  }
  space {
    id
    name
  }
  resolution {
    id
    name
  }
  heldLocks {
    id
    key
  }
  capture
  notBefore
  finishedAt
  implementation {
    execution
    effects
    agent {
      id
      client {
        clientId
        device {
          deviceId
        }
      }

    name
    placements(pagination: { limit: 1 }, ordering: { createdAt: DESC }) {
        ...AgentPlacement
    }
    }
    dependencies {
      id
      key
      appFilter
      versionFilter
      autoResolvable
      actionDependencies {
        key
      }
    }
  }
  resolvedDependencies {

    key
    values
    mappedAgents {
      agent {
        id
        name
        placements(pagination: { limit: 1 }, ordering: { createdAt: DESC }) {
            ...AgentPlacement
        }

      }

      mappedImplementations {
        key
        implementation {
          id
        }
        # The levels below, for a rerun to pin the whole tree again.
        resolvedDependencies {
          ...FrozenBinding
          mappedAgents {
            mappedImplementations {
              key
              resolvedDependencies {
                ...FrozenBinding
                mappedAgents {
                  mappedImplementations {
                    key
                    resolvedDependencies {
                      ...FrozenBinding
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment TaskEvent on TaskEvent {
  id
  kind
  level
  returns
  task {
    id
    reference
  }
  progress
  reference
  createdAt
  message
  step
  agentTs
  effect
  key
  value
  delegatedTo {
    id
    action {
      name
    }
    implementation {
      id
      interface
      action {
        name
      }
    }
  }
}
# Non-traversable subscription delta types. Relations are scalar IDs; the client
# hydrates the immutable graph (action/implementation/agent/children) once via
# query (see `query Task`) and merges hot scalars + events into the normalized
# cache. See TaskUpdater.tsx / ChildTaskUpdater.tsx.
fragment TaskChange on TaskChange {
  id
  reference
  isDone
  latestEventKind
  latestInstructKind
  action
  implementation
  agent
  root
  parent
  createdAt
  updatedAt
  finishedAt
}

fragment TaskEventChange on TaskEventChange {
  id
  task
  kind
  message
  progress
  returns
  value
  createdAt
}

fragment TaskChangeEvent on TaskChangeEvent {
  create {
    ...TaskChange
  }
  event {
    ...TaskEventChange
  }
}
fragment ChildTaskEvent on ChildTaskEvent {
  create {
    ...TaskChange
  }
  update {
    ...TaskChange
  }
}

# List/card shape. `agent` and the newest few `events` let a card say who is
# running the task and how far along it is; `OrgTasksUpdater` prepends live
# events onto the same `events` field, so progress moves without a refetch.
fragment ListTask on Task {
  id
  reference
  latestEventKind
  isDone
  finishedAt
  createdAt
  action {
    id
    name
  }
  implementation {
    id
    interface
  }
  agent {
    id
    name
  }
  events(pagination: { limit: 3 }, ordering: { createdAt: DESC }) {
    id
    kind
    progress
    message
    createdAt
  }
}

fragment HoverTask on Task {
  id
  reference
  latestEventKind
  isDone
  createdAt
  finishedAt
  action {
    id
    name
  }
  implementation {
    id
    interface
    agent {
      id
      name
    }
  }
  events(pagination: { limit: 5 }) {
    id
    kind
    progress
    message
    createdAt
  }
}
