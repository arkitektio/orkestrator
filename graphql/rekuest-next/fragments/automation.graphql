# Schedules ("cron jobs"), triggers (signal → action) and the signals
# services send. A run of either is an ordinary Task.

fragment ListSchedule on Schedule {
  id
  name
  enabled
  cron
  intervalSeconds
  timezone
  consecutiveFailures
  lastError
  action {
    id
    name
  }
  agent {
    id
    name
  }
  nextRun {
    id
    notBefore
    latestEventKind
    isDone
  }
  description
  runCount
  lastRunAt
  lastErrorAt
  exhausted
  endsAt
  maxRuns
}

fragment DetailSchedule on Schedule {
  ...ListSchedule
  args
  interface
  ephemeralRuns
  overlap
  catchUp
  lastFiredAt
  # what its timing says comes next; a paused or ended schedule runs none
  upcoming(count: 5)
  wireKey
  wiregram {
    id
    name
  }
  createdAt
  updatedAt
  caller {
    id
    user {
      id
      sub
    }
  }
  runs(limit: 24) {
    ...ListTask
  }
}

fragment ListTrigger on Trigger {
  id
  name
  enabled
  identifier
  kind
  port
  conditions
  consecutiveFailures
  lastError
  action {
    id
    name
  }
  agent {
    id
    name
  }
  description
  runCount
  lastRunAt
  lastErrorAt
  exhausted
  endsAt
  maxRuns
  debounceSeconds
}

fragment DetailTrigger on Trigger {
  ...ListTrigger
  args
  interface
  lastFiredAt
  createdAt
  updatedAt
  caller {
    id
    user {
      id
      sub
    }
  }
  wireKey
  wiregram {
    id
    name
  }
  # what became of it for each signal it listened for: fired, rejected or failed
  firings(limit: 24) {
    ...ListFiring
  }
}

fragment ListSignal on Signal {
  id
  identifier
  kind
  object
  serviceName
  # null when the hub no longer catalogues the sender
  service {
    id
    name
  }
  descriptors
  occurredAt
  receivedAt
  processedAt
  causingTask {
    id
    action {
      id
      name
    }
  }
  runs {
    id
    action {
      id
      name
    }
    trigger {
      id
      name
    }
  }
}

fragment SignalDeclaration on SignalDeclaration {
  id
  identifier
  kind
  service {
    id
    name
  }
  description
  descriptorKeys
}

# One trigger meeting one signal: it fired a run, the signal was rejected
# (conditions, debounce, limits), or creating the run failed.
fragment ListFiring on Firing {
  id
  outcome
  reason
  replay
  createdAt
  trigger {
    id
    name
  }
  signal {
    id
    identifier
    object
    kind
    occurredAt
    receivedAt
  }
  task {
    ...ListTask
  }
}

fragment DetailSignal on Signal {
  ...ListSignal
  firings {
    ...ListFiring
  }
}

# A set of rules imported from one document.
fragment ListWiregram on Wiregram {
  id
  key
  name
  description
  updatedAt
}

fragment DetailWiregram on Wiregram {
  ...ListWiregram
  document
  createdAt
  caller {
    id
    user {
      id
      sub
    }
  }
  schedules {
    ...ListSchedule
  }
  triggers {
    ...ListTrigger
  }
}

# A service of the hub. The list counts what it declares; the page shows it.
fragment ListService on Service {
  id
  name
  identifier
  description
  signals {
    id
  }
  structures {
    id: identifier
  }
}

# What a service declares: the signals it sends (with your triggers waiting
# for each) and the structures it hosts, each with its objects' descriptors.
fragment DetailService on Service {
  id
  name
  identifier
  description
  signals {
    ...SignalDeclaration
    triggers {
      id
      name
    }
  }
  structures {
    id: identifier
    identifier
    label
    description
    descriptors {
      id
      key
      type
      description
    }
  }
}

fragment DetailFiring on Firing {
  ...ListFiring
  trigger {
    id
    name
    action {
      id
      name
    }
  }
  signal {
    id
    serviceName
    descriptors
  }
}

# What the rule subscriptions carry: the fields that move while a rule runs.
fragment RuleChange on RuleChange {
  id
  name
  enabled
  consecutiveFailures
  lastError
  runCount
  lastFiredAt
  updatedAt
}

fragment SignalChange on SignalChange {
  id
  service
  kind
  identifier
  object
  receivedAt
  processedAt
  fired
}
