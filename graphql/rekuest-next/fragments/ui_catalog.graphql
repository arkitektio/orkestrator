# Modules: what a UI app (this client) renders beyond the spec's catalogs
# (`components`) and evaluates (`operations`), with the standard catalogs it
# implements in full (`catalogs`). The client registers its own module on
# startup (`rekuest/catalog/ModuleRegistrar.tsx`); the server validates bloks
# and definitions that name it against this.

fragment CatalogProp on CatalogProp {
  key
  kind
  required
  description
}

fragment CatalogArgument on CatalogArgument {
  key
  kind
  required
  description
}

fragment CatalogComponent on CatalogComponent {
  name
  description
  acceptsChildren
  context
  childrenContext
  downstreamOf
  notDownstreamOf
  props {
    ...CatalogProp
  }
}

fragment CatalogOperation on CatalogOperation {
  name
  description
  returns
  arguments {
    ...CatalogArgument
  }
}

fragment Module on Module {
  id
  name
  description
  isRegistered
  catalogs
  components {
    ...CatalogComponent
  }
  operations {
    ...CatalogOperation
  }
}

fragment ListModule on Module {
  id
  name
  isRegistered
}
