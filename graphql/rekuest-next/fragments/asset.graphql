# Assets: the files an agent brings, stored once per organization under the SHA-256
# of their exact bytes. `file` is the media store the bytes are read from.

fragment StoredAsset on Asset {
  id
  ref
  kind
  size
  nodes
  stats {
    nodes
    triangles
    textures
    animations
  }
  width
  height
  # A MODEL_3D asset is a kulisse store (one self-contained .glb, read by the
  # server at finish), an IMAGE a media store.
  file {
    ... on KulisseStore {
      id
      key
      bucket
    }
    ... on MediaStore {
      id
      key
      bucket
    }
  }
}

# A file under the name its agent's bloks call it by; `asset` is null until it was uploaded:
# by the agent, or, for a file the agent only names a `source` for, by an admin.
fragment AgentAsset on AgentAsset {
  id
  name
  kind
  ref
  size
  source
  asset {
    ...StoredAsset
  }
}

fragment ModelPolicy on ModelPolicy {
  maxSize
  maxJson
  maxNodes
  maxTriangles
  maxTextureSize
  maxTextureMemory
  maxAnimations
  extensions
}

fragment ModelBlok on Blok {
  id
  name
  description
  forNode
  materializedBloks {
    ...ListMaterializedBlok
  }
}
