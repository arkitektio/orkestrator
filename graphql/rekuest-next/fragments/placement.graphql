fragment Placement on Placement {
  id
  name
  agent {
    id
  }
  affineMatrix
}

# Where someone left an agent in a room: kept per agent, the same for everyone;
# `role` is the dependency key it was placed under.
fragment SpacePlacement on Placement {
  id
  name
  role
  agent {
    id
    name
    connected
  }
  affineMatrix
}

fragment AgentPlacement on Placement {
  id
  name
  space {
    id
    name
  }


  affineMatrix
}


fragment ListPlacement on Placement {
  id
  name
  affineMatrix
}
