fragment Placement on Placement {
  id
  name
  model {
    id
    file {
      ...MediaStore

    }
    transferFunction
  }

  agent {
    id
  }
  affineMatrix
}

# A placement as a space shows it: the 3D view (a materialized scene blok) that
# stands in the room, the agent it belongs to, and where it stands.
fragment SpacePlacement on Placement {
  id
  name
  role
  agent {
    id
    name
    connected
  }
  blok {
    id
    name
    blok {
      id
      name
      context
    }
  }
  affineMatrix
}

fragment AgentPlacement on Placement {
  id
  name
  model {
    id
    file {
      ...MediaStore

    }

    transferFunction
  }
  space {
    id
    name
  }


  affineMatrix
}


fragment ListPlacement on Placement {
  id
  name
  affineMatrix
}
