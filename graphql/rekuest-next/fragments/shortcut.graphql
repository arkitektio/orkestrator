fragment Shortcut on Shortcut {
  id
  name
  description
  action {
    ...DetailAction
  }
  bindNumber
  savedArgs
  args {
    ...ArgPort
  }
  returns {
    ...ReturnPort
  }
  allowQuick
  pinned
  bindings {
    ...ShortcutBinding
  }
}

fragment ShortcutBinding on ShortcutBinding {
  id
  app
  client
  device
  createdAt
  user {
    id
    sub
  }
  boundBy {
    id
    sub
  }
}

fragment ListShortcut on Shortcut {
  id
  name
  description
  action {
    id
    assignable
    logo {
      ...BlokLogo
    }
  }
  bindNumber
  savedArgs
  args {
    ...ArgPort
  }
  returns {
    ...ReturnPort
  }
  allowQuick
  pinned
}

# Read from the cache by the smart menu's pins: a row's own `pinned`, no query of its own.
fragment ShortcutPin on Shortcut {
  id
  pinned
}
