fragment Shortcut on Shortcut {
  id
  name
  description
  action {
    ...DetailAction
  }
  # The pin, when it has one: every run goes to this agent's implementation.
  interface
  agent {
    id
    name
    kind
    active
  }
  bindNumber
  savedArgs
  args {
    ...ArgPort
  }
  returns {
    ...ReturnPort
  }
  allowQuick
  pinned
  bindings {
    ...ShortcutBinding
  }
}

fragment ShortcutBinding on ShortcutBinding {
  id
  app
  client
  device
  createdAt
  user {
    id
    sub
  }
  boundBy {
    id
    sub
  }
}

fragment ListShortcut on Shortcut {
  id
  name
  description
  action {
    id
    assignable
    # Where a run of it may go: a stateful action runs on the one agent that can take it.
    stateful
    implementations {
      id
      interface
      agent {
        id
        kind
        active
      }
    }
    logo {
      ...BlokLogo
    }
  }
  # The pin, when it has one: every run goes to this agent's implementation.
  interface
  agent {
    id
    name
    kind
    active
  }
  bindNumber
  savedArgs
  args {
    ...ArgPort
  }
  returns {
    ...ReturnPort
  }
  allowQuick
  pinned
}

# Read from the cache by the smart menu's pins: a row's own `pinned`, no query of its own.
fragment ShortcutPin on Shortcut {
  id
  pinned
}
