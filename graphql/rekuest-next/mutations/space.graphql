# Keep where an agent stands in the room an action's Space blok names, for everyone:
# the first pose kept makes the space.
mutation SavePlacement($input: SavePlacementInput!) {
  savePlacement(input: $input) {
    ...SpacePlacement
  }
}

# Forget where an agent was left, so the Space blok's `Placed` decides again.
mutation ResetPlacement($input: ResetPlacementInput!) {
  resetPlacement(input: $input)
}
