mutation CreateSchedule($input: CreateScheduleInput!) {
  createSchedule(input: $input) {
    ...DetailSchedule
  }
}

mutation UpdateSchedule($input: UpdateScheduleInput!) {
  updateSchedule(input: $input) {
    ...DetailSchedule
  }
}

mutation DeleteSchedule($id: ID!) {
  deleteSchedule(input: { id: $id })
}

mutation TriggerSchedule($id: ID!) {
  triggerSchedule(input: { id: $id }) {
    ...ListTask
  }
}

mutation CreateTrigger($input: CreateTriggerInput!) {
  createTrigger(input: $input) {
    ...DetailTrigger
  }
}

mutation UpdateTrigger($input: UpdateTriggerInput!) {
  updateTrigger(input: $input) {
    ...DetailTrigger
  }
}

mutation DeleteTrigger($id: ID!) {
  deleteTrigger(input: { id: $id })
}

# Run a trigger on a stored signal by hand: a replay.
mutation FireTrigger($input: FireTriggerInput!) {
  fireTrigger(input: $input) {
    ...ListFiring
  }
}

mutation ImportWiregram($input: WiregramInput!) {
  importWiregram(input: $input) {
    ...DetailWiregram
  }
}

# Existing rules as a document, importable elsewhere.
mutation ExportWiregram($input: ExportWiregramInput!) {
  exportWiregram(input: $input)
}

mutation DeleteWiregram($id: ID!) {
  deleteWiregram(input: { id: $id })
}
