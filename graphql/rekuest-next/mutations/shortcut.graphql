mutation CreateShortcut($input: CreateShortcutInput!) {
  createShortcut(input: $input) {
    ...Shortcut
  }
}

mutation DeleteShortcut($id: ID!) {
  deleteShortcut(input: { id: $id })
}

mutation BindShortcut($input: BindShortcutInput!) {
  bindShortcut(input: $input) {
    ...Shortcut
  }
}

mutation UnbindShortcut($id: ID!) {
  unbindShortcut(input: { id: $id })
}
