query ListSchedules(
  $filters: ScheduleFilter
  $ordering: [ScheduleOrder!] = []
  $pagination: OffsetPaginationInput
) {
  schedules(filters: $filters, ordering: $ordering, pagination: $pagination) {
    ...ListSchedule
  }
}

query Schedule($id: ID!) {
  schedule(id: $id) {
    ...DetailSchedule
  }
}

