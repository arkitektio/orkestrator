# A dry run of a rule being built: the stored signals it would have fired on.
query MatchingSignals(
  $kind: SignalKind!
  $identifier: String!
  $conditions: AnyDefault
  $limit: Int! = 20
) {
  matchingSignals(
    kind: $kind
    identifier: $identifier
    conditions: $conditions
    limit: $limit
  ) {
    id
  }
}

# The stored signals a saved trigger would fire on as it is now.
query TriggerMatchingSignals($id: ID!) {
  trigger(id: $id) {
    id
    matchingSignals(limit: 20) {
      ...ListSignal
    }
  }
}

query SignalDeclarations($identifier: String) {
  signalDeclarations(identifier: $identifier) {
    ...SignalDeclaration
  }
}

# Any action, for the "New schedule" picker.
query ScheduleActionOptions($search: String, $values: [ID!]) {
  options: actions(
    filters: { search: $search, ids: $values }
    pagination: { limit: 30 }
  ) {
    value: id
    label: name
    description
  }
}

# Actions with a STRUCTURE argument of this identifier: what a trigger on
# that structure's signals can run.
query TriggerActionOptions(
  $identifier: String!
  $search: String
  $values: [ID!]
) {
  options: actions(
    filters: {
      search: $search
      ids: $values
      demands: [
        { kind: ARGS, matches: [{ kind: STRUCTURE, identifier: $identifier }] }
      ]
    }
    pagination: { limit: 30 }
  ) {
    value: id
    label: name
    description
  }
}

# Where a schedule or trigger can be pinned: every app implementing the action.
query AutomationPinOptions($action: ID!) {
  implementations(
    filters: { action: { ids: [$action] } }
    pagination: { limit: 50 }
  ) {
    id
    interface
    agent {
      id
      name
      connected
    }
  }
}
