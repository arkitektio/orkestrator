query ConstantAction($id: ID!) {
  action(id: $id) {
    ...GraphNodeAction
  }
}

# Existence/id probe only (useHashActionWithProgress): no ports.
query ActionIdByHash($hash: ActionHash!) {
  action(hash: $hash) {
    id
    # Where a run of it may go: a stateful action runs on the one agent that can take it.
    stateful
    implementations {
      id
      agent {
        id
        kind
        active
      }
    }
  }
}

# Whether an action keeps state, by hash: a deployed Python flow declares its stateful steps.
query ActionStatefulByHash($hash: ActionHash!) {
  action(hash: $hash) {
    id
    name
    hash
    stateful
  }
}

query AllActions(
  $pagination: OffsetPaginationInput
  $filters: ActionFilter
  $ordering: [ActionOrder!]
) {
  actions(ordering: $ordering, pagination: $pagination, filters: $filters) {
    ...ListAction
  }
}

# The actions a chat replies with. `latestTask` (one lookup per row on the
# server) is asked only here: a reply starts from the args it last ran with.
# Its implementations say which app answers and where (agent, device): the
# picker offers each one.
query ReplyerActions($filters: ActionFilter, $pagination: OffsetPaginationInput) {
  actions(filters: $filters, pagination: $pagination) {
    ...ListAction
    latestTask {
      id
      args
    }
    implementations {
      ...ReplyerImplementation
    }
  }
}

query BrowseActions(
  $pagination: OffsetPaginationInput
  $filters: ActionFilter
  $ordering: [ActionOrder!]
) {
  actions(ordering: $ordering, pagination: $pagination, filters: $filters) {
    ...BrowseAction
  }
}

query ActionOverview($id: ID!) {
  action(id: $id) {
    ...ActionOverview
  }
}

# Hash only (copy-hash local action when the structure carries no hash).
query ActionHash($id: ID!) {
  action(id: $id) {
    id
    hash
  }
}

query AllPrimaryActions(
  $pagination: OffsetPaginationInput
  $filters: ActionFilter
  $ordering: [ActionOrder!]
) {
  actions(ordering: $ordering, pagination: $pagination, filters: $filters) {
    ...PrimaryAction
  }
}

query DetailAction($id: ID!) {
  action(id: $id) {
    ...DetailAction
  }
}

query HoverAction($id: ID!) {
  action(id: $id) {
    ...HoverAction
  }
}

# Nearest neighbours by embedding, for the "Similar actions" section of the
# action page. Its own query so DetailAction / ActionOverview stay as they are.
query SimilarActions($id: ID!, $limit: Int!) {
  similarActions(action: $id, limit: $limit) {
    ...ListAction
  }
}

# An action's signature by hash: what a caller (a Python flow's manifest)
# checks its calls against.
query ActionSignatureByHash($hash: ActionHash!) {
  action(hash: $hash) {
    id
    name
    description
    hash
    kind
    key
    version
    app {
      identifier
    }
    ...Ports
  }
}
