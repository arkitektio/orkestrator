query MaterializedBlok($id: ID!) {
  materializedBlok(id: $id) {
    ...MaterializedBlok
  }
}

query ListMaterializedBloks($filters: MaterializedBlokFilter, $pagination: OffsetPaginationInput, $ordering: [MaterializedBlokOrder!]) {
  materializedBloks(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListMaterializedBlok
  }
}

# The bloks an item opens in: `filters.demands` matched against each blok's args.
query OpenableBloks($filters: MaterializedBlokFilter, $pagination: OffsetPaginationInput) {
  materializedBloks(filters: $filters, pagination: $pagination) {
    ...OpenableBlok
  }
}
