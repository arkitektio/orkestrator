query GetBlok($id: ID!) {
  blok(id: $id) {
    ...Blok
  }
}

query ListBloks($filters: BlokFilter, $pagination: OffsetPaginationInput) {
  bloks(filters: $filters, pagination: $pagination) {
    ...ListBlok
  }
}

# A logo blok's drawing, fetched only when no rendering of its hash is cached.
query LogoBlok($id: ID!) {
  blok(id: $id) {
    id
    hash
    componentTree
    vocab
    catalogs
    resolvedLocals {
      ...ResolvedBlokLocal
    }
    demo {
      deps
      args
      task
      queries
      subscriptions
    }
    queries {
      key
      service
      document
      variables {
        ...BlokArgument
      }
      poll
      more
    }
    subscriptions {
      key
      service
      document
      variables {
        ...BlokArgument
      }
      keep
      history
    }
  }
}

# What the BSX editor opens: the tree it prints back as source, and all a save sends again.
query BlokEditor($id: ID!) {
  blok(id: $id) {
    ...BlokEditor
  }
}

# A custom blok's history, newest first; the head is what a restore names as `base`.
query BlokRevisions($id: ID!, $limit: Int!, $offset: Int!) {
  blok(id: $id) {
    id
    provided
    head {
      id
      number
    }
    revisions(limit: $limit, offset: $offset) {
      ...BlokRevisionListItem
    }
  }
}
