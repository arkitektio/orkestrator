# Ranking is server-side: substring matches first, then semantic similarity
# of the term to name + description. Do not add an `ordering` here — an
# explicit ordering replaces that ranking.
query GlobalSearch(
  $search: String
  $noActions: Boolean!
  $noAgents: Boolean!
  $pagination: OffsetPaginationInput
) {
  actions: actions(filters: { search: $search }, pagination: $pagination)
    @skip(if: $noActions) {
    ...ListAction
  }
  agents: agents(filters: { search: $search }, pagination: $pagination)
    @skip(if: $noAgents) {
    ...SearchAgent
  }
}
