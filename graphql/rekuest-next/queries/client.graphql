query Clients(
  $pagination: OffsetPaginationInput
  $filters: ClientFilter
  $ordering: [ClientOrder!]
) {
  clients(ordering: $ordering, pagination: $pagination, filters: $filters) {
    ...ListClient
  }
}

# The clients that called rekuest, for a shortcut binding's app, client and
# device pickers: the only ones a binding can match today. `search` matches
# the client id, app identifier, version and device id on the server.
query BindingClients($search: String, $pagination: OffsetPaginationInput) {
  clients(filters: { search: $search }, pagination: $pagination) {
    id
    clientId
    release {
      id
      version
      app {
        id
        identifier
      }
    }
    device {
      id
      deviceId
    }
  }
}
