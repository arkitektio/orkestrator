query Agents(
  $pagination: OffsetPaginationInput
  $filters: AgentFilter
  $ordering: [AgentOrder!]
) {
  agents(ordering: $ordering, pagination: $pagination, filters: $filters) {
    ...ListAgent
  }
}

# The home page's "N online · M total": both counted by the server over the same
# filters, so they are right however many agents there are.
query AgentCounts($filters: AgentFilter, $online: AgentFilter) {
  total: agentStats(filters: $filters) {
    count
  }
  online: agentStats(filters: $online) {
    count
  }
}

query Agent($id: ID!) {
  agent(id: $id) {
    ...Agent
  }
}

# Single-agent hydration for the non-traversable subscription `create` path:
# fetches the list-shaped agent to populate the Agents list cache. See AgentUpdater.
query HydrateAgent($id: ID!) {
  agent(id: $id) {
    ...ListAgent
  }
}

query AgentForProtocol($id: ID!) {
  agent(id: $id) {
    ...ProtocolAgent
  }
}


# The @rekuest/agent picker. `$requires` is a port's descriptor constraints, handed on
# unchanged (the only descriptor of an agent is @rekuest/supervisor).
query AgentOptions($search: String, $values: [ID!], $dependency: ID, $requires: [RequiresInput!]) {
  options: agents(
    filters: { search: $search, ids: $values, dependency: $dependency, requires: $requires }
    pagination: { limit: 10 }
  ) {
    value: id
    label: name
  }
}


query AgentForDependency($search: String, $values: [ID!], $dependency: ID, $blokDependency: ID) {
  agents: agents(
    filters: { search: $search, ids: $values, dependency: $dependency, blokDependency: $blokDependency }
    pagination: { limit: 10 }
  ) {
   ...ListAgent
  }
}

query HoverAgent($id: ID!) {
  agent(id: $id) {
    ...HoverAgent
  }
}

# A member's profile feed: the agents they installed, newest first. The feed
# merges services by date, which `installedAt` is for an agent.
query ProfileFeedAgents($filters: AgentFilter, $pagination: OffsetPaginationInput) {
  agents(filters: $filters, pagination: $pagination, ordering: [{ installedAt: DESC }]) {
    ...ListAgent
    installedAt
  }
}
