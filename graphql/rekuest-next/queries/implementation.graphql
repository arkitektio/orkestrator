query Implementation($id: ID!) {
  implementation(id: $id) {
    ...DetailImplementation
  }
}

query Implementations(
  $filters: ImplementationFilter
  $pagination: OffsetPaginationInput
  $ordering: [ImplementationOrder!]
) {
  implementations(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...DetailImplementation
  }
}
query ListImplementations(
  $filters: ImplementationFilter
  $pagination: OffsetPaginationInput
  $ordering: [ImplementationOrder!]
) {
  implementations(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListImplementation
  }
}

query ImplementationOptions($search: String, $values: [ID!], $dependency: ID) {
  options: implementations(
    filters: { resolvableFor: $dependency, search: $search, ids: $values }
    pagination: { limit: 50 }
  ) {
    value: id
    label: name
  }
}

query ImplementationAt(
  $agent: ID!
  $interface: String
  $demand: ActionDemandInput
) {
  implementationAt(
    agent: $agent
    interface: $interface
    demand: $demand
  ) {
    ...DetailImplementation
  }
}

query MyImplementationAt(
  $interface: String
  $actionId: ID
) {
  myImplementationAt(
    interface: $interface
    actionId: $actionId
  ) {
    ...DetailImplementation
  }
}

query ActionImplementationAt($agent: ID!, $actionHash: String!) {
  implementationAt(agent: $agent, actionHash: $actionHash) {
    ...DetailImplementation
  }
}

query HoverImplementation($id: ID!) {
  implementation(id: $id) {
    ...HoverImplementation
  }
}

# The installers of a kabinet release approval: actions whose first argument
# is a `@kabinet/approval` (a deployer's `install(approval)`). Actions that
# need more than the approval are dropped client-side (`isApprovalInstaller`):
# the server's `forceNonNullableLength` reads a `nullable` key ports need not
# store, and so matched nothing.
query ApprovalInstallers {
  implementations(
    filters: {
      action: {
        demands: [
          {
            kind: ARGS
            matches: [{ at: 0, kind: STRUCTURE, identifier: "@kabinet/approval" }]
          }
        ]
      }
    }
  ) {
    ...InstallerImplementation
  }
}
