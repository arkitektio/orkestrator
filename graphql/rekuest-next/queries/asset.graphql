query AgentAssets($id: ID!) {
  agent(id: $id) {
    id
    assets {
      ...AgentAsset
    }
  }
}

query AssetPolicy {
  assetPolicy {
    model {
      ...ModelPolicy
    }
    image {
      maxSize
      maxSide
      formats
    }
  }
}

query BloksForModel($ref: String!) {
  bloksForModel(ref: $ref) {
    ...ModelBlok
  }
}

# Read credentials for one asset's file, signed client-side (presignS3Url).
# Asked for only when the file is loaded, never with the asset list.
query AssetAccess($ref: String!) {
  asset(ref: $ref) {
    id
    file {
      ... on KulisseStore {
        id
        accessGrant {
          ...KulisseAccessGrant
        }
      }
      ... on MediaStore {
        id
        accessGrant {
          ...MediaAccessGrant
        }
      }
    }
  }
}
