query AgentAssets($id: ID!) {
  agent(id: $id) {
    id
    assets {
      ...AgentAsset
    }
  }
}

query AssetPolicy {
  assetPolicy {
    model {
      ...ModelPolicy
    }
    image {
      maxSize
      maxSide
      formats
    }
  }
}

# The bloks decorating every model a scene shows, in one request (each names
# its model in `forModel`): RekuestSceneHost batches the models it is asked for.
query BloksForModels($refs: [String!]!) {
  bloksForModels(refs: $refs) {
    ...ModelBlok
    forModel
  }
}

# Read credentials for one asset's file, signed client-side (presignS3Url).
# Asked for only when the file is loaded, never with the asset list.
query AssetAccess($ref: String!) {
  asset(ref: $ref) {
    id
    file {
      ... on KulisseStore {
        id
        accessGrant {
          ...KulisseAccessGrant
        }
      }
      ... on MediaStore {
        id
        accessGrant {
          ...MediaAccessGrant
        }
      }
    }
  }
}
