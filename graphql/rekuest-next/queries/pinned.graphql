# What you pinned: rekuest's Home and the command palette. Bloks (materialized)
# and agents; templates are not pinned, the bloks made of them are.
query Pinned {
  agents(filters: { pinned: true }) {
    ...ListAgent
  }
  materializedBloks(filters: { pinned: true }) {
    ...ListMaterializedBlok
  }
}
