# Global "my tasks" seed: caller-scoped, currently-active root tasks. Fetched on
# first mount (survives reload) and kept live by the WatchMyTasks subscription.
query MyTasks {
  myTasks {
    ...LiveTask
  }
}

query DetailTask($id: ID!) {
  task(id: $id) {
    ...DetailTask
  }
}

# Single-task hydration for the non-traversable subscription `create` path:
# a thin TaskChange only carries ids, so the client fetches the task once to
# populate the normalized cache. Same slim `LiveTask` shape as `MyTasks`, since
# the result is inserted into that list (see TaskUpdater / taskCache).
query Task($id: ID!) {
  task(id: $id) {
    ...LiveTask
  }
}

# Full-ports single-task fetch for the places that need `action { ...Ports }`:
# hydrating a new child into `DetailTask.children` (ChildTaskUpdater) and the
# task-hook runner (positional `returns` need the return ports).
query FullTask($id: ID!) {
  task(id: $id) {
    ...PostmanTask
  }
}

query ListTasks(
  $filter: TaskFilter
  $ordering: [TaskOrder!]
  $pagination: OffsetPaginationInput
) {
  tasks(filters: $filter, pagination: $pagination, ordering: $ordering) {
    ...ListTask
  }
}

query ListTasksDetails(
  $filter: TaskFilter
  $ordering: [TaskOrder!]
  $pagination: OffsetPaginationInput
) {
  tasks(filters: $filter, pagination: $pagination, ordering: $ordering) {
    ...PostmanTask
  }
}


query NoChildrenDetailTask($id: ID!) {
  task(id: $id) {
    ...NoChildrenDetailTask
  }
}

query HoverTask($id: ID!) {
  task(id: $id) {
    ...HoverTask
  }
}
