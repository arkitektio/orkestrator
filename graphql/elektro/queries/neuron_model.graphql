query DetailNeuronModel($id: ID!) {
  neuronModel(id: $id) {
    ...DetailNeuronModel
  }
}

query SectionDominance(
  $id: ID!
  $weightAxial: Float
  $weightCapacitance: Float
  $weightConductance: Float
) {
  neuronModel(id: $id) {
    id
    sectionDominance(
      weightAxial: $weightAxial
      weightCapacitance: $weightCapacitance
      weightConductance: $weightConductance
    ) {
      ...SectionDominance
    }
  }
}

query ListNeuronModels(
  $pagination: OffsetPaginationInput
  $filters: NeuronModelFilter
  $ordering: [NeuronModelOrder!]
) {
  neuronModels(pagination: $pagination, filters: $filters, ordering: $ordering) {
    ...ListNeuronModel
  }
}

# Where one section was recorded — asked only when its panel opens, never with
# the model. No `id` on the section: a section id is unique within its cell, not
# across models, so it must not normalize into a shared `Section:<id>` entry;
# the result stays keyed by this field's arguments.
query SectionSessions($model: ID!, $cell: ID!, $section: ID!) {
  sections(modelId: $model, cellId: $cell, ids: [$section]) {
    sessions {
      ...NeuronModelSession
    }
  }
}

# Compound ids: 'model:cell' and 'model:cell:section', each part percent-encoded.
query DetailCell($id: ID!) {
  cell(id: $id) {
    ...DetailCell
  }
}

query DetailSection($id: ID!) {
  section(id: $id) {
    ...DetailSection
  }
}
