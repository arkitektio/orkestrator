# The scene query.
#
# MUST run with `errorPolicy: "all"`. `ExperimentView.asAffine` errors rather than
# nulling when a view's path will not condense to one matrix — every view over a
# spike train, an irregularly sampled signal, or a variable-time-step run. The
# policy nulls that one field and keeps the experiment; without it a single
# lookup-timed recording discards the whole scene.
query GetExperimentScene($id: ID!) {
  experiment(id: $id) {
    ...ExperimentScene
  }
}

query ListExperiments(
  $pagination: OffsetPaginationInput
  $filters: ExperimentFilter
  $ordering: [ExperimentOrder!]
) {
  experiments(pagination: $pagination, filters: $filters, ordering: $ordering) {
    ...ListExperiment
  }
}

# The experiments composed over one world — how a run (a clock) or a dataset's
# own grid finds the timeline it is already on before minting another.
query ExperimentsForWorld($world: ID!) {
  experiments(filters: { world: $world }) {
    id
    name
  }
}
