query DetailModelWorkspace($id: ID!) {
  modelWorkspace(id: $id) {
    ...DetailModelWorkspace
  }
}

# A workspace named elsewhere: its name and how many models it maps.
query GetModelWorkspaceLine($id: ID!) {
  modelWorkspace(id: $id) {
    ...ListModelWorkspace
    mappings {
      id
    }
  }
}

query ListModelWorkspaces(
  $pagination: OffsetPaginationInput
  $filters: ModelWorkspaceFilter
  $ordering: [ModelWorkspaceOrder!]
) {
  modelWorkspaces(pagination: $pagination, filters: $filters, ordering: $ordering) {
    ...ListModelWorkspace
  }
}
