query HomePage {
  experiments: experiments(pagination: { limit: 1 }, ordering: [{ createdAt: DESC }]) {
    ...ListExperiment
  }

  simulations: simulations(pagination: { limit: 1 }, ordering: [{ createdAt: DESC }]) {
    ...ListSimulation
  }

  models: neuronModels(pagination: { limit: 1 }, ordering: [{ createdAt: DESC }]) {
    ...ListNeuronModel
  }
}
