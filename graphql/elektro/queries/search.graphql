# The module's omnibox: an array dataset (recorded or simulated) or a composed
# experiment. Simulation runs are no objects any more — a run is its clock, found
# through its model's sessions or its datasets.
query GlobalSearch($search: String, $pagination: OffsetPaginationInput) {
  arrayDatasets: arrayDatasets(
    filters: { search: $search }
    pagination: $pagination
  ) {
    ...ListArrayDataset
  }
  experiments: experiments(
    filters: { search: $search }
    pagination: $pagination
  ) {
    ...ListExperiment
  }}
