# Everything a trace row's label unfolds into: every anchor on the lens with its
# full metadata payload, and where the data came from — the dataset, and, when it
# was simulated, the neuron model that was integrated (with its dt and duration).
#
# `ExpLens.activeAnchors` already carries a thin projection (label, unit, the
# histogram's range, the site) — enough to name and scale a row; this is the
# reference view, fetched only when someone unfolds the row: the histogram's
# shape, the rig state and the raw acquisition metadata are too heavy to ride
# along with every experiment load.
query GetExpLensAnchors($id: ID!) {
  lens(id: $id) {
    id
    activeAnchors {
      ...ExpFullAnchor
    }
    dataset {
      id
      name
      simulation {
        id
        duration
        dt
        model {
          id
          name
        }
      }
    }
  }
}
