query GetFile($id: ID!) {
  file(id: $id) {
    ...File
  }
}

# A file named elsewhere: name, size, type and folder.
query GetFileLine($id: ID!) {
  file(id: $id) {
    ...ListFile
    folder {
      id
      name
    }
  }
}

query GetFiles(
  $filters: FileFilter
  $pagination: OffsetPaginationInput
  $ordering: [FileOrder!]
) {
  files(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListFile
  }
}
