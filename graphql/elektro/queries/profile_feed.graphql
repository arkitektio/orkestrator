# A member's profile feed: the model workspaces they made, newest first.
# `ListModelWorkspace` has no creation time, which the feed sorts by.
query ProfileFeedWorkspaces($filters: ModelWorkspaceFilter, $pagination: OffsetPaginationInput) {
  modelWorkspaces(filters: $filters, pagination: $pagination, ordering: [{ createdAt: DESC }]) {
    ...ListModelWorkspace
    createdAt
  }
}

# A member's profile feed: the neuron models they made, newest first.
query ProfileFeedNeuronModels($filters: NeuronModelFilter, $pagination: OffsetPaginationInput) {
  neuronModels(filters: $filters, pagination: $pagination, ordering: [{ createdAt: DESC }]) {
    ...ListNeuronModel
    createdAt
  }
}

# A member's profile feed: the model collections they made, newest first.
query ProfileFeedModelCollections($filters: ModelCollectionFilter, $pagination: OffsetPaginationInput) {
  modelCollections(filters: $filters, pagination: $pagination, ordering: [{ createdAt: DESC }]) {
    ...ListModelCollection
    createdAt
  }
}
