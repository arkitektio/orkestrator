# `name` became `fileName`, `dataset` became `folder`, and `origins` (the traces a
# file produced) became `exportOf` — a file is now declared as the export of
# something rather than the origin of traces.
mutation from_file_like(
  $file: FileLike!
  $fileName: String!
  $folder: ID
  $exportOf: [ExportOfInput!]
) {
  fromFileLike(
    input: {
      file: $file
      fileName: $fileName
      folder: $folder
      exportOf: $exportOf
    }
  ) {
    ...File
  }
}

mutation DeleteFile($id: ID!) {
  deleteFile(input: { id: $id })
}
