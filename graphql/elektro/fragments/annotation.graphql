# Annotations: what is marked on a timeline.
#
# `Annotation` replaces the old `ROI`. The difference that matters for a trace
# viewer is that an annotation lives in a coordinate system of its own — a
# drawing space — rather than being pinned to one array's index space. That space
# may carry a VALUE axis as well as a TIME one, which is what lets an annotation
# be scoped to a single view's row rather than spanning all of them.

fragment ExpAnnotation on Annotation {
  id
  name
  description
  # EVENT / EVENTS (points in time), EPOCH (a span), LINE / PATH / POLYGON.
  kind
  # Vertices, in the collection's coordinate system's axis order.
  vectors
  # A coordinate the annotation does NOT pin is one it spans: an epoch with no
  # value coordinate spans every row, which is exactly what a trial marker wants.
  coordinates {
    name
    value
  }
  strokeColor
  fillColor
  strokeWidth
  filled
  createdWithTransforms
}

fragment ExpAnnotationCollection on AnnotationCollection {
  id
  name
  description
  # The drawing space. Its axes say whether this collection is time-only or also
  # carries a VALUE axis, which decides how a vertex maps to screen y.
  coordinateSystem {
    ...ExpCoordinateSystem
  }
  # The edges back into what the shapes are drawn over; the FIRST places it. A
  # collection drawn over a trace's lens is how a value shape knows its row: the
  # edge's `output` is that lens' coordinate system. Empty for the experiment's
  # own (world-registered) collection.
  derivedFrom {
    id
    kind
    inputAxes
    outputAxes
    output {
      ...ExpCoordinateSystemRef
    }
  }
  annotations {
    ...ExpAnnotation
  }
}

# Read from the cache (never queried on its own): the experiment's default
# collection, where `createAnnotation(experiment:)` lands once it is minted. Known
# → a time mark is written optimistically; unknown → the first draw mints the
# collection and its layer, and the scene is refetched.
fragment ExpDefaultAnnotationCollection on Experiment {
  id
  annotationCollection {
    id
  }
}
