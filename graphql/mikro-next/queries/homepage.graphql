# Only whether there is anything at all: the page's lists run their own
# queries. Lenses rather than array datasets, because every container has a
# whole lens — an organization holding only tables is not an empty one; files
# because an upload that has not been converted yet has none.
query HomePage {
  lenses(pagination: { limit: 1 }) {
    id
  }

  files: files(pagination: { limit: 1 }) {
    id
  }
}

query PeerHomePage($id: ID!) {
  lenses(pagination: { limit: 1 }, filters: { owner: $id }) {
    id
  }

  files: files(
    pagination: { limit: 1 }
    filters: { owner: $id }
    ordering: [{ createdAt: DESC }]
  ) {
    ...ListFile
  }
}


# `arrayDatasetsStats` is the replacement the sidebars were waiting on: they used
# to count legacy Images because that was the only aggregate the schema exposed.
# Same shape (count + a bucketed series), now over the model the UI actually
# shows, so the numbers finally describe what is on screen.
query HomePageStats{
  arrayDatasetsStats(filters: {
    owner: null
  }) {
    count
    series(by: DAY, field: PK, timestampField: CREATED_AT) {
      count
    }
  }
}

# A peer's sidebar: their datasets in all, and how many came in since `since`
# (a week back). The week is a filter, not a slice of the daily series: the
# series buckets the whole history, so summing it counted every dataset again.
query PeerHomePageStats($id: ID!, $since: DateTime!){
  arrayDatasetsStats(filters: {
    owner: $id
  }) {
    count
  }
  recentArrayDatasets: arrayDatasetsStats(filters: {
    owner: $id
    createdAfter: $since
  }) {
    count
  }
}

# The home page's recent data: the newest parentless data of every kind it shows,
# newest first. Keys only -- each kind's tiles come from its own list in
# `HomeRootDetails`, where the tile fields are prefetched. `filters` is the home
# page's filter row: who made it, which collaboration it is in, and when it was
# created or acquired.
query HomeRoots($pagination: OffsetPaginationInput, $filters: RootFilter) {
  roots(
    kinds: [FILE, DATASET, TABLE_DATASET, MESH_COLLECTION, SPARSE_DATASET, NETWORK_COLLECTION]
    pagination: $pagination
    filters: $filters
  ) {
    key
    kind
    id
    name
    createdAt
  }
}

# The tiles for a page of roots, one constant-cost list per kind. A file comes with
# the first series a converter wrote out of it, so its card can show its images,
# and the counts of all of them: a 40-series LIF ships 5 datasets, not 40.
query HomeRootDetails(
  $files: [ID!]!
  $datasets: [ID!]!
  $tables: [ID!]!
  $sparse: [ID!]!
  $hasFiles: Boolean!
  $hasDatasets: Boolean!
  $hasTables: Boolean!
  $hasSparse: Boolean!
) {
  files(filters: { ids: $files }, pagination: { limit: 100 }) @include(if: $hasFiles) {
    ...ListFile
    derivedContainers(filters: { direction: SOURCE, containerKind: DATASET }, pagination: { limit: 5 }) {
      id
      seriesIdentifier
      container {
        __typename
        ... on ArrayDataset {
          ...ListArrayDataset
        }
      }
    }
    seriesCount: derivedContainersCount(kind: DATASET)
    containerCount: derivedContainersCount
  }
  arrayDatasets(filters: { ids: $datasets }, pagination: { limit: 100 }) @include(if: $hasDatasets) {
    ...ListArrayDataset
  }
  tableDatasets(filters: { ids: $tables }, pagination: { limit: 100 }) @include(if: $hasTables) {
    ...ListTableDataset
  }
  sparseDatasets(filters: { ids: $sparse }, pagination: { limit: 100 }) @include(if: $hasSparse) {
    ...ListSparseDataset
  }
}

# What was made from every tile on the home page -- each converted series, each image
# or table that came without a file -- in one walk on the server, rather than one
# lineage per card. Only what a chip needs.
query HomeResults($starts: [LineageRootInput!]!, $down: Int! = 3) {
  descendants(starts: $starts, down: $down) {
    root
    more
    nodes {
      key
      kind
      id
      name
      depth
    }
  }
}

# What the home page's filter row offers: the organization's members (by sub, the
# key `RootFilter.owner` takes). Its collaborations are lok's (core/collaborations).
query HomeFilterOptions {
  members {
    user {
      sub
    }
  }
}

# The home sidebar's page list: how many of each kind there are and how many
# came in since `since` (a week back). Annotations and scenes made before they
# carried a timestamp count but are never new. Collaborations are counted by
# `collaborationsStats` (the shared collaborations package).
query HomeOverview($since: DateTime!) {
  lenses: lensesStats { count }
  newLenses: lensesStats(filters: { createdAfter: $since }) { count }
  arrayDatasets: arrayDatasetsStats { count }
  newArrayDatasets: arrayDatasetsStats(filters: { createdAfter: $since }) { count }
  coordinateSystems: coordinateSystemsStats { count }
  newCoordinateSystems: coordinateSystemsStats(filters: { createdAfter: $since }) { count }
  tableDatasets: tableDatasetsStats { count }
  newTableDatasets: tableDatasetsStats(filters: { createdAfter: $since }) { count }
  sparseDatasets: sparseDatasetsStats { count }
  newSparseDatasets: sparseDatasetsStats(filters: { createdAfter: $since }) { count }
  folders: foldersStats { count }
  newFolders: foldersStats(filters: { createdAfter: $since }) { count }
  files: filesStats { count }
  newFiles: filesStats(filters: { createdAfter: $since }) { count }
  charts: chartsStats { count }
  newCharts: chartsStats(filters: { createdAfter: $since }) { count }
  annotations: annotationsStats { count }
  newAnnotations: annotationsStats(filters: { createdAfter: $since }) { count }
  scenes: scenesStats { count }
  newScenes: scenesStats(filters: { createdAfter: $since }) { count }
  collaborations: collaborationsStats { count }
}
