# What the server knows of a table's columns without a scan: the footer's
# range and null count, and the summary a client computed once and pinned
# (histogram, distinct values). The column editor reads these first and scans
# the parquet only for what is missing.
#
# Also what a colouring entry needs of its table to draw its control and scan
# the parquet (name, store, each column's role): the editor and the network
# layer ask this one query instead of the whole `GetTableDataset`.
query TableColumnStats($id: ID!) {
  tableDataset(id: $id) {
    id
    name
    rowCount
    store {
      ...ParquetStore
    }
    columns {
      ...TableDatasetColumn
      stats {
        min
        max
        nullCount
      }
      summary {
        id
        histogram
        bins
        distinctValues
        distinctCount
      }
    }
  }
}

# Pins what a client computed over a column (its histogram, or its distinct
# values) to the table's global anchor, so the next open reads it instead of
# scanning the parquet again. A parquet never changes, so it never goes stale.
mutation PinColumnSummary($table: ID!, $summary: ColumnSummaryInput!) {
  createCoordinateAnchor(input: { table: $table, anchor: { axisAnchors: [], columnSummaries: [$summary] } }) {
    id
  }
}
