# The layer a create mutation would make, resolved and never written: what a
# scene float stages (`scene/platform/float/stagedLayerStore.ts`). The input
# is one of the create mutations' own inputs; keeping the layer is that same
# input sent to the create.
#
# Resolved once, read two ways: as the scene draws it (`SceneLayer`) and as
# the Add Layer engine counts it (`AddLayerStagedLayer`) — a staged layer
# counts toward the next channel colour and the "already in the scene" check
# like a saved one. Both fragments alias the intensity colormap the same way,
# so they share the one selection.
query PreviewLayer($input: PreviewLayerInput!) {
  previewLayer(input: $input) {
    ...SceneLayer
    ...AddLayerStagedLayer
  }
}
