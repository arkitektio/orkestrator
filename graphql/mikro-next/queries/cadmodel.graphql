query GetCadModel($id: ID!) {
  cadModel(id: $id) {
    ...DetailCadModel
  }
}

# Whether a CAD model can be drawn in a scene: its whole lens, if that lens's
# space reaches the scene's world. Asked before the add-layer dialog opens on a
# dropped model, so an unplaced one is refused in a sentence rather than
# opening a picker that does not list it.
query CadModelPlacement($scene: ID!, $model: ID!) {
  scene(id: $scene) {
    id
    worldCoordinateSystem {
      id
    }
  }
  cadModel(id: $model) {
    id
    label
    coordinateSystem {
      id
    }
  }
}

query PlaceableCadModelLenses($model: ID!, $space: ID!) {
  lenses(filters: { cadModel: $model, sliced: false, placeableIn: { space: $space, asLayer: CAD_MODEL } }) {
    id
  }
}

query ListCadModels($filters: CadModelFilter, $pagination: OffsetPaginationInput) {
  cadModels(filters: $filters, pagination: $pagination) {
    ...ListCadModel
  }
}
