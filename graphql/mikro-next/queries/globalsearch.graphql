query GlobalSearch(
  $search: String
  $noArrayDatasets: Boolean!
  $noFiles: Boolean!
  $noFolders: Boolean!
  $noLenses: Boolean!
  $pagination: OffsetPaginationInput
) {
  arrayDatasets: arrayDatasets(
    filters: { search: $search }
    pagination: $pagination
  ) @skip(if: $noArrayDatasets) {
    ...ListArrayDataset
  }

  files: files(
    filters: { search: $search }
    pagination: $pagination
  ) @skip(if: $noFiles) {
    ...ListFile
  }

  folders: folders(
    filters: { search: $search }
    pagination: $pagination
  ) @skip(if: $noFolders){
    ...ListFolder
  }

  # Only lenses that select something: a whole lens is its container, which is
  # already a hit of its own.
  lenses: lenses(
    filters: { search: $search, sliced: true }
    pagination: $pagination
  ) @skip(if: $noLenses) {
    ...ListLens
  }
}
