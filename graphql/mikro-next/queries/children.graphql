# The contents of one folder, as one heterogeneous page.
#
# Every member of `FolderChild` is selected EXCEPT the legacy `Image` — it is
# gone from the UI, and a folder that still holds images simply does not show
# them. The explorer skips any `__typename` it does not know rather than
# rendering an empty row, so a future union member degrades gracefully too.
#
# `MeshCollection`, `AnnotationCollection` and `NetworkCollection` have no detail
# route yet, so they are selected thin (id + name) and render as unlinked rows:
# better a visible item than a silently missing one.
#
# The kinds, the order and the page are the server's (`filters.kinds`, `order`),
# so a page of tables is a page of tables and a sort covers the whole folder.
query Children(
  $id: ID!
  $pagination: ChildrenPaginationInput
  $filters: FolderChildrenFilter
  $order: ChildrenOrder
) {
  children(parent: $id, pagination: $pagination, filters: $filters, order: $order) {
    ...ListFile
    ...ListFolder
    ...ListArrayDataset
    # Only here, not on ListArrayDataset: the folder view shows what a dataset
    # holds on disk, the sum of every level's measured `sizeBytes`, and breaks
    # that sum down per level in a tooltip.
    ... on ArrayDataset {
      sizeBytes
      dataArrays {
        id
        level
        shape
        store {
          id
          sizeBytes
        }
      }
    }
    ...ListTableDataset
    # A mesh collection's name is optional — `label` is that, or its store's key.
    ... on MeshCollection {
      id
      label
    }
    ... on AnnotationCollection {
      id
      name
    }
    # Named optionally, like a mesh collection; `label` falls back to the file's name.
    ... on Fixture {
      id
      label
    }
    ...ListSparseDataset
    ... on NetworkCollection {
      id
      label
    }
  }
}

# How many children `Children` pages through with the same search, in total and
# per kind: the type filter's counts and the pager's end.
query ChildrenCounts($id: ID!, $filters: FolderChildrenFilter) {
  childrenCounts(parent: $id, filters: $filters) {
    total
    kinds {
      kind
      count
    }
  }
}
