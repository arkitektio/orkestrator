# What a delete would cost, asked before every delete (`lib/deletion`): what
# was made from it (a plain delete is refused over it; `cascade: true` takes
# it along), what stops it, and what else goes with it. One query per model,
# one answer shape.
fragment DeletePreflight on DeletePreflight {
  target
  casualties {
    key
    kind
    id
    name
    depth
    parent
  }
  blockers {
    key
    kind
    id
    reason
  }
  cascadeCounts {
    label
    count
  }
  truncated
  needsCascade
  deletable
}

query PreflightDeleteArrayDataset($id: ID!) {
  preflightDeleteArrayDataset(id: $id) {
    ...DeletePreflight
  }
}

query PreflightDeleteTableDataset($id: ID!) {
  preflightDeleteTableDataset(id: $id) {
    ...DeletePreflight
  }
}

query PreflightDeleteSparseDataset($id: ID!) {
  preflightDeleteSparseDataset(id: $id) {
    ...DeletePreflight
  }
}

