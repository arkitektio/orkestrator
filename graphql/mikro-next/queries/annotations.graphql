query GetAnnotation($id: ID!) {
  annotation(id: $id) {
    ...DetailAnnotation
  }
}

# Who drew one shape, for the scene's hover button. Its own lean document:
# the button mounts per hovered shape and must not drag `GetAnnotation`'s
# vectors and scene along, and `SceneAnnotation` is fetched for every shape of
# every layer of a scene, so the author does not ride there.
query GetAnnotationCreator($id: ID!) {
  annotation(id: $id) {
    id
    creator {
      sub
    }
  }
}

# What one shape is and what was made from it, for the card the scene's hover
# button opens into. Asked for when the card opens, never on hover and never
# on `SceneAnnotation`: `derivedResidents` walks the derivation edges naming
# the shape. Both lists are a record of the act, not of where things are now —
# a lens cut to the shape (`createLens(annotation:)`), and the data whose
# `derivedFrom` named it as an ANNOTATION source (a crop, a straightening).
query GetAnnotationInfo($id: ID!) {
  annotation(id: $id) {
    id
    kind
    description
    creator {
      sub
    }
    collection {
      id
      name
    }
    coordinates {
      name
      value
    }
    derivedLenses {
      id
      label
      shape
    }
    derivedResidents {
      __typename
      ... on ArrayDataset {
        id
        name
      }
      ... on TableDataset {
        id
        name
      }
      ... on SparseDataset {
        id
        name
      }
      ... on AnnotationCollection {
        id
        name
      }
      ... on MeshCollection {
        id
        label
      }
      ... on NetworkCollection {
        id
        label
      }
    }
  }
}

# What one shape PROVIDES to an action's port (`@mikro/annotation_kind`, the
# axis counts of its collection's space), and what the crop of the lens under
# it would (`descriptorsUnder`: the descriptors `createLens(lens:, annotation:)`
# would give its lens, before anyone makes it; null when the shape misses the
# lens), for the scene's card. Per clicked shape, never on `SceneAnnotation`:
# the server reads the collection's axes to answer it, and that fragment ships
# every shape of every layer. A draw asks the same in the request that makes
# the shape (`CreateSceneAnnotation`) and writes it here.
fragment AnnotationActionDescriptors on Annotation {
  id
  descriptors
  descriptorsUnder(lens: $lens)
}

query GetAnnotationActionDescriptors($id: ID!, $lens: ID!) {
  annotation(id: $id) {
    ...AnnotationActionDescriptors
  }
}

# The renderer's list: one entry per collection, fetched ONCE per mounted
# scene and shared by the AnnotationLayer, its card and the annotations panel
# (same variables, so Apollo serves all three from one cache entry). It is
# never polled: our own draws and deletes are written into the entry, and a
# layer set to "live" follows everybody else's through `WatchSceneAnnotations`
# (see `features/annotations/annotationCache.ts`). Keep its selection lean —
# see `SceneAnnotation`.
query GetSceneAnnotations(
  $filters: AnnotationFilter
  $pagination: OffsetPaginationInput
) {
  annotations(filters: $filters, pagination: $pagination) {
    ...SceneAnnotation
  }
}

# The browse list behind /mikro/annotations. A separate document from
# `GetSceneAnnotations` because the card needs its collection and the renderer
# must not pay for it.
query GetAnnotations(
  $filters: AnnotationFilter
  $ordering: [AnnotationOrder!]
  $pagination: OffsetPaginationInput
) {
  annotations(filters: $filters, ordering: $ordering, pagination: $pagination) {
    ...ListAnnotation
  }
}

query GetAnnotationCollection($id: ID!) {
  annotationCollection(id: $id) {
    ...AnnotationCollection
  }
}

query GetAnnotationCollections(
  $filters: AnnotationCollectionFilter
  $pagination: OffsetPaginationInput
) {
  annotationCollections(filters: $filters, pagination: $pagination) {
    ...AnnotationCollection
  }
}
