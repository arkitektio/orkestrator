query GetAnnotation($id: ID!) {
  annotation(id: $id) {
    ...DetailAnnotation
  }
}

# Who drew one shape, for the scene's hover button. Its own lean document:
# the button mounts per hovered shape and must not drag `GetAnnotation`'s
# vectors and scene along, and `SceneAnnotation` is polled per layer per
# mounted scene, so the author does not ride there.
query GetAnnotationCreator($id: ID!) {
  annotation(id: $id) {
    id
    creator {
      sub
    }
  }
}

# The renderer's list: one entry per collection, polled by every mounted
# AnnotationLayer and ridden along by the annotations panel (same variables, so
# Apollo serves both from one cache entry). Keep its selection lean — see
# `SceneAnnotation`. Named in `refetchQueries` by string in
# useCreateSceneAnnotation / useDeleteSelectedRois.
query GetSceneAnnotations(
  $filters: AnnotationFilter
  $pagination: OffsetPaginationInput
) {
  annotations(filters: $filters, pagination: $pagination) {
    ...SceneAnnotation
  }
}

# The browse list behind /mikro/annotations. A separate document from
# `GetSceneAnnotations` because the card needs its collection and the renderer
# must not pay for it.
query GetAnnotations(
  $filters: AnnotationFilter
  $ordering: [AnnotationOrder!]
  $pagination: OffsetPaginationInput
) {
  annotations(filters: $filters, ordering: $ordering, pagination: $pagination) {
    ...ListAnnotation
  }
}

query GetAnnotationCollection($id: ID!) {
  annotationCollection(id: $id) {
    ...AnnotationCollection
  }
}

query GetAnnotationCollections(
  $filters: AnnotationCollectionFilter
  $pagination: OffsetPaginationInput
) {
  annotationCollections(filters: $filters, pagination: $pagination) {
    ...AnnotationCollection
  }
}
