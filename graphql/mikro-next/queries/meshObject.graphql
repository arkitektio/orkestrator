# One object of a mesh collection, as the scene's mesh float lists it: what
# was computed from that one surface (a MESH_OBJECT derivation).
query GetMeshObjectInfo($collection: ID!, $object: Int!) {
  meshObject(collection: $collection, object: $object) {
    id
    objectId
    derivedResidents {
      ...DerivedResident
    }
  }
}

# One mesh of a collection, opened as a page: the collection's scenes (the
# page opens one with this mesh selected) and what was made from the mesh.
query GetMeshObject($collection: ID!, $object: Int!) {
  meshObject(collection: $collection, object: $object) {
    id
    objectId
    collection {
      ...MeshCollection
      folder {
        id
        name
      }
      fullLens {
        id
        defaultScene {
          ...ListScene
        }
        scenes {
          ...ListScene
        }
      }
    }
    derivedResidents {
      ...DerivedResident
    }
  }
}

# A mesh object in one line, wherever another surface names it (its display):
# which object of which collection. Nothing else, so a list of chips stays cheap.
query GetMeshObjectLabel($collection: ID!, $object: Int!) {
  meshObject(collection: $collection, object: $object) {
    id
    objectId
    collection {
      id
      label
    }
  }
}

# What drawing one mesh on its own needs (its viewer): the collection's
# fabriks store, opened off any scene. Nothing else -- the collection's scenes
# are what `GetMeshObject` is for.
query GetMeshObjectSource($collection: ID!, $object: Int!) {
  meshObject(collection: $collection, object: $object) {
    id
    objectId
    collection {
      id
      label
      store {
        ...FabriksStore
      }
    }
  }
}
