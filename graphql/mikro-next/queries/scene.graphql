query GetScene($id: ID!) {
  scene(id: $id) {
    ...Scene
  }
}

query GetScenes(
  $filters: SceneFilter
  $pagination: OffsetPaginationInput
  $ordering: [SceneOrder!]
) {
  scenes(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListScene
  }
}

# One scene at card depth: what a chip or a display widget draws. `GetScene`
# is the whole composition (every layer, its placement, its stores).
query GetListScene($id: ID!) {
  scene(id: $id) {
    ...ListScene
  }
}
