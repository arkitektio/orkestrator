# The scene the Add Layer dialog is adding to: its world, the server's own
# answer to what is placeable there, and the layers already staged.
#
# `placedSystems` is the OFFER — "the same set the `placeableIn` filters answer
# from, so a picker and a layer mutation cannot disagree" — as ids: the
# structure the picker walks comes from `AddLayerWorldGraph`, and a space that
# walk reaches but the server does not list (one reached only across a FIELD,
# say) yields no row.
#
# The scene's own layers ride along: the picker ranks candidates by their
# relation to what is already staged, and defaults a new channel's styling from
# a staged sibling of the same dataset.
query AddLayerReachable($scene: ID!) {
  scene(id: $scene) {
    id
    name
    layers {
      ...AddLayerStagedLayer
    }
    worldCoordinateSystem {
      id
      name
      placedSystems {
        id
      }
    }
  }
}

# The world's coordinate-system component: every space it relates to and every
# top-level edge between them, each in its true stored direction. The picker
# walks the CHILDREN from the world — an edge lands in its `output`, so a
# space's children are the spaces whose edges land in it: the grids registered
# into the world, the derived datasets, crops and levels landing in those
# grids, and so on down — which is the tree the derivation engine ranks by.
# The server's walk is undirected, so a dataset registered into a second world
# brings that world along; the client's directed walk from THIS world never
# reaches it, and its spaces are simply not listed.
query AddLayerWorldGraph($world: ID!, $maxDepth: Int) {
  coordinateGraph(coordinateSystem: $world, maxDepth: $maxDepth) {
    root {
      id
    }
    systems {
      ...AddLayerSpace
    }
    transformations {
      ...DerivationEdge
    }
  }
}

# Which lenses the server would actually accept as a drawable / label layer, as
# id-only capability sets.
#
# `asLayer` is a real narrowing rather than a no-op: IMAGE requires an x and a y
# axis of more than one pixel (the same gate layer creation applies), and LABEL
# additionally requires a primary derivation declaring CATEGORIZED. The engine
# can see that edge in the lineage too, but the server is the last word on what
# it will draw as a mask — a crop of a mask is one to a person and not to
# `createLabelLayer` — so LABEL stays a gate the server answers, and lineage
# only orders and explains within it. PHASOR and RGB are asked for the same
# reason: PHASOR needs a MICROTIME or SPECTRUM axis, RGB a channel axis with at
# least three positions to cut the planes from. VECTOR asks nothing beyond
# IMAGE, so it is not asked: a drawable lens with a `vector` axis is one.
#
# The drawable set also answers which axis is which. `suggestedRenderAxes` is
# what a layer over the lens WOULD say, before one exists. It is selected here
# and not on the candidate because `x` and `y` are non-null: IMAGE guarantees
# the lens has them.
query AddLayerLensCapabilities($space: ID!) {
  drawable: lenses(filters: { placeableIn: { space: $space, asLayer: IMAGE } }) {
    id
    ... on ArrayLens {
      suggestedRenderAxes {
        ...LayerRenderAxes
      }
    }
  }
  labels: lenses(filters: { placeableIn: { space: $space, asLayer: LABEL } }) {
    id
  }
  phasor: lenses(filters: { placeableIn: { space: $space, asLayer: PHASOR } }) {
    id
  }
  rgb: lenses(filters: { placeableIn: { space: $space, asLayer: RGB } }) {
    id
  }
}

# The provenance HELPER: the full lineage component around one candidate,
# fetched once a row is chosen. The world's children tree already holds every
# derivation landing inside this world; this is what reaches an ancestor
# outside it — the acquisition a segmentation came from when only the
# segmentation was registered here — and anything beyond the tree's depth.
#
# Edge endpoints select their residents because a lineage edge names a space,
# and the engine keys nodes by container — the same hop `parentDatasetOfEdge`
# makes on the dataset page.
query AddLayerLineage($coordinateSystem: ID!, $maxDepth: Int) {
  lineageGraph(coordinateSystem: $coordinateSystem, maxDepth: $maxDepth) {
    root {
      id
    }
    nodes {
      ...AddLayerLineageNode
    }
    edges {
      ...DerivationEdge
      input {
        residents {
          ...AddLayerSpaceOwner
        }
      }
      output {
        residents {
          ...AddLayerSpaceOwner
        }
      }
    }
  }
}

# The WINDOWED lenses of the non-array containers reachable from a space: a
# table cut to a time range, a mesh collection cut to a box. The picker lists
# such containers by themselves (their whole lens); these are what a row offers
# beside "the whole thing". `sliced: true` so the whole lenses, which every
# container has, are not fetched only to be dropped.
query AddLayerWindowLenses($space: ID!) {
  points: lenses(filters: { sliced: true, placeableIn: { space: $space, asLayer: POINT } }) {
    ...LayerLens
  }
  tracks: lenses(filters: { sliced: true, placeableIn: { space: $space, asLayer: TRACK } }) {
    ...LayerLens
  }
  meshes: lenses(filters: { sliced: true, placeableIn: { space: $space, asLayer: MESH } }) {
    ...LayerLens
  }
  networks: lenses(filters: { sliced: true, placeableIn: { space: $space, asLayer: NETWORK } }) {
    ...LayerLens
  }
  annotations: lenses(
    filters: { sliced: true, placeableIn: { space: $space, asLayer: ANNOTATION } }
  ) {
    ...LayerLens
  }
}

# What was made from the containers a scene draws, as trees: one walk for all of
# them (the home page's `descendants`), each node naming what it was made from.
# The scene's "Add derived" list.
query SceneDerived($starts: [LineageRootInput!]!, $down: Int! = 3) {
  descendants(starts: $starts, down: $down) {
    root
    more
    nodes {
      key
      kind
      id
      name
      depth
      parent
    }
  }
}

# For each derived child: the whole lens the Add layer form opens on, and the
# space that lens lives in (whether the scene's world reaches it). The drawn
# containers ride along for their names, the list's headings. One
# constant-cost list per kind, as `HomeRootDetails`.
query SceneDerivedDetails(
  $datasets: [ID!]!
  $tables: [ID!]!
  $meshes: [ID!]!
  $networks: [ID!]!
  $annotations: [ID!]!
  $hasDatasets: Boolean!
  $hasTables: Boolean!
  $hasMeshes: Boolean!
  $hasNetworks: Boolean!
  $hasAnnotations: Boolean!
) {
  arrayDatasets(filters: { ids: $datasets }, pagination: { limit: 100 }) @include(if: $hasDatasets) {
    id
    name
    spec
    fullLens {
      id
    }
    intrinsicSystem {
      id
    }
  }
  tableDatasets(filters: { ids: $tables }, pagination: { limit: 100 }) @include(if: $hasTables) {
    id
    name
    fullLens {
      id
    }
    coordinateSystem {
      id
    }
  }
  meshCollections(filters: { ids: $meshes }, pagination: { limit: 100 }) @include(if: $hasMeshes) {
    id
    name
    fullLens {
      id
    }
    coordinateSystem {
      id
    }
  }
  networkCollections(filters: { ids: $networks }, pagination: { limit: 100 }) @include(if: $hasNetworks) {
    id
    name
    fullLens {
      id
    }
    coordinateSystem {
      id
    }
  }
  annotationCollections(filters: { ids: $annotations }, pagination: { limit: 100 }) @include(if: $hasAnnotations) {
    id
    name
    fullLens {
      id
    }
    coordinateSystem {
      id
    }
  }
}
