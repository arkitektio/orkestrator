# What a colouring needs to read one slice of a sparse matrix, and nothing more.
#
# Everything here the server already publishes off the artifact at
# `finishSparseUpload`, which is why the client needs NO `zarr.json` reads of
# its own: `describe()` in the reference reader costs five metadata GETs per
# layout to recover exactly these fields.
#
# `path` is the layout's own value, never a guess. The real value is
# `layouts/axis{k}`; several descriptions in this schema still say
# `layouts/csr_matrix`, which is stale prose the writer has not emitted for a
# long time.
fragment SparseLayoutRead on SparseLayout {
  path
  # Which axis `indptr` walks — the axis one contiguous read selects along.
  # A colouring needs the layout indexed on the FEATURE axis; asking the other
  # one has no range to read at all, only a scan of every byte.
  indexedAxis
  # The uncompressed axes in the order `indices` was raveled over them. At rank
  # two it says nothing; above it a wrong reading does not fail, it reads a
  # different cell.
  indexOrder
  nnz
  dtype
  # The chunk length of each of `data`, `indices` and `indptr` — what decides
  # what a read costs.
  chunks
  # A byte-addressable store is ONE uncompressed chunk per array, so a range
  # read is the whole array. The reader refuses these rather than pulling
  # hundreds of megabytes to answer for one gene.
  rangeReadable
}

fragment SparseStoreRead on SparseStore {
  id
  key
  bucket
  path
  shape
  spec
  layouts {
    ...SparseLayoutRead
  }
}

# Rooted on the dataset a `SPARSE` colorBy names, so a colouring can resolve
# the layout, the object axis and the slot count before reading a single byte.
fragment SparseColouringSource on SparseDataset {
  id
  name
  axisNames
  # The axes a single contiguous read can select along — one per stored layout.
  # An axis absent here is one this dataset cannot answer about quickly.
  indexableAxes
  shape
  arrays {
    id
    indexedAxis
    indexedAxisName
    path
    store {
      ...SparseStoreRead
    }
  }
  # Where a position along an identified axis gets its name: the client finds a
  # gene's row index in the table the axis references.
  axisReferences {
    axis
    # The table whose ROWS are this axis' positions, keyed by its single INDEX
    # coordinate column. Selecting the store and the columns is what lets the
    # client turn "IL7R" into the row index an `at` takes — the schema's own
    # instruction, and the reason a 19,059-feature matrix is one picker row.
    references {
      id
      name
      axisNames
      store {
        ...ParquetStore
      }
      columns {
        ...TableDatasetColumn
      }
    }
  }
}

query SparseColouringSource($id: ID!) {
  sparseDataset(id: $id) {
    ...SparseColouringSource
  }
}

# ---------------------------------------------------------------------------
# The dataset as a thing with a page, as opposed to a thing a colouring reads.
# The two selections above are what a colour-by needs and nothing more; these
# are what the list and detail pages show. Kept apart so a colouring does not
# pay for a folder and a coordinate system it never looks at.
# ---------------------------------------------------------------------------

fragment ListSparseDataset on SparseDataset {
  id
  name
  description
  axisNames
  # Read off the stores rather than declared, so it is always the truth about
  # the bytes — the card shows it next to the axis names as `obs 2638 × var 1838`.
  shape
  # Which axes one contiguous read can select along: the card's one badge.
  indexableAxes
}

fragment SparseDataset on SparseDataset {
  id
  name
  description
  axisNames
  shape
  indexableAxes
  # Nullable and the null is meaningful: an unfiled matrix reads "Unfiled".
  folder {
    id
    name
  }
  # The system this matrix OWNS — its two enumerations are the axes, and a
  # FIELD edge from it lands here. What the Space tab draws the graph around.
  coordinateSystem {
    ...CoordinateSystem
  }
  # One per stored layout. The store carries the per-layout facts (nnz, dtype,
  # chunking, whether a range read is even possible); the array says which of
  # the store's layouts it is, by `path`.
  arrays {
    id
    indexedAxis
    indexedAxisName
    path
    store {
      ...SparseStoreRead
    }
  }
  # Where a position along an identified axis gets its name — the table whose
  # rows ARE that axis. Linked, not read: the page shows which table names an
  # axis, and leaves resolving a position to the colouring code above.
  axisReferences {
    id
    axis
    references {
      id
      name
      axisNames
    }
  }
}
