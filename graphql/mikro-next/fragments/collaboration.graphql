fragment ListCollaboration on Collaboration {
  id
  name
  description
  createdAt
}

fragment CollaborationItem on CollaborationItem {
  id
  identifier
  objectId
  brought
  addedAt
}

# A collaboration and how much is in it, counted on the server. Its items are
# paged (`GetCollaborationItems`): one put in with "everything made from it"
# can hold thousands.
fragment Collaboration on Collaboration {
  ...ListCollaboration
  put: itemCount(brought: false)
  broughtCount: itemCount(brought: true)
}
