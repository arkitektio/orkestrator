# A collaboration is lok's: one key across all of the organization's services. mikro's row
# of it is made the first time something is put in, and every lookup is by that key, so the
# client names it by the key (`id: key`): its route, its smart object and its cache entry.
fragment ListCollaboration on Collaboration {
  id: key
  name
  description
  createdAt
}

fragment CollaborationItem on CollaborationItem {
  id
  identifier
  objectId
  brought
  addedAt
}

# A collaboration and how much is in it, counted on the server. Its items are
# paged (`GetCollaborationItems`): one put in with "everything made from it"
# can hold thousands.
fragment Collaboration on Collaboration {
  ...ListCollaboration
  put: itemCount(brought: false)
  broughtCount: itemCount(brought: true)
}
