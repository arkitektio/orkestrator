fragment TransferFunction on TransferFunction {
  climMin
  climMax
  colormap
  color
  gamma
  opacity
  invert
  # The intensity transfer CURVE: raw value (`position`, data units) → the
  # normalized 0..1 the colormap is indexed with. Replaces the clim+gamma
  # power law when present; gamma is the fallback.
  stops {
    position
    value
  }
}

# One entry of a label layer's colour picker: a column of the table this mask's
# FIELD edge keys its pixel values into (see `attributePlans`), instead of
# hashing each id to a hue. Same shape and same relation as `MeshColorBy` — a
# mask's pixel values dereference into a table exactly as a collection's object
# ids do — plus the `label` a picker needs to caption the entry.
fragment LabelColorBy on LabelColorBy {
  table
  column
  # The `references` hops from the table the mask's ids land in to `table`;
  # empty is the direct case. NOT optional to select: `colorBys` is a
  # whole-array replace on the write path, so an entry read back without its
  # join path and re-sent flattens to `[]` — the same column name resolved
  # against the wrong table, silently.
  joinPath {
    table
    column
  }
  colormap
  # Clims: the ramp runs between these instead of the column's own range. The
  # same whole-array-replace hazard as `joinPath` — read an entry without them
  # and send it back and the server stores nulls over what the card set.
  min
  max
  label
  # The SPARSE arm: `kind` says which of the two an entry is, and a SPARSE one
  # names a sparse LENS instead of a column, leaving `table`/`column` null. The
  # lens pins one position on every axis the matrix identifies itself by; which
  # matrix and which position is the lens' to say, resolved through
  # `mikro/lib/lenses/lensRegistry.ts`.
  kind
  lens
}

# One entry of a label layer's filter picker: which of the mask's objects are
# DRAWN, over the same FIELD edge its colourings use. Which half applies follows
# from the column's role — `min`/`max` bound a measure, `values` enumerate a
# categorical — and `exclude` inverts the rule. The sibling of `LabelColorBy`,
# exactly as `MeshFilterBy` is of `MeshColorBy`.
fragment LabelFilterBy on LabelFilterBy {
  table
  column
  # Same read-modify-write hazard as `LabelColorBy.joinPath` — see there.
  joinPath {
    table
    column
  }
  label
  min
  max
  values
  exclude
  # The SPARSE arm, exactly as on `LabelColorBy`: a rule may bound one slice of
  # a matrix rather than a column of a table, and then names the sparse `lens`
  # that pins it with `table`/`column` null. Selected for the same two reasons
  # — it renders, and `filterBys` is a whole-array replace, so an entry read
  # back without it and re-sent comes back a column rule naming nothing.
  kind
  lens
}

# One entry of a mesh layer's colour picker. Same shape and same relation as
# `LabelColorBy` — a collection's object ids reach a table exactly as a mask's
# pixel values do — plus the `label` a picker needs to caption the entry.
fragment MeshColorBy on MeshColorBy {
  table
  column
  # The `references` hops from the table the collection's ids land in to
  # `table`; empty is the direct case. NOT optional to select: `colorBys` is a
  # whole-array replace on the write path, so an entry read back without its
  # join path and re-sent flattens to `[]` — the same column name resolved
  # against the wrong table, silently.
  joinPath {
    table
    column
  }
  colormap
  # Clims: the ramp runs between these instead of the column's own range. The
  # same whole-array-replace hazard as `joinPath` — read an entry without them
  # and send it back and the server stores nulls over what the card set.
  min
  max
  label
  # The SPARSE arm: `kind` says which of the two an entry is, and a SPARSE one
  # names a sparse LENS instead of a column, leaving `table`/`column` null. The
  # lens pins one position on every axis the matrix identifies itself by; which
  # matrix and which position is the lens' to say, resolved through
  # `mikro/lib/lenses/lensRegistry.ts`.
  kind
  lens
}

# One entry of a mesh layer's filter picker: which objects are DRAWN, over the
# same FIELD edge its colourings use. Which half applies follows from the
# column's role — `min`/`max` bound a measure, `values` enumerate a categorical
# — and `exclude` inverts the rule.
fragment MeshFilterBy on MeshFilterBy {
  table
  column
  # Same read-modify-write hazard as `MeshColorBy.joinPath` — see there.
  joinPath {
    table
    column
  }
  label
  min
  max
  values
  exclude
  # The SPARSE arm — see `LabelFilterBy`, which is this fragment over the other
  # layer kind.
  kind
  lens
}

# One entry of a network layer's colour picker. The mesh shape plus a third
# arm: a GRAPH entry names a per-node value the collection itself carries
# (`attribute` — strahler, degree, depth, component, a writer's own column, or
# `radius` off the encoding) and aims it with `target`. Per NODE, not per
# object — the one entry kind whose value varies inside an object.
fragment NetworkColorBy on NetworkColorBy {
  kind
  table
  column
  # Same whole-array-replace hazard as `MeshColorBy.joinPath` — see there.
  joinPath {
    table
    column
  }
  colormap
  min
  max
  label
  lens
  # The GRAPH arm. `target` says whether node glyphs are painted too (NODE) or
  # segments only (EDGE); a segment takes its START node's value either way,
  # since an edge owns no durable value of its own.
  attribute
  target
}

# One entry of a network layer's filter picker. A COLUMN or SPARSE rule keeps
# or drops whole objects; a GRAPH rule — always bounds, a graph attribute is
# measured — hides individual nodes and their segments ("trunk only" is
# strahler >= 3).
fragment NetworkFilterBy on NetworkFilterBy {
  kind
  table
  column
  joinPath {
    table
    column
  }
  label
  min
  max
  values
  exclude
  lens
  attribute
  target
}

# Not a TransferFunction: a label map has one source, no compositing tree, and
# none of an intensity image's vocabulary. `background` is the id painted fully
# transparent; `seed` seeds the id->color hash.
#
# Like a mesh layer, this publishes PICKERS rather than a single choice:
# `colorBys`/`filterBys` are what the layer offers (server-checked to be
# reachable and to exist) and the active indices are the choice. The deprecated
# singular `colorBy` is deliberately NOT selected — it is
# `colorBys[activeColorBy]` re-derived, and a second copy of a choice is a
# second thing to keep in sync.
fragment LabelRender on LabelRender {
  seed
  background
  opacity
  contour
  contourWidth
  selected
  selectionColor
  showUnselected
  colorBys {
    ...LabelColorBy
  }
  activeColorBy
  filterBys {
    ...LabelFilterBy
  }
  activeFilterBys
}

# Which channel a node samples is its `lens`: a single-channel crop of the
# layer's lens, named by a bare id. Null reads the layer's own selection. The
# id is resolved to a channel index at the model boundary
# (`platform/model/layerModel.ts`), never per frame.
fragment ChannelSourceNode on ChannelSourceNode {
  lens
  visible
  transfer {
    ...TransferFunction
  }
}

# A region of phasor space and the color the pixels inside it are painted — a
# color rule on the image, not a plot widget.
fragment PhasorCursor on PhasorCursor {
  kind
  label
  visible
  color
  g
  s
  radius
  points
}

# Not a TransferFunction: it maps the reduction's output — a (g, s) pair plus a
# photon count — rather than a sampled scalar. `intensity` is the ordinary
# transfer applied to that photon count.
fragment PhasorTransfer on PhasorTransfer {
  colormap
  mode
  min
  max
  weightByIntensity
  intensity {
    ...TransferFunction
  }
  cursors {
    ...PhasorCursor
  }
}

fragment PhasorNode on PhasorNode {
  phasorAxis
  harmonic
  # The channel whose photons are counted, as on `ChannelSourceNode`.
  lens
  visible
  # Aliased: `transfer` on a ChannelSourceNode is a TransferFunction, here it is
  # a PhasorTransfer. Same response key, different types — GraphQL rejects the
  # merge, so the phasor one gets its own key.
  phasorTransfer: transfer {
    ...PhasorTransfer
  }
}

# The fixed-shape phasor recipe a `PhasorLayer` carries as FIELDS, instead of a
# PhasorNode buried in a render graph. Same reduction, same transfer — the
# difference is only that the shape is declared rather than discovered, which is
# what lets the client skip the graph walk and specialise the material.
#
# No channel here: the layer's lens pins it.
fragment PhasorRender on PhasorRender {
  phasorAxis
  harmonic
  transfer {
    ...PhasorTransfer
  }
}

fragment RenderNodeCommon on LayerRenderNode {
  kind
  label
  ... on ChannelSourceNode {
    ...ChannelSourceNode
  }
  ... on PhasorNode {
    ...PhasorNode
  }
  ... on BlendNode {
    blending
  }
  ... on ProjectionNode {
    mode
  }
}

# GraphQL cannot express unbounded recursion, so the render-graph tree is
# expanded to a fixed depth (root BlendNode + 3 nested levels). Real graphs are
# shallow (Blend -> [Channel] or Blend -> Projection -> [Channel]).
fragment LayerRenderGraph on LayerRenderGraph {
  root {
    ...RenderNodeCommon
    children {
      ...RenderNodeCommon
      ... on BlendNode {
        children {
          ...RenderNodeCommon
          ... on BlendNode {
            children {
              ...RenderNodeCommon
            }
          }
          ... on ProjectionNode {
            children {
              ...RenderNodeCommon
            }
          }
        }
      }
      ... on ProjectionNode {
        children {
          ...RenderNodeCommon
          ... on BlendNode {
            children {
              ...RenderNodeCommon
            }
          }
          ... on ProjectionNode {
            children {
              ...RenderNodeCommon
            }
          }
        }
      }
    }
  }
}

fragment SceneLayer on Layer {
  __typename
  id
  kind
  name
  blending
  opacity
  visible
  order
  # Server-resolved path from this layer's source CS to the scene's world
  # system (null = unregistered, [] = source IS world). Selected for
  # PROVENANCE ONLY, never composed into a matrix on the client: scene
  # reconciliation keys off each step's id + version
  # (platform/model/sceneStructure.ts), and the placement inspector shows the
  # per-step validity/invariance/provenance.
  pathToWorld {
    ...PlacementStep
  }
  # The SAME path, composed by the server -- "`asAffine` is the same path
  # composed, for when you only need the map". This is the ONLY placement
  # authority on the client: it drops straight into `composeLayerAffine`
  # under the lens prefix, and into the collection / annotation / point /
  # track placements as-is. A client walk of the edges would be a second
  # source of truth that can disagree (the scene-28 arity bug was exactly
  # that), so there is none.
  #
  # Selected on the INTERFACE, so every layer kind gets it.
  #
  # NOTE this field ERRORS rather than returning null when a path exists but
  # will not condense (a FIELD step has no closed form; a singular step cannot
  # be inverted). The scene queries therefore set `errorPolicy: "all"` so that
  # nulls this one field instead of discarding the whole scene; a layer whose
  # `asAffine` is null is NOT DRAWN (`isPlaceable`, LayerRenderer) and its
  # card says why.
  asAffine {
    matrix
    inputAxes
    outputAxes
    # False = a partial registration: the map constrains only the axes in
    # `outputAxes` and the rest pass through as identity. Surfaced as a
    # warning rather than silently rendering as fully placed.
    total
    # Axes given by an array's values instead of a matrix row. A field read
    # along one source axis -- a lookup: the frames of an event-triggered movie
    # taken at uneven instants -- states inputAxis/innerScale/innerOffset, and
    # world value of source index i = scale * values[innerScale * i + innerOffset] + offset.
    # The array is fetched once per dataset (`axisTime.ts`). Any other field (a
    # warp, a lookup on a RENDERED axis) is placed but not drawable yet (`isPlaceable`).
    fields {
      outputAxis
      inputAxis
      innerScale
      innerOffset
      component
      scale
      offset
      dataset {
        id
        dataArrays {
          level
          store {
            id
            key
          }
        }
      }
    }
  }
  ... on ImageLayer {
    lens {
      ...SceneLens
    }
    # levelPaths is deliberately NOT selected: the octree renderer uses one
    # matrix per layer + relative level factors, so selecting it would pay a
    # server-side path resolution per pyramid level (duplicating the shared
    # registration tail) for zero client benefit. Reselect it when per-level
    # placement lands (COORDINATE_SYSTEMS.md §3.1).
    renderGraph {
      ...LayerRenderGraph
    }
  }
  # The three FIXED-SHAPE lens recipes. Each states its whole rendering as flat
  # fields rather than a render graph, which is exactly what lets the client
  # normalize them without a graph walk and specialise the material at build
  # time (see platform/model/layerModel.ts `renderKind`). `levelPaths` is
  # omitted for the same reason as on ImageLayer above.
  ... on IntensityLayer {
    lens {
      ...SceneLens
    }
    # No channel field: the lens IS one channel, its slice on
    # `renderAxes.intensity` says which.
    # Aliased: `colormap` is `ColorMap!` here and `ColorMap` on Point/Track
    # layers. Same response key, different nullability — GraphQL rejects the
    # merge, so the non-null one gets its own key (as `phasorTransfer` does).
    intensityColormap: colormap
    # The channel TINT, the same one an ImageLayer's channel node carries. A
    # monochrome acquisition shown in magenta is still ONE scalar source, so it
    # stays the "intensity" recipe — the tint is baked into the colormap-atlas
    # row exactly as a named ramp is (`buildColormapAtlas`).
    color
    climMin
    climMax
    gamma
    # A projection collapses z, it does not composite anything — which is why
    # `createVolumeLayer` returns an IntensityLayer with this set rather than a
    # kind of its own.
    projectionMode
  }
  ... on RgbLayer {
    lens {
      ...SceneLens
    }
    # The three planes, each a single-channel crop of `lens`. Slices only
    # (`ChannelLens`): the pyramid and the anchors are the parent's, above.
    redLens {
      ...ChannelLens
    }
    greenLens {
      ...ChannelLens
    }
    blueLens {
      ...ChannelLens
    }
    # ONE clim for all three planes: an RGB image is three views of one
    # acquisition, so per-plane contrast would misrepresent it.
    climMin
    climMax
    # Per-primary gains after that window; null = neutral.
    whiteBalance
  }
  ... on PhasorLayer {
    lens {
      ...SceneLens
    }
    phasorRender {
      ...PhasorRender
    }
  }
  # The sixth lens-backed kind, and the fourth fixed-shape recipe: a DISPLACEMENT
  # value axis read as geometry (glyphs), not composited as channels. `vectorAxis`
  # is DERIVED server-side from the axis types — never stored, never sent — and its
  # description fixes the component ORDER: position i displaces along the i-th
  # spatial axis in array order, so the last component displaces along x.
  ... on VectorLayer {
    lens {
      ...SceneLens
    }
    vectorAxis
    glyph
    glyphStride
    # Scene units per unit of magnitude; null auto-normalizes. A world-space
    # length, so meaningful only from SIMILARITY up (placementInvariance below).
    glyphScale
    # Aliased for IntensityLayer's reason: `ColorMap!` here, nullable on
    # Point/Track — same response key, different nullability, GraphQL rejects
    # the merge.
    vectorColormap: colormap
    color
    # MAGNITUDE window, not an intensity window: a vector length in the
    # component axis's unit. The columns are shared with intensity; the meaning
    # is not.
    climMin
    climMax
    placementInvariance
  }
  # Shares ImageLayer's source (a Lens over an array) and none of its render
  # settings: clim, gamma, colormaps and projections are all meaningless over
  # object ids. `labelRender` carries what replaces them. `levelPaths` is
  # omitted for the same reason as on ImageLayer above.
  ... on LabelLayer {
    lens {
      ...SceneLens
    }
    labelRender {
      ...LabelRender
    }
  }
  # A whole collection, not one shape: the styling that used to sit on the
  # layer moved onto each Annotation, so the layer selects only the drawing
  # surface and the renderer queries the shapes inside it.
  ... on AnnotationLayer {
    annotationCollection {
      ...AnnotationCollection
    }
    # The selection the layer draws: its collection, narrowed by the lens'
    # windows. `clip` is those windows in the collection's own space, always
    # applied; empty for a whole lens.
    lens {
      ...LayerLens
    }
    clip {
      ...LensWindow
    }
  }
  ... on PointLayer {
    tableDataset {
      ...TableDataset
    }
    # The selection the layer draws: its table, narrowed by the lens' windows.
    # `windowFilters` is those windows as filters the server ALWAYS applies, on
    # top of the picker's own; empty for a whole lens.
    lens {
      ...LayerLens
    }
    windowFilters {
      ...LabelFilterBy
    }
    # No x/y/z/t columns: the table's coordinate system (on `tableDataset`) has
    # one axis per coordinate column, typed, and the placement is stated over
    # them -- which column faces which screen axis is derived on ingest
    # (`viewLayer`), like an array lens' axes.
    sizeColumn
    idColumn
    pointSize
    colormap
    # The picker, the same one a label and a mesh layer publish.
    activeColorBy
    colorBys {
      ...LabelColorBy
    }
    activeFilterBys
    filterBys {
      ...LabelFilterBy
    }
    # Whether a world-space `pointSize` is a well-defined length at all: from SIMILARITY up.
    placementInvariance
  }
  ... on TrackLayer {
    tableDataset {
      ...TableDataset
    }
    # The selection the layer draws: its table, narrowed by the lens' windows.
    # `windowFilters` is those windows as filters the server ALWAYS applies, on
    # top of the picker's own; empty for a whole lens.
    lens {
      ...LayerLens
    }
    windowFilters {
      ...LabelFilterBy
    }
    trackIdColumn
    # x/y/z/t columns derived on ingest, as on PointLayer above.
    colorByColumn
    lineWidth
    colormap
    # Whether a world-space `lineWidth` is a well-defined length at all: from
    # SIMILARITY up. The schema names `lineWidth` explicitly among the scalars
    # this governs.
    placementInvariance
  }
  ... on MeshLayer {
    collection {
      ...MeshCollection
    }
    # The selection the layer draws: its collection, narrowed by the lens'
    # windows. `clip` is those windows in the collection's own space, always
    # applied; empty for a whole lens.
    lens {
      ...LayerLens
    }
    clip {
      ...LensWindow
    }
    materialColor
    wireframe
    # The stored shading seeds the session's `flatNormals` (SMOOTH → smooth
    # normals on); the card's toggle overrides it for the session.
    shading
    # The layer publishes PICKERS, not a single choice: `colorBys`/`filterBys`
    # are what it offers (server-checked to be reachable and to exist), and the
    # active indices are the choice. The deprecated singular `colorBy` is
    # deliberately NOT selected — it is `colorBys[activeColorBy]` re-derived,
    # and a second copy of a choice is a second thing to keep in sync.
    colorBys {
      ...MeshColorBy
    }
    activeColorBy
    filterBys {
      ...MeshFilterBy
    }
    activeFilterBys
  }
  # A fixture: one glTF scene of hardware around the sample. No data, so no
  # pickers: the model's own materials, or one `materialColor` over all of
  # them (null = as authored), and a wireframe toggle.
  ... on FixtureLayer {
    fixture {
      ...Fixture
    }
    lens {
      ...LayerLens
    }
    clip {
      ...LensWindow
    }
    materialColor
    wireframe
  }
  # A node/edge graph from a konnektion collection: a traced arbor, a vessel
  # tree, a connectome. Distinct from TrackLayer, which draws trajectories from
  # a table and can only express a PATH — a network has branch points.
  #
  # Publishes the two pickers now, with a third entry kind the other layer
  # types do not have: a GRAPH entry colours or filters per NODE, by a value
  # the collection itself carries (strahler, degree, depth, component, a
  # writer's own column, `radius` off the encoding) — resolved from the decoded
  # attribute blobs, never from a parquet lookup.
  ... on NetworkLayer {
    collection {
      ...NetworkCollection
    }
    # The selection the layer draws: its collection, narrowed by the lens'
    # windows. `clip` is those windows in the collection's own space, always
    # applied; empty for a whole lens.
    lens {
      ...LayerLens
    }
    clip {
      ...LensWindow
    }
    materialColor
    # The flat width of every segment, in SCENE units. Segments are drawn as
    # camera-facing quads rather than GL lines, which is the only reason a width
    # in scene units means anything — and it means it only from SIMILARITY up,
    # which is what `placementInvariance` below reports.
    lineWidth
    # Two declared width overrides that name PARQUET ATTRIBUTE COLUMNS, reached
    # through the join/attribute-plan machinery this layer type has no pickers
    # for. Selected so the card can say they are set and unimplemented rather
    # than ignore them silently; the renderer uses `lineWidth` plus the format's
    # own `radii` blob instead.
    nodeSizeColumn
    edgeWidthColumn
    # Both are RENDER settings, never facts about the graph: an edge is always
    # stored source-to-target whether or not its direction is drawn.
    directed
    showNodes
    # A budget capping octree depth, not a choice of level — which level is
    # fetched still follows from the zoom. Commonly moot: konnektion picks its
    # depth from the data and a traced arbor is usually single-level.
    maxLevel
    colorBys {
      ...NetworkColorBy
    }
    activeColorBy
    filterBys {
      ...NetworkFilterBy
    }
    activeFilterBys
    placementInvariance
  }
}

# Which axis of a lens is x, y, z, t, the value axis, the phasor axis and the
# displacement axis, as the server's convention suggests it before a layer
# exists (`ArrayLens.suggestedRenderAxes`). A drawn layer's axes are derived on
# the client from its placement and the view (`core/data/scene/coords/viewAxes.ts`).
fragment LayerRenderAxes on RenderAxes {
  x
  y
  z
  t
  intensity
  phasor
  vector
}
