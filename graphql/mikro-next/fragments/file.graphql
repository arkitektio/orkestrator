fragment File on File {
  descriptors
  id
  name
  store {
    ...BigFileStore
  }
  provenanceEntries {
    ...ProvenanceEntry
  }
  organization {
    id
    identifier
  }
  size
  contentType
  # Where the file is filed. Null is meaningful: a file nobody filed, or whose
  # folder was deleted (which unfiles, never destroys).
  folder {
    id
    name
  }
}

# The page's view of a file: `File` plus who made it, through what, and what
# the store says about the bytes. Kept off `File` itself because that fragment
# is what every file mutation returns, and none of them needs this.
fragment DetailFile on File {
  ...File
  creator {
    sub
  }
  createdThrough {
    id
    taskId
    createdAt
    assigner {
      sub
    }
  }
  store {
    id
    originalFileName
    # Measured when the upload finished; null while unfinished or for stores
    # written before this was recorded.
    sizeBytes
    contentType
  }
}

fragment ListFile on File {
  descriptors
  id
  name
  creator {
    sub
  }
  size
  contentType
}

# One end of a file↔container link, as the Info rail draws it.
#
# `container` is the union `ArrayDataset | TableDataset | MeshCollection |
# AnnotationCollection`, so the row is kind-blind by construction: this is why
# the rail can say what a CZI produced when a converter wrote a table and a
# mesh collection out of it, where the page body's `ArrayDatasetList` only ever
# sees the datasets.
#
# `seriesIdentifier` is part of the link's IDENTITY, not decoration — one
# multi-series LIF has one link per series, and without it two rows to the same
# file read as a duplicate.
#
# A MeshCollection's `name` is optional, so it is shown by `label`: the name,
# or its store's key when it has none.
fragment FileLink on FileLink {
  id
  direction
  seriesIdentifier
  valueRelation
  createdAt
  container {
    __typename
    ... on ArrayDataset {
      id
      name
    }
    ... on TableDataset {
      id
      name
    }
    ... on MeshCollection {
      id
      label
    }
    ... on AnnotationCollection {
      id
      name
    }
  }
}
