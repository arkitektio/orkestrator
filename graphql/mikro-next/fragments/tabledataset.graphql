# One declared column of a table dataset. A COORDINATE column is also an axis
# of the table's own coordinate system.
fragment TableDatasetColumn on Column {
  id
  name
  longName
  description
  dtype
  role
  axisType
  unit
  order
  # The two no-edge identifications a column can carry. `nodeReferences` is
  # what makes a table per-node or per-edge: an INDEX coordinate column whose
  # values are that network collection's NODE ids. One such column per
  # collection is a node table, two are an edge table — (source, target), in
  # column `order` — and the network styling reads the composite key columns
  # off exactly this.
  references {
    id
    name
  }
  nodeReferences {
    id
  }
}

fragment ListTableDataset on TableDataset {
  id
  name
  description
  axisNames
}

fragment TableDataset on TableDataset {
  id
  name
  description
  axisNames
  store {
    ...ParquetStore
  }
  columns {
    ...TableDatasetColumn
  }
  # The coordinate system this table owns — its axes are the table's coordinate
  # columns (or a single INDEX axis for a pure measurement table).
  coordinateSystem {
    ...CoordinateSystem
  }
}
