fragment Scene on Scene {
  descriptors
  id
  name
  # How the scene asks to be opened: flat, volumetric, or AUTO (no preference
  # stated — the viewer decides from the data). A preference, not a constraint:
  # nothing server-side reads it, and the viewer stays free to overrule it.
  preferredView
  # The viewer background as RGBA; null lets the viewer keep its own.
  backgroundColor
  # The named camera tours through this composition.
  animations {
    ...Animation
  }
  # The most recent picture of this composition — the tile to put on the scene.
  # Null until something snapshots it.
  latestSnapshot {
    ...SceneSnapshot
  }
  worldCoordinateSystem {
    ...CoordinateSystem
  }
  # scene.coordinateSystems and scene.registrations are deliberately NOT
  # selected: every edge self-describes its parameter order
  # (Transformation.inputAxes/outputAxes), and placement resolves entirely from
  # each layer's server-resolved pathToWorld plus the lens/dataArray toParent
  # edges — the raw space-wide edge set was payload with no client reader.
  layers {
    ...SceneLayer
  }
}

fragment ListScene on Scene {
  descriptors
  id
  name
  # The tile the card shows. Null until something snapshots the scene, so the
  # card must still stand on its own without one.
  latestSnapshot {
    ...SceneSnapshot
  }
}
