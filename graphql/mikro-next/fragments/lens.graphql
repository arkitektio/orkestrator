fragment DimSlice on Slice {
  axis
  start
  stop
  step
}

# Everything needed to reduce one axis of a lens to a phasor. Derived
# server-side from the dataset's calibration, lightpath and phasor spokes — a
# phasor render node states WHICH axis and harmonic, and reads the instrument
# facts from here.
fragment PhasorContext on PhasorContext {
  axis
  axisType
  bins
  binWidth
  harmonic
  laserFrequency
  window
  calibration {
    id
    harmonic
    phaseOffset
    modulationFactor
    reference
  }
  phasorHistogram {
    id
    bins
    counts
    gMin
    gMax
    sMin
    sMax
    profile
    total
    calibrated
  }
}

# What the RENDERER reads of a lens, and only an array lens is rendered through
# this: a table, mesh, network or annotation layer draws its container, narrowed
# by its lens' windows (`LensSubject`). Which axis is x, y, z is no longer here —
# "a selection does not choose how it is looked at" — it is the LAYER's
# `renderAxes` (`LayerRenderAxes`).
fragment SceneLens on ArrayLens {
  __typename
  descriptors
  id
  # What someone called the selection, if anyone did — `lensTitle` falls back to
  # "Whole array" or the slices.
  name
  shape
  axisNames
  # The phasor context at the server's default harmonic (1). A node on another
  # harmonic re-resolves it through the GetLensPhasor query — the calibration
  # and the persisted distribution are both harmonic-specific.
  phasor {
    ...PhasorContext
  }
  # Id-only: the lens CS's axes are its axisNames by contract ("a selection
  # never drops or reorders an axis"), so selecting them would only duplicate
  # axisNames.
  coordinateSystem {
    id
    name
  }
  toParent {
    ...Transformation
  }
  slices {
    ...DimSlice
  }
  dataset {
    id
    name
    axisNames
    shape
    multiscale
    # Id-only: consumed for CS-id matching (mesh anchoring, path prefixes);
    # its axis order is the dataset's axisNames by definition.
    intrinsicSystem {
      id
      name
    }
    dataArrays {
      id
      level
      shape
      chunkShape
      coordinateSystem {
        id
        name
      }
      toParent {
        ...Transformation
      }
      store {
        ...ZarrStore
      }
    }
  }
  activeAnchors {
    id
    coordinates
    valueHistogram {
      bins
      histogram
      min
      max
      p1
      p99
    }
    channelLabel {
      label
    }
    lightGraph {
      graph {
        ...LightpathGraph
      }
    }
  }
}

# One window of a non-array lens: an INCLUSIVE range on one axis of its
# container's space, an open side as null. `windowSummary` (`mikro/lenses.ts`)
# spells it.
fragment LensWindow on Window {
  axis
  min
  max
}

# What every lens answers, whatever it selects over. `kind` and `__typename`
# say the same thing twice on purpose: the enum is what a filter sends back, the
# typename is what TypeScript narrows on.
fragment LensCore on Lens {
  __typename
  descriptors
  id
  # What someone called the selection, if anyone did — `describeLens` falls
  # back to "Whole table" or the selection itself.
  name
  kind
  createdAt
  creator {
    sub
  }
  # The space the SELECTION lives in: its own for a sliced array lens, the
  # container's for every other lens.
  coordinateSystem {
    id
    name
  }
  # The scene the lens opens on. A whole lens answers with its container's, and
  # only an array dataset nominates one today.
  defaultScene {
    ...ListScene
  }
}

# What a lens selects OVER and what it selects: the container, and the slices
# (an array) or the windows (everything else). The one place the six kinds are
# spelled out; `describeLens` reads it.
fragment LensSubject on Lens {
  __typename
  ... on ArrayLens {
    shape
    axisNames
    slices {
      ...DimSlice
    }
    dataset {
      id
      name
      axisNames
      shape
    }
  }
  ... on TableLens {
    windows {
      ...LensWindow
    }
    tableDataset {
      id
      name
    }
  }
  ... on SparseLens {
    windows {
      ...LensWindow
    }
    sparseDataset {
      id
      name
    }
  }
  # Mesh and network collections have no name of their own: `version` is all
  # they can honestly show.
  ... on MeshLens {
    windows {
      ...LensWindow
    }
    meshCollection {
      id
      version
    }
  }
  ... on NetworkLens {
    windows {
      ...LensWindow
    }
    networkCollection {
      id
      version
    }
  }
  ... on AnnotationLens {
    windows {
      ...LensWindow
    }
    annotationCollection {
      id
      name
    }
  }
}

# The lens page's selection. Deliberately NOT `SceneLens`: that one carries
# the whole pyramid (every level's store and chunking), the phasor context and
# every anchor's histogram, because the renderer needs them to build a brick
# pool — and the page gets those through the scene it opens, not through this.
#
# The page is a workspace, so this carries what a workspace switches on: the
# scene the lens nominates and, for an array lens, every scene that draws it.
# Only an array lens can list its scenes; the others know their nomination and
# nothing else.
fragment DetailLens on Lens {
  ...LensCore
  ...LensSubject
  ... on ArrayLens {
    # The edge back into the dataset's pixel grid — "a crop is a translation of
    # the slice starts". Null for a full lens, whose space IS that grid, and the
    # single most informative fact about a sliced one.
    toParent {
      ...Transformation
    }
    dataset {
      id
      # THE whole-array lens. A dataset written before lenses were deduplicated
      # can carry several unsliced ones; the page forwards the others here so
      # the whole array has one address.
      fullLens {
        id
      }
    }
    scenes {
      ...ListScene
    }
    # What was computed from this selection. Same row shape as the dataset's own
    # lineage panel, so one row component draws both.
    derivedDatasets {
      ...DerivedDataset
    }
  }
}

# One row of the lens list, any kind.
fragment ListLens on Lens {
  ...LensCore
  ...LensSubject
  ... on ArrayLens {
    # The lens' own picture once it nominates a scene, its dataset's until then
    # — so a crop nobody has staged still has a tile. The other kinds have only
    # their nominated scene's (`lensSnapshot`).
    latestSnapshot {
      ...SceneSnapshot
    }
    # What the array structurally is. The whole lens' tile IS the dataset's
    # tile (the home page lists data as whole lenses), and that one leads with
    # the spec.
    dataset {
      id
      spec
      multiscale
    }
  }
}

# A layer's lens, as the layer panel names it: which container, which part.
# Every layer has one now. Not `LensCore`: a layer row needs no creator and no
# nominated scene.
fragment LayerLens on Lens {
  id
  name
  ...LensSubject
}
