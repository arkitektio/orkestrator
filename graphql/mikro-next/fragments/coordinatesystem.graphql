fragment Axis on Axis {
  id
  order
  name
  type
  unit
  longName
}

fragment ListCoordinateSystem on CoordinateSystem {
  id
  name
  # Only the discriminator: enough for a card or a graph node to say whether
  # this is a pure reference frame or a space something occupies, without
  # paying for each resident's own fields.
  residents {
    __typename
  }
}

# The data LIVING IN a space. A system no longer declares what it is — an empty
# `residents` is what a pure reference frame (a world, an atlas) *is*, and there
# is no separate kind to consult. Several residents may share one space: a
# dataset's own pyramid levels and unsliced lenses live in its grid, and a
# hundred tiles acquired on one stage sit in one stage frame.
#
# Each member selects only what the breadcrumb renders. A lens of any kind is
# told by its container and its selection (`LensSubject`); a DataArray has neither a name nor a
# back-reference to its dataset, so a pyramid level can name only its level.
fragment Resident on Resident {
  __typename
  ... on ArrayDataset {
    id
    name
  }
  ... on TableDataset {
    id
    name
  }
  ... on AnnotationCollection {
    id
    name
  }
  ... on MeshCollection {
    id
    version
  }
  ... on Lens {
    id
    ...LensSubject
  }
  ... on DataArray {
    id
    level
  }
  # Added by the backend after this fragment was written. Without an arm here the union
  # member selects only `__typename`, which is what made every consumer's `resident.id`
  # a type error.
  ... on SparseDataset {
    id
    name
  }
  # Same story as SparseDataset above, and the same failure mode if it is
  # omitted. A NetworkCollection has no name of its own, so `version` is all it
  # can honestly show — exactly as MeshCollection does.
  ... on NetworkCollection {
    id
    version
  }
}

fragment CoordinateSystem on CoordinateSystem {
  id
  name
  # The wall-clock instant the time axis has its origin at
  # (`wall_clock = epoch + t * unit`). A property of the space itself, and only
  # meaningful for a calibrated system with a TIME axis — null means the clock
  # is unanchored, NOT that the time axis is unusable: it is still a perfectly
  # composable relative coordinate.
  epoch
  # Who lives here — and, by its emptiness, whether anybody does. This is the
  # whole vocabulary now: an uninhabited space is a reference frame sources
  # register into and scenes adopt as their world; an inhabited one is the
  # grid, calibration or native space of the containers listed here.
  residents {
    ...Resident
  }
  axes {
    ...Axis
  }
}

# The concrete per-kind payload of a transformation edge, WITHOUT recursing
# into composite children — the leaf selection shared by every nesting depth
# in the Transformation fragment below.
#
# `inputAxes`/`outputAxes` are the SELF-DESCRIBED axis order of the edge's
# parameters (scale/translation/affine columns follow inputAxes) — the reason
# the scene fragment no longer needs to ship every coordinate system's axes.
fragment LeafTransformation on Transformation {
  __typename
  id
  kind
  name
  inputAxes
  outputAxes
  # How much this map is actually known. The schema is emphatic that an assumed
  # placement must be visible — "This map was assumed, never measured -- badge
  # it" — and a layer's validity is the WEAKEST edge on its path to world, so
  # this is per-edge or it is nothing.
  validity
  input {
    id
    name
  }
  output {
    id
    name
  }
  ... on ScaleTransformation {
    scale
  }
  ... on TranslationTransformation {
    translation
  }
  ... on AffineTransformation {
    affine
  }
  ... on RotationTransformation {
    affine
  }
  # A non-affine map given by the VALUES of an array (what DISPLACEMENTS and
  # COORDINATES used to be, merged: the offsets-vs-absolute-positions
  # distinction now lives in the field's own axes rather than in two edge
  # types). The field is a node of the graph, not a payload on the edge — so
  # this is the system it is a space of, and its lineage and axes are reachable
  # from there. No closed-form inverse, so a path never walks it backwards.
  ... on FieldTransformation {
    field {
      ...ListCoordinateSystem
    }
  }
  # A declared NON-correspondence (a feature table vs. the image it was measured
  # from). No parameters, no matrix, and no placement search walks it — so the
  # only thing to show is why.
  ... on UnmappableTransformation {
    reason
  }
}

# One step of a server-resolved placement path: the edge to walk, and whether
# to walk it output→input (in which case the client inverts the composed
# matrix before applying it).
fragment PlacementStep on PlacementStep {
  transformation {
    ...Transformation
    # A refinement rewrites the edge in place and bumps `version` — added on
    # top of the shared Transformation fragment (the attributeplan path does
    # the same) so (id, version) identifies the edge's STATE: the scene
    # provider's structural signature uses it to rebuild on registration
    # changes while ignoring content-only cache churn.
    version
  }
  inverted
}

# GraphQL cannot express unbounded recursion, so composite transformations
# (Sequence / ByDimension / Bijection) are expanded to a fixed depth with
# leaves inside. Real edges are shallow: a pyramid level is
# Sequence[Scale, Translation]; a scene registration is
# ByDimension[Identity | Affine] or a bare Affine.
fragment Transformation on Transformation {
  ...LeafTransformation
  ... on SequenceTransformation {
    transformations {
      ...LeafTransformation
    }
  }
  ... on ByDimensionTransformation {
    transformations {
      ...LeafTransformation
      ... on SequenceTransformation {
        transformations {
          ...LeafTransformation
        }
      }
    }
  }
}
