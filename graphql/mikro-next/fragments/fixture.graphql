# A fixture is ONE binary glTF (`.glb`) in a media store: a coverslip, a dish,
# a holder. The viewer fetches the file whole through a presigned URL
# (`getMikroMediaUrl`); there is no per-part API. Its coordinate system's axes
# carry the unit the exporter wrote, so the server's `asAffine` already
# converts millimetres into the world's micrometres.
fragment Fixture on Fixture {
  id
  name
  label
  # {min: [x, y, z], max: [x, y, z]} in the model's own axes and unit, read off
  # the file at registration. Null when the file declares none.
  bounds
  createdAt
  store {
    ...MediaStore
    originalFileName
  }
  coordinateSystem {
    ...CoordinateSystem
  }
  fullLens {
    id
  }
}

fragment ListFixture on Fixture {
  id
  name
  label
  createdAt
}

fragment DetailFixture on Fixture {
  ...Fixture
  folder {
    id
    name
  }
  descriptors
}
