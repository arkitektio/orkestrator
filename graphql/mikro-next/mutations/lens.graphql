# The same call for a lens a person cuts by hand. The server hands back the
# existing lens when this dataset already has one with these slices, so asking
# twice is safe and the result is always the lens to open.
mutation CreateListLens($input: CreateLensInput!) {
  createLens(input: $input) {
    ...ListLens
  }
}

mutation DeleteLens($id: ID!) {
  deleteLens(input: { id: $id })
}

# A lens has no name of its own to edit: this names the positions it pins (a
# channel, a frame), and every lens pinning them -- its crops, the sub-lens a
# scene draws the channel through -- is called by it. The others arrive through
# `WatchLenses`. `label: null` (or blank) removes the name, and what ingest
# recorded there (a channel label) names them again. Refused for a lens that pins
# nothing: a crop is named by the annotation it was cut to.
mutation SetPositionLabel($lens: ID!, $label: String) {
  setPositionLabel(input: { lens: $lens, label: $label }) {
    id
    name
    label
    # The anchor the label now sits on (made if there was none), so a scene
    # can show it without refetching the lens.
    nameAnchors {
      ...AnchorLabels
    }
  }
}

# The same call for the five window-selected kinds. Each takes its container and
# the windows; the server hands back the existing lens when the container
# already has one with these windows, and the WHOLE lens for no windows at all.
# None of these inputs takes a name: a lens is named by the positions it pins.
mutation CreateTableLens($input: CreateTableLensInput!) {
  createTableLens(input: $input) {
    ...ListLens
  }
}

mutation CreateSparseLens($input: CreateSparseLensInput!) {
  createSparseLens(input: $input) {
    ...ListLens
  }
}

mutation CreateMeshLens($input: CreateMeshLensInput!) {
  createMeshLens(input: $input) {
    ...ListLens
  }
}

mutation CreateFixtureLens($input: CreateFixtureLensInput!) {
  createFixtureLens(input: $input) {
    ...ListLens
  }
}

mutation CreateNetworkLens($input: CreateNetworkLensInput!) {
  createNetworkLens(input: $input) {
    ...ListLens
  }
}

mutation CreateAnnotationLens($input: CreateAnnotationLensInput!) {
  createAnnotationLens(input: $input) {
    ...ListLens
  }
}

# The lens FOR a selection, when only its id is wanted: one channel of a
# dataset to draw, one position of a matrix to colour by, a container's whole
# lens to make a layer from. The create mutations are idempotent, so this finds
# the lens that exists or makes it; `LensSelection` keeps the answer to an id
# and what it selects (`mikro/lib/lenses/lensRegistry.ts`).
mutation EnsureArrayLens($input: CreateLensInput!) {
  createLens(input: $input) {
    ...LensSelection
  }
}

mutation EnsureTableLens($input: CreateTableLensInput!) {
  createTableLens(input: $input) {
    ...LensSelection
  }
}

mutation EnsureSparseLens($input: CreateSparseLensInput!) {
  createSparseLens(input: $input) {
    ...LensSelection
  }
}

mutation EnsureMeshLens($input: CreateMeshLensInput!) {
