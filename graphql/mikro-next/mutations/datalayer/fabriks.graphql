mutation RequestGeneralFabriksAccess($input: RequestGeneralFabriksAccessInput!) {
  requestGeneralFabriksAccess(input: $input) {
    ...GeneralFabriksAccessGrant
  }
}

# The upload half of a fabriks prefix (features/meshes/fabriks/writer/
# fabriksUpload.ts): mint a scoped prefix grant, PUT every file, land
# `fabriks.json` LAST, then finish — the server reads the manifest and
# refuses a prefix without one.
mutation RequestFabriksUpload {
  requestFabriksUpload {
    ...FabriksUploadGrant
  }
}

mutation FinishFabriksUpload($input: FinishFabriksUploadInput!) {
  finishFabriksUpload(input: $input) {
    ...FabriksStore
  }
}
