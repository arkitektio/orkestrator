# Register an uploaded binary glTF as a fixture. `store` is the finished
# MediaStore id (`uploadMediaBlob`); the bounds are read from the file
# server-side, and `axes` carry the unit the exporter wrote.
mutation CreateFixture($input: CreateFixtureInput!) {
  createFixture(input: $input) {
    ...Fixture
  }
}

# `cascade` takes along everything made from it (see PreflightDeleteFixture);
# without it a delete of something anything was made from is refused.
mutation DeleteFixture($id: ID!, $cascade: Boolean = false) {
  deleteFixture(input: { id: $id, cascade: $cascade })
}

mutation CreateFixtureLayer($input: CreateFixtureLayerInput!) {
  createFixtureLayer(input: $input) {
    id
  }
}

mutation UpdateFixtureLayer($input: UpdateFixtureLayerInput!) {
  updateFixtureLayer(input: $input) {
    id
    materialColor
    wireframe
    opacity
    visible
  }
}
