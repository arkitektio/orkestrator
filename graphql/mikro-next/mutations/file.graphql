mutation from_file_like(
  $file: FileLike!
  $name: String!
  $folder: ID
) {
  fromFileLike(input: { file: $file, fileName: $name, folder: $folder }) {
    ...File
  }
}



# `cascade` takes along everything made from it (see PreflightDeleteFile);
# without it a delete of something anything was made from is refused.
mutation DeleteFile($id: ID!, $cascade: Boolean = false) {
  deleteFile(input: { id: $id, cascade: $cascade })
}
