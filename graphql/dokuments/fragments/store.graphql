# A file or page image: a media store of the organization. Its bytes are read
# with the session's general grant (`requestGeneralMediaAccess`, one per
# profile, covering every store of the organization), signed client-side.
fragment MediaStore on MediaStore {
  id
  key
  bucket
  path
  originalFileName
  sizeBytes
}

fragment GeneralMediaAccessGrant on GeneralMediaAccessGrant {
  accessKey
  secretKey
  sessionToken
  expiresIn
  region
  bucket
  prefix
}
