fragment Page on Page {
  id
  index
  content
  image {
    ...MediaStore
  }
  ocrResult {
    ...OCRPageResult
  }
}

# A page as a document's thumbnail strip shows it: no text, no OCR lines. The
# selected page is read in full (GetPage).
fragment ListPage on Page {
  id
  index
  image {
    ...MediaStore
  }
}
