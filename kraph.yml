overwrite: true
schema:
  "http://jhnnsrs-lab/kraph/schema":
    handleAsSDL: true
documents: "graphql/kraph/**/*.graphql"
generates:

  src/renderer/src/kraph/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  src/renderer/src/kraph/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/lib/kraph/funcs"
      # Reference fragment types by name instead of inlining them: deep fragments
      # otherwise blow graphql.ts up to many MB and stall tsc.
      inlineFragmentTypes: combine
      # No `scalars:` mapping. `GraphID` and `LocalID` were custom scalars that
      # packed a graph and a per-graph id into one opaque string; every id in the
      # API is a bare uuid now, so `ID` is the whole story.

  src/renderer/src/kraph/graphql.schema.json:
    plugins:
      - "introspection"

  graphql/schemas/kraph.graphql:
    plugins:
      - schema-ast
