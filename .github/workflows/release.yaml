name: Release and Publish

on:
  push:
    branches: [main, next]
  workflow_dispatch: {}

permissions:
  contents: write
      # electron-builder reads GH_TOKEN

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }         # semantic-release needs full history
      # Must run before setup-node, or `cache: pnpm` cannot find the executable.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # Must run before semantic-release: @semantic-release/github uploads
      # dist/catalog/*.json as assets of the release it is about to cut.
      - name: Export blok catalog
        run: pnpm catalog:export
      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }} # needs to be pat token
        run: pnpm exec semantic-release