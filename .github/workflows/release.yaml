name: Release and Publish

on:
  push:
    branches: [main, next]
  workflow_dispatch: {}

permissions:
  contents: write
      # electron-builder reads GH_TOKEN

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }         # semantic-release needs full history
      # Must run before setup-node, or `cache: pnpm` cannot find the executable.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # Must run before semantic-release: @semantic-release/github uploads
      # dist/catalog/*.json as assets of the release it is about to cut.
      - name: Export blok catalog
        run: pnpm catalog:export
      # The release's test: every service's documents against the schema a released build of
      # it serves. Writes src/renderer/src/tested.json, which the release commit carries. Skipped while
      # the documents are those of the last release: its stamp still holds.
      - name: Have the documents changed since the last release?
        id: documents
        run: |
          last="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$last" ] && grep -q '"' src/renderer/src/tested.json \
            && git diff --quiet "$last" HEAD -- graphql scripts/tested.mjs scripts/tested_hub.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.documents.outputs.changed == 'true'
      - name: Validate the documents against released services
        if: steps.documents.outputs.changed == 'true'
        env:
          SERVICE_TAG: ${{ vars.SERVICE_TAG || 'latest' }}
        run: uv run --with konstruktor scripts/tested_hub.py
      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }} # needs to be pat token
        run: pnpm exec semantic-release